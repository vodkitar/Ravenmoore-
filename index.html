     &&tileAt(P.x+(P.face?-5:P.w+4),P.y+P.h-4)==='D'){
    const q=(G.guardianes&&G.guardianes[G.lv])==='brocoli'?'BROCOLI':'CONEJITO';
    G.msg='CERRADA. HABLA CON '+q;G.msgT=110;SFX.no();
  }

  // conectores verticales

  if((t==='M'||tf==='M')&&IN.upP&&UPLINK[G.lv]&&guardiaViva()){avisoGuardia();}
  else if((t==='M'||tf==='M')&&IN.upP&&UPLINK[G.lv]){SFX.lift();const d=UPLINK[G.lv][1];
    fadeTo(()=>enterRoom(d,0,{x:TS*2,y:(ROWS-3)*TS}));}
  /* El atajo de la tienda sube de un tiron hasta la sala del ogro. */
  if((t==='A'||tf==='A')&&IN.upP&&guardiaViva()){avisoGuardia();}
  else if((t==='A'||tf==='A')&&IN.upP){SFX.lift();
    fadeTo(()=>enterRoom('p0',LEVELS.p0.rooms-1,{x:TS*2,y:(ROWS-3)*TS}));}
  if((t==='m'||tf==='m')&&IN.downP&&DOWNLINK[G.lv]&&guardiaViva()){avisoGuardia();}
  else if((t==='m'||tf==='m')&&IN.downP&&DOWNLINK[G.lv]){SFX.lift();const d=DOWNLINK[G.lv][1];
    fadeTo(()=>enterRoom(d,0,{x:TS*2,y:(ROWS-3)*TS}));}

  /* ---- cambio de sala / nivel ---- */
  transitions();

  /* ---- entidades ---- */
  ents.forEach(e=>{
    if(e.hit>0)e.hit--;
    if(e.chispas>0)e.chispas--;
    if(e.paralizado>0)e.paralizado--;
    const _px=e.x, _py=e.y;             // para congelarlo si esta paralizado
    if(e.caido>0){                      // zombi derrumbado: se recompone
      e.caido--;
      if(e.caido===0){e.alzandose=20;SFX.hueso();}
      if(e.vy!==undefined){e.vy=Math.min((e.vy||0)+.35,6);
        const ny=e.y+e.vy;
        if(!boxSolid(e.x+1,ny,e.w||12,e.h||14))e.y=ny;
        else{e.y=Math.floor((ny+(e.h||14))/TS)*TS-(e.h||14);e.vy=0;}}
      return;                           // ni se mueve ni hace dano mientras yace
    }
    if(e.alzandose>0)e.alzandose--;
    let w,h;
    if(e.type==='mini'){ w=e.w; h=e.h; }
    else {
      /* El Nazgul y el Dementor traen sprites mayores que el resto, asi que
         llevan caja propia. Ambas cubren solo el cuerpo, no las alas ni los
         jirones: no deberian herir por el borde de la tunica. */
      w=e.w=(e.type==='boss'?20:(e.type==='ghost'?10:(e.type==='spider'?10:
             (e.type==='nazgul'?14:(e.type==='dementor'?12:12)))));
      h=e.h=(e.type==='boss'?21:(e.type==='bat'?8:(e.type==='vampiro'||e.type==='zombi'?14:
             (e.type==='dementor'?14:(e.type==='nazgul'?20:10)))));
    }
    // retroceso: mientras dura, sustituye al movimiento normal
    if(e.kb){
      const nx=e.x+e.kb;
      const flota=(e.type==='bat'||e.type==='ghost'||e.type==='spider'
                 ||e.type==='sirena'||e.type==='diablillo'||e.type==='mago_e');
      const pieX=e.kb>0?nx+w:nx-1;
      const alPinche=!flota&&(HURT(tileAt(pieX,e.y+h+2))||HURT(tileAt(pieX,e.y+h-1)));
      /* No basta con que el borde de ataque pise firme: con el borde sobre
         la orilla y el cuerpo al aire, el enemigo quedaba colgado sobre el
         foso. Se exige suelo firme bajo el centro y bajo el borde que avanza. */
      const bordeDentro=e.kb>0?nx+w-1:nx;
      const apoyado=flota||(firmeBajo(nx+w/2,e.y+h-1)&&firmeBajo(bordeDentro,e.y+h-1));
      if(!boxSolid(nx,e.y+2,w,h-4)&&!alPinche&&apoyado)e.x=nx; else e.kb=0;
      e.kb*=.80; if(Math.abs(e.kb)<.12)e.kb=0;
    }
    else if(e.type==='rat'||e.type==='skel'||e.type==='zombi'||e.type==='vampiro'||e.type==='armadura'||e.type==='arquero_e'||e.type==='nazgul'){
      e.t+=.05;
      // el esqueleto arroja un hueso cada 3-4 segundos si te tiene a tiro
      // la armadura arroja su yelmo como un bumeran y se queda descubierta
      if(e.type==='armadura'){
        if(e.tiro===undefined)e.tiro=ri(100,180);
        if(!e.sinYelmo&&cuentaRecarga(e)&&--e.tiro<=0){
          e.tiro=ri(160,240);
          const dir=P.x<e.x?-1:1;
          e.vx=Math.abs(e.vx)*dir; e.sinYelmo=true;
          shots.push({tipo:'yelmo',duenyo:e,x:e.x+2,y:e.y+1,vx:3.1*dir,vy:0,
            giro:0,ida:90,t:0,dmg:2});
          SFX.hueso();
        }
      }
      if(e.type==='nazgul'){
        /* MAYAL: lo lanza en arco hacia el heroe y despues tira de la cadena
           para recogerlo. Tiene alcance corto, asi que se le puede torear a
           distancia; de cerca es donde muerde. Envenena al tocar. */
        if(e.esquivo>0)e.esquivo--;
        if(e.tiro===undefined)e.tiro=ri(80,150);
        const dxn=(P.x+P.w/2)-(e.x+e.w/2);
        if(!e.mayal&&cuentaRecarga(e)&&--e.tiro<=0&&Math.abs(dxn)<108){
          e.tiro=ri(120,190); e.lanzando=18;
          const dir=dxn<0?-1:1;
          e.vx=Math.abs(e.vx)*dir;
          const T=30, GR=.18;
          const ox=e.x+e.w/2, oy=e.y+6;
          const dy=(P.y+P.h/2)-oy;
          e.mayal={x:ox,y:oy,vx:dxn/T,vy:(dy-.5*GR*T*T)/T,t:0,vuelta:0,giro:0};
          SFX.hueso();
        }
        if(e.mayal){
          const M=e.mayal, ox=e.x+e.w/2, oy=e.y+6;
          M.t++; M.giro+=.5;
          if(!M.vuelta){
            M.vy+=.18; M.x+=M.vx; M.y+=M.vy;
            // alcance limitado: pasado el tirante, la cadena tira de vuelta
            if(M.t>34||Math.hypot(M.x-ox,M.y-oy)>92)M.vuelta=1;
          } else {
            const dx2=ox-M.x, dy2=oy-M.y, d2=Math.hypot(dx2,dy2)||1;
            M.x+=dx2/d2*4.2; M.y+=dy2/d2*4.2;
            if(d2<7)e.mayal=null;
          }
          if(e.mayal&&P.inv<=0&&rect(P.x,P.y,P.w,P.h,M.x-4,M.y-4,9,9)){
            damage(1);
            /* Veneno: dos segundos y medio de paso corto. Se reutiliza el
               abatimiento del Dementor, que ya esta acotado para no dejar
               ningun salto obligatorio fuera de alcance. */
            P.abatido=Math.max(P.abatido||0,125);
            SFX.magia('hielo');
          }
        }
      }
      if(e.type==='arquero_e'){
        /* Dos formas de tirar segun donde este el heroe:
           - a su misma altura: flecha recta y rapida, y ademas guarda las
             distancias en vez de acercarse, que para eso tiene arco.
           - a distinta altura: tiro parabolico resuelto para caer sobre el,
             que es lo unico que puede alcanzarle en otra plataforma. */
        if(e.tiro===undefined)e.tiro=ri(70,140);
        const mismaAltura=Math.abs((e.y+e.h)-(P.y+P.h))<14;
        const dx=(P.x+P.w/2)-(e.x+e.w/2);
        if(cuentaRecarga(e)&&--e.tiro<=0){
          e.tiro=ri(90,150); e.lanzando=14;
          const ox=e.x+e.w/2, oy=e.y+3;
          if(mismaAltura){
            const dir=dx<0?-1:1;
            e.vx=Math.abs(e.vx)*dir;
            shots.push({tipo:'hueso_f',x:ox,y:oy,vx:dir*2.9,vy:0,
              t:0,dmg:1,an:10,al:3,vida:200});
          } else {
            // balistica: se resuelve la velocidad para T fotogramas de vuelo
            const T=52, GR=.13;
            const dy=(P.y+P.h/2)-oy;
            shots.push({tipo:'hueso_f',x:ox,y:oy,
              vx:dx/T, vy:(dy-.5*GR*T*T)/T, grav:GR,
              t:0,dmg:1,an:10,al:3,vida:240});
          }
          SFX.hueso();
        }
        // a su altura mantiene la distancia; si no, sigue su ronda normal
        if(mismaAltura&&Math.abs(dx)<52) e.vx=Math.abs(e.vx)*(dx<0?1:-1);
      }
      if(e.type==='skel'){
        if(e.tiro===undefined)e.tiro=ri(90,200);
        if(cuentaRecarga(e)&&--e.tiro<=0){
          e.tiro=ri(150,200);                       // 3 a 4 segundos a 50 Hz
          const dir=P.x<e.x?-1:1;
          e.vx=Math.abs(e.vx)*dir;                  // se gira antes de lanzar
          shots.push({tipo:'hueso',x:e.x+4,y:e.y-2,vx:1.5*dir,vy:-2.3,grav:.12,
            giro:0,t:0,dmg:1});
          SFX.hueso();
          e.lanzando=18;
        }
        if(e.lanzando>0){e.lanzando--;}
      }
      // gravedad propia: nunca se quedan flotando
      e.vy=Math.min((e.vy||0)+.35,5);
      const ny=e.y+e.vy;
      let aterrizo=false;
      if(!boxSolid(e.x+1,ny,w-2,h))e.y=ny;
      else{e.y=Math.floor((ny+h)/TS)*TS-h;if(e.vy>0)aterrizo=true;e.vy=0;}
      // el aterrizaje lo marca la propia colision, no un sondeo aparte:
      // sondeando fallaba al caer justo en el borde y se quedaban tontos
      if(aterrizo){e.saltando=0;e.saltoVx=0;e.atasco=0;e.tSalto=0;}
      if(e.saltando){
        e.tSalto=(e.tSalto||0)+1;
        if(e.tSalto>70){e.saltando=0;e.saltoVx=0;e.tSalto=0;}  // seguro
      }

      const pieY=e.y+h+2, delX=e.vx>0?e.x+w+1:e.x-2;
      const casillaPie=tileAt(delX,pieY);
      const haySuelo=SOLID(casillaPie);
      const peligro=HURT(casillaPie)||HURT(tileAt(delX,e.y+h-1))||HURT(tileAt(delX,e.y+2));
      const muro=boxSolid(e.vx>0?e.x+w:e.x-2,e.y+3,2,5);
      const fueraRango=Math.abs(e.x-e.ox)>e.rng;

      /* Si ya esta dentro del foso, salta hacia la orilla mas cercana:
         de otro modo se queda encerrado entre las paredes del hueco. */
      const bajoPies=tileAt(e.x+w/2,e.y+h+2);
      const enFoso = HURT(bajoPies) || HURT(tileAt(e.x+w/2,e.y+h-1));
      if(enFoso&&Math.abs(e.vy)<.01){
        let dir=0;
        for(let d=1;d<=5&&!dir;d++){
          if(SOLID(tileAt(e.x+w/2+d*TS,e.y+h+2))&&!HURT(tileAt(e.x+w/2+d*TS,e.y+h+2)))dir=1;
          else if(SOLID(tileAt(e.x+w/2-d*TS,e.y+h+2))&&!HURT(tileAt(e.x+w/2-d*TS,e.y+h+2)))dir=-1;
        }
        if(dir){ e.vx=Math.abs(e.vx)*dir; e.vy=-4.6; e.saltando=1; e.saltoVx=dir*2.0; }
      }

      /* Si delante hay foso pero al otro lado hay suelo firme, lo salta
         en vez de darse la vuelta o quedarse atrapado dentro. */
      let salta=false;
      if((!haySuelo||peligro)&&!muro&&Math.abs(e.vy)<.01){
        const dir=e.vx>0?1:-1;
        for(let d=2;d<=4;d++){
          const destino=tileAt(e.x+w/2+dir*d*TS, pieY);
          const libre=!SOLID(tileAt(e.x+w/2+dir*d*TS, e.y+h-2));
          if(SOLID(destino)&&!HURT(destino)&&libre){salta=true;break;}
        }
        if(salta){ e.vy=-4.6; e.saltando=1; e.saltoVx=(e.vx>0?1:-1)*2.0; }
      }
      // tambien salta si esta dentro de un hueco y no puede avanzar
      if(!salta&&muro&&Math.abs(e.vy)<.01&&SOLID(tileAt(e.x+w/2,e.y+h+2))&&e.atasco>18){
        e.vy=-4.6;e.atasco=0;e.saltoVx=(e.vx>0?1:-1)*2.0;e.saltando=1;
      }
      e.atasco=(muro||(!haySuelo&&!salta))?(e.atasco||0)+1:0;

      if(e.acorralado>0){
        /* Acorralado: en una repisa mas estrecha que su propia zancada, o
           encajonado. Girar aqui no lleva a ninguna parte y produce la
           vibracion de izquierda a derecha en la misma casilla. Se planta
           un rato, que ademas lee como que vigila el sitio. */
        e.acorralado--;
      }
      else if(e.saltando){
        // en el aire vale el impulso del salto: 3,2 casillas de alcance,
        // suficiente para cruzar un foso de 2 mas su propio ancho
        const nx=e.x+e.saltoVx;
        if(!boxSolid(nx,e.y+2,w,h-4))e.x=nx; else {e.saltoVx*=-.4;}

      }
      else if(salta){
        e.x+=e.saltoVx||0;
      } else if(fueraRango||muro||!haySuelo||peligro){
        e.vx*=-1; e.x+=e.vx*2;               // media vuelta y un paso atras
        e.giros=(e.giros||0)+1; e.xGiro=e.x;
        // cuatro topes sin haber recorrido nada: no es patrulla, es jaula
        if(e.giros>=3){ e.acorralado=120; e.giros=0; }
      } else {
        e.x+=e.vx*(e.lento>0?.28:1);
        /* El contador solo se borra si de verdad ha salido del atolladero.
           Borrarlo tras un unico paso normal era el fallo: entre giro y
           giro siempre cabe un fotograma bueno, y nunca se acumulaban. */
        if(e.xGiro===undefined||Math.abs(e.x-e.xGiro)>12) e.giros=0;
      }
      // flotacion visual del vampiro, sin tocar la fisica
      e.fl=e.type==='vampiro'?-Math.abs(Math.sin(e.t*.6))*3:0;
    } else if(e.type==='dementor'){
      /* Flota siguiendo al heroe sin prisa. No hace falta que sea rapido:
         basta con que no se le pueda quitar de encima. */
      e.t+=.05;
      const dx=(P.x+P.w/2)-(e.x+w/2), dy=(P.y+P.h/2)-(e.y+h/2);
      const d=Math.hypot(dx,dy)||1;
      e.x+=dx/d*.62; e.y+=dy/d*.5+Math.sin(e.t*2.2)*.25;
      e.y=Math.max(10,Math.min((ROWS-1)*TS-h-2,e.y));
      e.face=dx<0?1:0;
      if(P.inv<=0&&rect(P.x,P.y,P.w,P.h,e.x,e.y,w,h)){
        /* Abatimiento: dos segundos con el paso corto y el salto mermado.
           Nunca lo anula del todo, para que ningun salto obligatorio se
           vuelva imposible. */
        P.abatido=100; SFX.magia('hielo');
      }
    } else if(e.type==='bat'){
      e.t+=.055; e.x+=e.vx;
      if(Math.abs(e.x-e.ox)>e.rng||boxSolid(e.x+(e.vx>0?w:-1),e.y+3,2,4))e.vx*=-1;
      e.y=e.oy+Math.sin(e.t)*16;
    } else if(e.type==='sirena'){
      // asoma y se hunde en el agua, cantando notas en diagonal
      e.t+=.03;
      e.x+=e.vx; if(Math.abs(e.x-e.ox)>e.rng)e.vx*=-1;
      e.y=e.oy+Math.sin(e.t*1.4)*7;
      if(e.canta===undefined)e.canta=ri(70,140);
      // una sola nota cada vez, que persigue al heroe y se apaga a los 6 s
      if(--e.canta<=0&&!shots.some(o=>o.tipo==='nota'&&o.duenyo===e)){
        e.canta=ri(110,170);
        const dx=P.x+P.w/2-(e.x+4), dy=P.y+P.h/2-(e.y+4), d=Math.hypot(dx,dy)||1;
        shots.push({tipo:'nota',duenyo:e,tono:(e.t*7|0)%4,x:e.x+4,y:e.y+4,
          vx:dx/d*1.4,vy:dy/d*1.4,dirigido:true,giroMax:.045,vmax:1.7,
          atraviesa:true,vida:300,t:0,dmg:2});
        SFX.nota(); e.brillo=25;
      }
      if(e.brillo>0)e.brillo--;
    } else if(e.type==='mago_e'){
      // vuela, se posa, y de vez en cuando se desvanece y reaparece
      // en el lado simetrico de la sala
      e.t+=.04;
      if(e.oculto>0){
        e.oculto--;
        if(e.oculto===0){ e.x=VW-e.x-w; SFX.magia('rayo'); }
      } else {
        if(e.fase===undefined){e.fase='vuela';e.faseT=ri(90,160);}
        if(--e.faseT<=0){
          if(e.fase==='vuela'){e.fase='posado';e.faseT=ri(70,120);}
          else if(e.fase==='posado'){e.oculto=50;e.fase='vuela';e.faseT=ri(90,160);}
        }
        if(e.fase==='vuela'){
          e.x+=e.vx; if(e.x<16||e.x>VW-16-w)e.vx*=-1;
          e.y=e.oy+Math.sin(e.t*1.1)*14;
        } else {
          // desciende hasta el suelo y se queda quieto
          const ny=e.y+1.4;
          if(!boxSolid(e.x+2,ny,w-4,h))e.y=ny;
        }
        if(e.hechizo===undefined)e.hechizo=ri(80,140);
        if(--e.hechizo<=0){
          e.hechizo=ri(110,170);
          // hechizo dirigido a la posicion del heroe
          const dx=P.x+P.w/2-(e.x+w/2), dy=P.y+P.h/2-(e.y+h/2), d=Math.hypot(dx,dy)||1;
          shots.push({tipo:'sombra',x:e.x+w/2,y:e.y+h/2,vx:dx/d*1.9,vy:dy/d*1.9,t:0,dmg:2});
          SFX.magia('hielo'); e.lanza=16;
        }
        if(e.lanza>0)e.lanza--;
      }
    } else if(e.type==='diablillo'){
      // bebe demonio: vuela erratico y escupe bolas de fuego teledirigidas
      e.t+=.05;
      e.x+=e.vx; if(e.x<14||e.x>VW-14-w)e.vx*=-1;
      e.y=e.oy+Math.sin(e.t*1.6)*12+Math.sin(e.t*.7)*6;
      if(e.escupe===undefined)e.escupe=ri(90,160);
      if(--e.escupe<=0){
        e.escupe=ri(130,200);
        const dx=P.x+P.w/2-(e.x+w/2), dy=P.y+P.h/2-(e.y+h/2), d=Math.hypot(dx,dy)||1;
        shots.push({tipo:'fuego_e',dirigido:true,x:e.x+w/2,y:e.y+h/2,
          vx:dx/d*1.5,vy:dy/d*1.5,t:0,dmg:2,vida:260});
        SFX.magia('fuego'); e.escupiendo=18;
      }
      if(e.escupiendo>0)e.escupiendo--;
    } else if(e.type==='ghost'){
      // Un fantasma atraviesa los muros y no tiene correa: antes se frenaba
      // en seco al llegar a su rango y parecia chocar con algo invisible.
      const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
      // inercia suave, pero a la velocidad de siempre: 0,45 y 0,34 px/frame
      e.vfx=(e.vfx||0)*.9+dx/d*.045;
      e.vfy=(e.vfy||0)*.9+dy/d*.034;
      e.x+=e.vfx; e.y+=e.vfy;
      e.y+=Math.sin(e.t*2.2)*.18;          // flotacion
      e.x=Math.max(6,Math.min(VW-6-w,e.x));
      e.y=Math.max(6,Math.min(PH-6-h,e.y));
    } else if(e.type==='spider'){
      /* Cuelga de un hilo vertical y lo recorre entero, de arriba abajo.
         El recorrido se fija UNA vez, al entrar en la sala: antes se
         recalculaba cada 30 fotogramas en funcion de donde estuviera el
         heroe, asi que la arana cambiaba de rango a media bajada y el
         movimiento salia a tirones. */
      if(e.anclaY===undefined){
        const col=Math.floor((e.x+w/2)/TS);
        // techo: primera casilla solida por encima del punto de aparicion
        let anc=0;
        for(let y=Math.floor(e.oy/TS);y>=0;y--){
          const c=G.room.m[y]&&G.room.m[y][col];
          if(c==='#'||c==='='||c==='P'||c==='B'){anc=(y+1)*TS;break;}
        }
        // suelo: primera casilla solida por debajo
        let fondo=PH-h;
        for(let y=Math.floor((e.oy+h)/TS);y<ROWS;y++){
          const c=G.room.m[y]&&G.room.m[y][col];
          if(c==='#'||c==='='||c==='P'){fondo=y*TS-h-1;break;}
        }
        e.anclaY=Math.min(anc,e.oy);
        e.tope=Math.max(e.anclaY+TS,fondo);
        e.y=e.anclaY; e.dir=1; e.pausa=0;
      }
      e.t+=.03;
      // vaiven a velocidad constante, con una pausa breve en cada extremo
      if(e.pausa>0)e.pausa--;
      else{
        e.y+=.42*e.dir;
        if(e.y>=e.tope){e.y=e.tope;e.dir=-1;e.pausa=ri(15,40);}
        else if(e.y<=e.anclaY){e.y=e.anclaY;e.dir=1;e.pausa=ri(15,40);}
      }
      /* Escupe una telarana a donde este el heroe en ese instante, en linea
         recta: con gravedad caia y no acertaba nunca. No hace dano, solo
         inmoviliza. Una sola en vuelo por arana. */
      if(e.tela===undefined)e.tela=ri(90,170);
      if(--e.tela<=0){
        e.tela=ri(150,240);
        if(Math.abs(P.x-e.x)<110&&!shots.some(o=>o.tipo==='tela'&&o.duenyo===e)){
          const ox=e.x+w/2, oy=e.y+h-1;
          const dx=P.x+P.w/2-ox, dy=P.y+P.h/2-oy, d=Math.hypot(dx,dy)||1;
          shots.push({tipo:'tela',duenyo:e,x:ox-3,y:oy,
            vx:dx/d*2.3,vy:dy/d*2.3,giro:0,t:0,dmg:0,vida:200});
          SFX.tela();
          e.escupe=14;
        }
      }
      if(e.escupe>0)e.escupe--;
    } else if(e.type==='mini'){
      e.t++;
      const w=e.w,h=e.h, suelo=(ROWS-1)*TS-h;
      const haciaP=P.x<e.x?-1:1;
      if(e.clase!=='volador'&&e.clase!=='cuervo'&&e.clase!=='gargola'&&e.clase!=='sirena'&&!(e.clase==='tomos'&&e.hab)){
        e.vy=Math.min((e.vy||0)+.35,6);
        const ny=e.y+e.vy;
        if(!boxSolid(e.x+2,ny,w-4,h))e.y=ny;
        else{
          // aterrizaje: se marca para que el dibujo lo acuse con un aplaste
          if(e.vy>1.5)e.aterrizo=6;
          e.y=Math.floor((ny+h)/TS)*TS-h;e.vy=0;
        }
      }
      /* ENFADO DEL OGRO. Cada 30% de vida perdida se lanza a embestir: es
         inmune mientras corre, se estrella contra la pared de enfrente y
         queda aturdido 1 s. Ese aturdimiento es la ventana de castigo, asi
         que ahi SI se le puede pegar. Mientras dura todo esto no ataca. */
      if(e.clase==='ogro'){
        if(e.maxhp===undefined)e.maxhp=e.hp;
        const perdida=1-Math.max(0,e.hp)/e.maxhp;
        const escalon=Math.floor(perdida/0.30);
        if(escalon>(e.enfados||0)&&!e.embiste&&!(e.stun>0)){
          /* Se planta y brama medio segundo ANTES de arrancar. Sin ese
             aviso la embestida salia de la nada y comerla era inevitable
             para un heroe cuerpo a cuerpo, que es justo el que esta cerca. */
          e.enfados=escalon;
          e.preEmb=30;
          e.embDir=((P.x+P.w/2)<(e.x+w/2))?-1:1;
          e.rafaga=0;                       // corta la tanda de garrotes
          SFX.rugido(); G.shake=6;
        }
      }
      /* EXTASIS DEL GUARDIAN: al bajar de la mitad de vida, una sola vez,
         se eleva al centro de la sala blindado y descarga tres tacadas. */
      if(e.clase==='tomos'){
        if(e.maxhp===undefined)e.maxhp=e.hp;
        if(!e.extasis&&e.hp<=e.maxhp*0.5&&!e.hab){
          e.extasis=1; e.hab=1; e.fase=0; e.invulnerable=true;
          e.tacadas=3; e.tacCd=0; e.anim=20;
          SFX.magia('rayo'); G.shake=7;
        }
      }
      if(e.preEmb>0){                 // plantado, avisando: aun no se mueve
        e.preEmb--;
        if(e.preEmb===0){ e.embiste=1; e.invulnerable=true; SFX.rugido(); }
      }
      else if(e.embiste||e.stun>0){
        if(e.stun>0){
          e.stun--;
          if(e.stun===0){ e.face=e.face?0:1; }   // se rehace y da media vuelta
        } else {
          e.face=e.embDir<0?1:0;
          /* Se comprueba el MURO DE VERDAD, no la coordenada del borde de la
             sala. Con la coordenada, cualquier cosa que frenara al ogro antes
             de llegar a ella dejaba la condicion sin cumplirse nunca y se
             quedaba embistiendo contra la pared para siempre. */
          const nx=e.x+e.embDir*3.0;
          if(boxSolid(nx+2,e.y+2,w-4,h-4)||nx<8||nx>VW-8-w){
            e.x=Math.max(8,Math.min(VW-8-w,e.x));
            e.embiste=0; e.stun=50;              // 1 s a 50 Hz
            e.invulnerable=false;                // aqui es donde se le castiga
            e.ataque=Math.max(e.ataque||0,70);
            G.shake=10; beep(70,.35,'sawtooth',.09,-30);
          } else e.x=nx;
        }
      }
      else if(cuentaRecarga(e)&&--e.ataque<=0){
        if(e.clase==='ogro'){
          /* Tres garrotazos en arco, uno detras de otro. La punteria alterna
             entre donde ESTA el heroe y donde VA A ESTAR: contra un jugador
             quieto acierta el directo, y contra uno que corre acierta el
             anticipado, asi que no hay una sola forma de esquivarlos todos. */
          if(e.rafaga===undefined||e.rafaga<=0)e.rafaga=3;
          e.face=haciaP<0?1:0; e.anim=20;
          /* Vuelo mas lento y arco mas alto: a 42 fotogramas cruzaban la
             sala como una bala y no daba tiempo ni a verlos. */
          const T=68, GRAV=.20;
          const anticipa=(e.rafaga%2===0);
          const bruto=(P.x+P.w/2)+(anticipa?(P.vx||0)*T:0);
          const destX=Math.max(12,Math.min(VW-12,bruto));
          const ox=e.x+w/2, oy=e.y+4;
          const dx=destX-ox, dy=(P.y+P.h-5)-oy;
          shots.push({tipo:'garrote',x:ox,y:oy,
            vx:dx/T, vy:(dy-.5*GRAV*T*T)/T, grav:GRAV,
            giro:0,t:0,dmg:2,an:13,al:13,vida:260});
          SFX.rugido();
          e.rafaga--;
          e.ataque=(e.rafaga>0)?24:ri(120,170);
        } else if(e.clase==='momia'&&e.ultima!=='ovillos'&&!(e.rafaga>0)){
          /* OVILLOS: dos madejas de vendas en arco, una corta y otra larga,
             para que no se puedan saltar las dos con el mismo salto. */
          e.ultima='ovillos'; e.anim=20; e.face=haciaP<0?1:0;
          const ox=e.x+w/2, oy=e.y+4;
          [[1.5,-2.9],[2.5,-2.0]].forEach(([vx,vy])=>{
            shots.push({tipo:'ovillo',x:ox,y:oy,vx:vx*haciaP,vy,grav:.16,
              giro:0,t:0,dmg:2,an:8,al:8,vida:300});
          });
          SFX.venda();
          e.ataque=ri(150,200);
        } else if(e.clase==='momia'){
          e.ultima='vendas';
          // arroja vendas que se enredan en el heroe y lo frenan
          e.anim=22; e.face=haciaP<0?1:0;
          // rafaga de dos o tres vendas: se enredan unas sobre otras
          if(e.rafaga===undefined||e.rafaga<=0){e.rafaga=ri(2,3);}
          const dxm=P.x+P.w/2-(e.x+w/2), dym=P.y+P.h/2-(e.y+6), dm=Math.hypot(dxm,dym)||1;
          shots.push({tipo:'venda',x:e.x+w/2,y:e.y+6,
            vx:dxm/dm*1.9,vy:dym/dm*1.9,dirigido:true,giroMax:.03,vmax:2.1,
            t:0,dmg:1,vida:220});
          SFX.venda();
          e.rafaga--;
          e.ataque=(e.rafaga>0)?18:ri(110,150);
        } else if(e.clase==='verdugo'){
          if(e.ultima==='guadanas'){
            // misma embestida imparable que la Armadura Viviente
            e.ultima='embiste';
            e.face=haciaP<0?1:0;
            e.preArm=28; e.embDir=haciaP;   // medio segundo de aviso antes de arrancar
            SFX.rugido(); G.shake=5;
            e.ataque=130;
          } else {
            /* GUADANAS: dos hojas que giran sobre si mismas y describen un
               circulo cada vez mas abierto alrededor del Verdugo. Salen
               enfrentadas para que el circulo se barra por los dos lados a
               la vez y no haya un lado seguro. */
            e.ultima='guadanas'; e.anim=20; e.face=haciaP<0?1:0;
            const cx=e.x+w/2, cy=e.y+h/2;
            for(let i=0;i<2;i++){
              shots.push({tipo:'guadana',orbita:true,
                cx, cy, rad:14, dRad:0.72, ang:(i*Math.PI)+Math.atan2((P.y+P.h/2)-cy,(P.x+P.w/2)-cx),
                dAng:0.055, x:cx, y:cy, vx:0, vy:0, giro:0,
                atraviesa:true, t:0, dmg:2, an:10, al:10, vida:170});
            }
            SFX.rugido();
            e.ataque=150;
          }
        } else if(e.clase==='armadura'){
          /* Dos golpes que se turnan, y el turno lo decide si tiene la espada
             en la mano. Sin espada no puede embestir: ese hueco es la unica
             ventana en la que se le puede castigar de verdad. */
          if(e.sinEspada){
            e.ataque=20;                       // espera a que le vuelva
          } else if(e.ultima==='embiste'){
            // lanza la espada como un bumeran, a la altura del heroe
            e.ultima='espada';
            e.face=haciaP<0?1:0;
            e.sinEspada=true; e.anim=18;
            const dir=haciaP;
            /* El alcance se calcula para llegar HASTA el heroe con margen, en
               vez de ser fijo: con una frenada constante la espada solo daba
               93 px y se quedaba corta en cuanto el heroe se apartaba. */
            const dist=Math.abs((P.x+P.w/2)-(e.x+w/2));
            const alcance=Math.max(70,Math.min(230,dist+26));
            const v0=3.2;
            shots.push({tipo:'espadaB',duenyo:e,
              x:e.x+w/2, y:Math.max(12,Math.min((ROWS-1)*TS-14,P.y+P.h/2-4)),
              vx:dir*v0, vy:0, ax:-dir*(v0*v0)/(2*alcance),
              giro:0, t:0, dmg:2,
              an:14, al:6, atraviesa:true, vuelve:true, vida:400});
            SFX.tela();
            e.ataque=60;
          } else {
            // embestida IMPARABLE: inmune, sin retroceso y sin frenarse
            e.ultima='embiste';
            e.face=haciaP<0?1:0;
            e.preArm=28; e.embDir=haciaP;   // medio segundo de aviso antes de arrancar
            SFX.rugido(); G.shake=5;
            e.ataque=110;
          }
        } else if(e.clase==='cargador'){
          // embestida rapida de lado a lado
          e.ataque=ri(120,170); e.cargando=70; e.face=haciaP<0?1:0;
          SFX.rugido();
        } else if(e.clase==='vampiro'){
          if(e.hab){ e.ataque=25; }
          else {
            e.ciclo=((e.ciclo||0)+1)%2;
            if(e.ciclo===1){
              /* SALTO DE SOMBRA: se desvanece, marca el suelo bajo el heroe y
                 cae encima. Quedarse quieto es lo peor que puedes hacer. */
              e.hab=1; e.fase=0; e.espera=48; e.invulnerable=true;   // casi un segundo de aviso
              e.marcaX=P.x+P.w/2; e.marcaY=P.y+P.h;
              SFX.magia('viento'); e.ataque=250;
            } else {
              /* FORMA DE MURCIELAGO: cruza la sala zigzagueando de arriba
                 abajo. Aqui no se pelea, se esquiva. */
              e.hab=2; e.fase=0;
              e.murDir=((P.x+P.w/2)<(e.x+w/2))?1:-1;
              e.x=(e.murDir>0)?10:(VW-10-w);
              e.pasadas=2; e.invulnerable=false;
              SFX.rugido(); e.ataque=280;
            }
          }
        } else if(e.clase==='gargola'){
          if(e.hab){ e.ataque=25; }
          else {
            e.ciclo=((e.ciclo||0)+1)%3;
            if(e.ciclo===0){ e.hab=1; e.fase=0; e.ataque=280; }   // sismo
            else { e.picado=90; e.ataque=150; }
          }
        } else if(e.clase==='cuervo'){
          /* Ciclo de cuatro: picado, barrido de plumas, picado, anillo.
             Se intercala siempre un picado para que las dos habilidades
             nuevas no se pisen y de tiempo a leer cada una. */
          if(e.hab){ e.ataque=30; }
          else {
            e.ciclo=((e.ciclo||0)+1)%4;
            if(e.ciclo===1||e.ciclo===3){ e.picado=90; e.ataque=150; }
            else if(e.ciclo===2){
              e.hab=1; e.fase=0; e.nPluma=0;
              e.esqX=(Math.random()<.5)?18:VW-18-w;   // una de las dos esquinas
              e.ataque=260;
            } else { e.hab=2; e.fase=0; e.ataque=260; }
          }
        } else if(e.clase==='volador'){
          // se lanza en picado sobre el heroe
          e.ataque=ri(110,150); e.picado=60;
        } else if(e.clase==='necro'){
          if(e.hab){ e.ataque=25; }
          else {
            e.ciclo=((e.ciclo||0)+1)%3;
            if(e.ciclo===2){
              /* CAMPO DE PINCHOS: se blinda y el suelo empieza a reventar
                 bajo los pies del heroe. Quedarse quieto es morir; la
                 invulnerabilidad obliga a huir en vez de a intercambiar
                 golpes. */
              e.hab=1; e.invulnerable=true; e.oleada=6; e.pinchoCd=20;
              e.parpadeo=20; SFX.magia('rayo');
              e.ataque=300;
            } else {
              // teletransporte lejos del heroe + sombras + un esbirro
              e.ataque=ri(150,200);
              let destino=e.x;
              for(let intento=0;intento<12;intento++){
                const cand=ri(2,COLS-3)*TS;
                if(Math.abs(cand-P.x)>=70){destino=cand;break;}
              }
              if(Math.abs(destino-P.x)<70) destino=(P.x<VW/2)?(COLS-4)*TS:2*TS;
              e.x=destino; e.parpadeo=30;
              /* Las sombras iban hacia arriba con gravedad y se quedaban
                 cortas: caian al suelo antes de llegar y no amenazaban
                 nada. Ahora salen apuntadas al heroe y corrigen un poco el
                 rumbo por el camino, asi que hay que esquivarlas de verdad. */
              const ox=e.x+w/2, oy=e.y+6;
              for(let i=0;i<3;i++){
                const dx=(P.x+P.w/2)-ox, dy=(P.y+P.h/2)-oy, d=Math.hypot(dx,dy)||1;
                const desv=(i-1)*0.10;                 // abanico muy corto: con uno ancho la correccion de rumbo no llegaba a cerrarlo
                const cs=Math.cos(desv), sn=Math.sin(desv);
                const ux=dx/d, uy=dy/d;
                shots.push({tipo:'sombra',x:ox,y:oy,
                  vx:(ux*cs-uy*sn)*1.75, vy:(ux*sn+uy*cs)*1.75,
                  dirigido:true, giroMax:.095, vmax:2.1,
                  t:0,dmg:2,vida:300});
              }
              if(ents.filter(o=>o.type==='skel'||o.type==='arquero_e').length<2){
                ents.push({type:(RND()<.4?'arquero_e':'skel'),invocado:true,x:e.x,y:e.y+h-10,ox:e.x,oy:e.y,
                  vx:.55,vy:0,rng:5*TS,hp:4,t:0,hit:0,kb:0,fl:0,lento:0,quema:0,tiro:ri(90,160)});
              }
              SFX.magia('rayo');
            }
          }
        } else if(e.clase==='invocador'){
          // desaparece, reaparece en otro sitio y suelta esbirros y sombras
          e.ataque=ri(140,190);
          // nunca reaparece sobre el heroe: se busca un sitio a distancia
          let destino=e.x;
          for(let intento=0;intento<12;intento++){
            const cand=ri(2,COLS-3)*TS;
            if(Math.abs(cand-P.x)>=70){destino=cand;break;}
          }
          if(Math.abs(destino-P.x)<70) destino=(P.x<VW/2)?(COLS-4)*TS:2*TS;
          e.x=destino; e.parpadeo=30;
          for(let i=0;i<2;i++){
            const ang=-2.4+i*1.1;
            shots.push({tipo:'sombra',x:e.x+w/2,y:e.y+6,
              vx:1.5*haciaP,vy:ang*.5,grav:.05,t:0,dmg:2});
          }
          if(ents.filter(o=>o.type==='skel'||o.type==='arquero_e').length<2){
            /* 'invocado' evita el exploit: si soltaran oro, el jugador
               podria quedarse junto al invocador granjeando esbirros
               en vez de rematar el combate. */
            ents.push({type:(RND()<.4?'arquero_e':'skel'),invocado:true,x:e.x,y:e.y+h-10,ox:e.x,oy:e.y,
              vx:.55,vy:0,rng:5*TS,hp:4,t:0,hit:0,kb:0,fl:0,lento:0,quema:0,tiro:ri(90,160)});
          }
          SFX.magia('rayo');
        } else if(e.clase==='tomos'){
          if(e.hab){ e.ataque=25; }
          else {
            /* Antes eran tres libros horizontales con una separacion fija:
               bastaba con quedarse en el hueco de en medio. Ahora salen
               apuntados al heroe y corrigen el rumbo, asi que hay que
               apartarse de verdad. */
            e.ataque=ri(100,140);
            const ox=e.x+w/2, oy=e.y+8;
            const ang=Math.atan2((P.y+P.h/2)-oy,(P.x+P.w/2)-ox);
            for(let i=-1;i<=1;i++){
              const a2=ang+i*0.07;   // abanico corto: uno ancho no lo cierra la correccion
              shots.push({tipo:'libro',x:ox,y:oy,
                vx:Math.cos(a2)*2.0, vy:Math.sin(a2)*2.0,
                dirigido:true, giroMax:.115, vmax:2.4,
                t:0,dmg:2,vida:300});
            }
            SFX.magia('viento');
          }
        } else if(e.clase==='lanzador'){
          // abanico de libros
          e.ataque=ri(100,140);
          for(let i=-1;i<=1;i++)
            shots.push({tipo:'libro',x:e.x+w/2,y:e.y+8,vx:1.9*haciaP,vy:i*.9,
              t:0,dmg:2});
          SFX.magia('viento');
        } else if(e.clase==='sirena'&&e.ultima!=='grito'&&!(shots.some(o=>o.tipo==='canto'&&o.duenyo===e))){
          /* GRITO: una onda de canto ancha y lenta que atraviesa el muro.
             No hace dano, arrastra: quien lo encaje se ve empujado hacia el
             agua durante dos segundos. Se lanza una sola cada vez. */
          e.ultima='grito'; e.canto=60; e.face=P.x<e.x?1:0;
          const oy=e.y+5;
          const dxg=(P.x+P.w/2)-(e.x+w/2), dyg=(P.y+P.h/2)-oy, dg=Math.hypot(dxg,dyg)||1;
          shots.push({tipo:'canto',duenyo:e,x:e.x+w/2,y:oy,
            vx:dxg/dg*1.25, vy:dyg/dg*1.25,
            dirigido:true, giroMax:.028, vmax:1.5,
            atraviesa:true, t:0, dmg:0, an:14, al:12, vida:280});
          SFX.nota();
          e.ataque=ri(150,200);
        } else if(e.clase==='sirena'){
          e.ultima='notas';
          // notas musicales en diagonal, hacia arriba y hacia abajo
          const suyas=shots.filter(o=>o.tipo==='nota'&&o.duenyo===e).length;
          e.ataque=(suyas===0)?26:ri(90,130);   // la segunda voz entra pronto
          if(suyas<2){                       // la reina canta a dos voces como mucho
            e.canto=40;
            const dxq=P.x+P.w/2-(e.x+w/2), dyq=P.y+P.h/2-(e.y+6), dq=Math.hypot(dxq,dyq)||1;
            shots.push({tipo:'nota',duenyo:e,tono:(e.t>>2)%4,x:e.x+w/2,y:e.y+6,
              vx:dxq/dq*1.5,vy:dyq/dq*1.5,dirigido:true,giroMax:.05,vmax:1.9,
              atraviesa:true,vida:300,t:0,dmg:2});
            SFX.nota();
          }
        }
      }
      // movimiento segun la clase
      if(e.embiste||e.stun>0||e.preEmb>0){
        /* Durante el aviso, la embestida y el aturdimiento manda ese estado:
           el paseo normal lo frenaria a mitad de carrera. */
      }
      else if((e.clase==='armadura'||e.clase==='verdugo')&&e.preArm>0){
        e.preArm--;                    // se cuadra y tiembla antes de salir
        /* Se blinda AL ARRANCAR, no durante el aviso: mientras se cuadra
           sigue siendo golpeable, asi el aviso tambien es una oportunidad. */
        if(e.preArm===0){ e.embArm=1; e.invulnerable=true; SFX.rugido(); }
      }
      else if((e.clase==='armadura'||e.clase==='verdugo')&&(e.embArm||e.recup>0)){
        if(e.recup>0){
          e.recup--;
          if(e.recup===0)e.face=e.face?0:1;
        } else {
          e.face=e.embDir<0?1:0;
          const nx=e.x+e.embDir*3.2;   // contra el muro real, igual que el ogro
          if(boxSolid(nx+2,e.y+2,w-4,h-4)||nx<8||nx>VW-8-w){
            e.x=Math.max(8,Math.min(VW-8-w,e.x));
            e.embArm=0; e.recup=35; e.invulnerable=false;
            G.shake=9; beep(90,.3,'square',.07,-40);
          } else e.x=nx;
        }
      }
      else if(e.clase==='cargador'&&e.cargando>0){
        e.cargando--; e.x+=(e.face?-1:1)*2.6;
        if(e.x<18||e.x>VW-18-w){e.face=e.face?0:1;e.cargando=Math.min(e.cargando,10);}
      } else if(e.clase==='vampiro'){
        const suelo=(ROWS-1)*TS-h, techo=28;
        if(e.hab===1){
          if(e.fase===0){                    // desvanecido: solo queda la marca
            if(--e.espera<=0){ e.fase=1; e.x=e.marcaX-w/2; e.y=techo; e.vy=0; }
          } else {
            e.y+=3.6;                        // cae en picado sobre la marca
            if(e.y>=e.marcaY-h){
              e.y=e.marcaY-h; e.hab=0; e.fase=0; e.invulnerable=false;
              G.shake=9; SFX.rugido();
            }
          }
        } else if(e.hab===2){
          e.x+=e.murDir*1.65;   // mas lento: a 2.6 no daba tiempo a leer el zigzag
          e.y=88+Math.sin(e.t*.16)*54;       // zigzag amplio de arriba abajo
          e.face=e.murDir<0?1:0;
          if(e.x<8||e.x>VW-8-w){
            if(--e.pasadas<=0){ e.hab=0; e.fase=0; e.y=suelo; }
            else e.murDir*=-1;
          }
        } else {
          // acecho: camina hacia el heroe, mas rapido cuanto mas herido esta
          if(e.maxhp===undefined)e.maxhp=e.hp;
          const prisa=1+(1-Math.max(0,e.hp)/e.maxhp)*0.9;
          if(e.saciado>0)e.saciado--;
          else e.x+=Math.sign((P.x+P.w/2)-(e.x+w/2))*0.62*prisa;
          e.y=Math.min(suelo,e.y+2);
          e.face=P.x<e.x?1:0;
        }
        /* SE ALIMENTA: cada mordisco que conecta le devuelve vida. Por eso
           conviene no dejarse tocar, y no solo por el dano. */
        if(e.hab!==1&&P.inv<=0&&rect(P.x,P.y,P.w,P.h,e.x,e.y,w,h)){
          if(e.maxhp===undefined)e.maxhp=e.hp;
          e.hp=Math.min(e.maxhp,e.hp+2);
          /* Se sacia un momento tras morder. Sin esta pausa se te pegaba
             encima y no habia forma de recuperar el hueco. */
          e.curado=30; e.saciado=45; SFX.gold();
        }
      } else if(e.clase==='gargola'){
        const techo=30, suelo=(ROWS-1)*TS-h;
        if(e.hab===1){
          /* SISMO: se deja caer a plomo, grita y la onda recorre el suelo en
             las dos direcciones. Se esquiva SALTANDO, porque va pegada a la
             roca. Si acierta, la gargola se rehace un 25%: dejarla acertar
             sale caro de verdad. */
          if(e.fase===0){
            e.y=Math.min(suelo,e.y+3.4);
            if(e.y>=suelo){ e.y=suelo; e.fase=1; e.espera=30; G.shake=7; e.aterrizo=6; }
          } else if(e.fase===1){
            if(--e.espera<=0){
              e.grito=45; SFX.rugido(); G.shake=10;
              for(const dir of [-1,1]){
                shots.push({tipo:'sismo',duenyo:e,x:e.x+w/2,y:suelo+h-7,
                  vx:dir*2.3,vy:0,atraviesa:true,t:0,dmg:1,an:10,al:7,vida:150});
              }
              e.fase=2; e.espera=70;
            }
          } else {
            if(e.grito>0)e.grito--;
            if(--e.espera<=0){ e.hab=0; e.fase=0; }
            if(e.espera<50) e.y+=(techo-e.y)*.08;      // remonta
          }
          e.face=P.x<e.x?1:0;
        } else if(e.subiendo){
          e.y+=(techo-e.y)*.13;
          if(Math.abs(e.y-techo)<2){ e.y=techo; e.subiendo=0; }
          e.face=P.x<e.x?1:0;
        } else if(e.picado>0){
          e.picado--;
          const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
          e.x+=dx/d*2.3; e.y+=dy/d*1.9;
          // igual que el cuervo: acierte o toque suelo, remonta
          if(rect(P.x,P.y,P.w,P.h,e.x,e.y,w,h)||e.y>=suelo-1||e.picado===0){
            e.y=Math.min(e.y,suelo-1); e.picado=0; e.subiendo=1;
          }
          e.face=P.x<e.x?1:0;
        } else {
          e.x+=e.vx*1.1; e.y=38+Math.sin(e.t*.045)*22;
          if(e.x<16||e.x>VW-16-w)e.vx*=-1;
          e.face=P.x<e.x?1:0;
        }
      } else if(e.clase==='cuervo'){
        const techo=26, suelo=(ROWS-1)*TS-h;
        if(e.hab===1){
          /* BARRIDO: sube a una esquina de arriba y cruza hasta la opuesta
             soltando plumas que caen zigzagueando. Deja huecos a proposito
             (una de cada cuatro y otra de cada siete) para que siempre haya
             por donde colarse: una cortina cerrada seria inesquivable. */
          if(e.fase===0){
            const dx=e.esqX-e.x;
            e.x+=Math.sign(dx)*Math.min(3,Math.abs(dx));
            e.y+=(techo-e.y)*.14;
            if(Math.abs(dx)<3&&Math.abs(e.y-techo)<3){
              e.fase=1; e.dirB=(e.esqX<VW/2)?1:-1; e.sueltaCd=8; SFX.rugido();
            }
          } else {
            e.x+=e.dirB*1.45; e.y=techo+Math.sin(e.t*.09)*3;
            if(--e.sueltaCd<=0){
              /* Un 15% menos de plumas (cadencia 8 -> 9). Bajar tambien los saltos
                 dejaba la cortina en 11 plumas, un 27%: demasiado. */
              e.sueltaCd=9; e.nPluma++;
              if(e.nPluma%4!==0&&e.nPluma%7!==0){
                shots.push({tipo:'pluma',x:e.x+w/2,y:e.y+h,x0:e.x+w/2,
                  vx:0,vy:.85,zig:true,desf:Math.random()*6.28,
                  t:0,dmg:1,an:4,al:6,vida:400});
              }
            }
            if(e.x<12||e.x>VW-12-w){ e.hab=0; e.fase=0; }
          }
          e.face=e.dirB<0?1:0;
        } else if(e.hab===2){
          /* ANILLO: baja al suelo y suelta una corona de plumas que se abre
             en todas direcciones. Las que salen en horizontal son las que
             importan: hay que saltarlas. Atraviesan el suelo para que el
             circulo se lea entero y no se coma medio anillo la roca. */
          if(e.fase===0){
            e.y=Math.min(suelo,e.y+2.4);
            e.x+=Math.sign((P.x+P.w/2)-(e.x+w/2))*.7;
            if(e.y>=suelo){ e.y=suelo; e.fase=1; e.espera=28; G.shake=6; }
          } else if(e.fase===1){
            if(--e.espera<=0){
              const cx=e.x+w/2, cy=e.y+h-3;
              for(let i=0;i<12;i++){
                const ang=(i/12)*Math.PI*2;
                shots.push({tipo:'pluma',x:cx,y:cy,
                  vx:Math.cos(ang)*2.0, vy:Math.sin(ang)*2.0,
                  atraviesa:true,t:0,dmg:1,an:4,al:6,vida:190});
              }
              SFX.rugido(); G.shake=8; e.fase=2; e.espera=55;
            }
          } else {
            if(--e.espera<=0){ e.hab=0; e.fase=0; }
            if(e.espera<40) e.y+=(techo-e.y)*.09;      // remonta el vuelo
          }
          e.face=P.x<e.x?1:0;
        } else if(e.subiendo){
          /* Tras un picado remonta hasta arriba antes de volver al vaiven:
             asi el picado siempre sale desde el techo y se ve venir. */
          e.y+=(techo-e.y)*.13;
          if(Math.abs(e.y-techo)<2){ e.y=techo; e.subiendo=0; }
          e.face=P.x<e.x?1:0;
        } else if(e.picado>0){
          e.picado--;
          const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
          e.x+=dx/d*2.2; e.y+=dy/d*1.8;
          /* El picado termina en cuanto acierta O en cuanto toca el suelo,
             y en los dos casos remonta. Antes se quedaba rascando el suelo
             hasta agotar el contador. */
          if(rect(P.x,P.y,P.w,P.h,e.x,e.y,w,h)||e.y>=suelo-1||e.picado===0){
            e.y=Math.min(e.y,suelo-1); e.picado=0; e.subiendo=1;
          }
          e.face=P.x<e.x?1:0;
        } else {
          e.x+=e.vx*1.1; e.y=36+Math.sin(e.t*.045)*22;
          if(e.x<16||e.x>VW-16-w)e.vx*=-1;
          e.face=P.x<e.x?1:0;
        }
      } else if(e.clase==='volador'){
        if(e.picado>0){
          e.picado--;
          const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
          e.x+=dx/d*2.2; e.y+=dy/d*1.8;
        } else {
          e.x+=e.vx*1.1; e.y=40+Math.sin(e.t*.045)*26;
          if(e.x<16||e.x>VW-16-w)e.vx*=-1;
        }
        e.face=P.x<e.x?1:0;
      } else if(e.clase==='sirena'){
        // emerge y se sumerge en el agua
        e.x+=e.vx*.5; if(e.x<20||e.x>VW-20-w)e.vx*=-1;
        e.y=(ROWS-1)*TS-h+6+Math.sin(e.t*.035)*10;
        e.face=P.x<e.x?1:0;
      } else if(e.clase==='tomos'&&e.hab===1){
        const cx=VW/2-w/2, cy=56, suelo=(ROWS-1)*TS-h;
        if(e.fase===0){                       // asciende al centro
          e.x+=(cx-e.x)*.09; e.y+=(cy-e.y)*.09; e.vy=0;
          if(Math.abs(e.x-cx)<3&&Math.abs(e.y-cy)<3){e.fase=1;e.tacCd=32;}
        } else if(e.fase===1){                // tres tacadas en tridente
          e.y=cy+Math.sin(e.t*.10)*3; e.vy=0;
          if(--e.tacCd<=0){
            const ox=e.x+w/2, oy=e.y+h/2;
            const ang=Math.atan2((P.y+P.h/2)-oy,(P.x+P.w/2)-ox);
            for(let i=-1;i<=1;i++){
              const a2=ang+i*0.13;            // tridente: tres puas juntas
              shots.push({tipo:'libro',x:ox,y:oy,
                vx:Math.cos(a2)*2.5, vy:Math.sin(a2)*2.5,
                dirigido:true, giroMax:.032, vmax:2.9,
                t:0,dmg:2,vida:300});
            }
            SFX.magia('rayo'); G.shake=4; e.anim=14;
            if(--e.tacadas<=0){ e.fase=2; } else { e.tacCd=48; }
          }
        } else {                              // vuelve a bajar
          e.vy=0; e.y+=2.2;
          if(e.y>=suelo){ e.y=suelo; e.hab=0; e.fase=0; e.invulnerable=false; e.aterrizo=6; }
        }
        e.face=P.x<e.x?1:0;
      } else if(e.clase==='necro'){
        if(e.parpadeo>0)e.parpadeo--;
        e.x+=Math.sin(e.t*.02)*.6;
        if(e.hab===1){
          /* Un pinchazo cada 0,4 s justo bajo los pies del heroe. Se usa su
             posicion real, no el suelo de la sala, para que tambien le
             persiga cuando este subido a una plataforma. */
          if(--e.pinchoCd<=0){
            e.pinchoCd=22;
            shots.push({tipo:'pincho',x:P.x+P.w/2-4,y:P.y+P.h-15,
              vx:0,vy:0,aviso:26,atraviesa:true,
              t:0,dmg:2,an:8,al:15,vida:80});
            SFX.magia('rayo');
            if(--e.oleada<=0){ e.hab=0; e.invulnerable=false; }
          }
        }
      } else if(e.clase==='invocador'){
        if(e.parpadeo>0)e.parpadeo--;
        e.x+=Math.sin(e.t*.02)*.6;
      } else {
        const paso=(e.clase==='momia')?.45:1;
        e.x+=e.vx*paso;
        /* Se RECOLOCA ademas de invertir. Invertir a secas dejaba clavado a
           cualquiera que acabara fuera del margen (la embestida los deja en
           x=8, y 8<16): la direccion se daba la vuelta cada fotograma y se
           quedaban vibrando en la esquina hasta la siguiente embestida. */
        if(e.x<16){ e.x=16; e.vx=Math.abs(e.vx); }
        else if(e.x>VW-16-w){ e.x=VW-16-w; e.vx=-Math.abs(e.vx); }
        e.face=e.vx<0?1:0;
        if(e.anim>0)e.anim--;
      }
      if(e.kb){
        // mismo criterio que con los enemigos normales: ni contra el muro
        // ni hasta el borde de un foso. Los que vuelan no necesitan apoyo.
        const nx=e.x+e.kb;
        const flota=(e.clase==='volador'||e.clase==='cuervo'||e.clase==='gargola'||e.clase==='sirena');
        const pieX=e.kb>0?nx+w:nx-1;
        const alPinche=!flota&&(HURT(tileAt(pieX,e.y+h+2))||HURT(tileAt(pieX,e.y+h-1)));
        if(!boxSolid(nx,e.y+2,w,h-4)&&!alPinche)e.x=nx; else e.kb=0;
        e.kb*=.8;if(Math.abs(e.kb)<.12)e.kb=0;
      }
      e.x=Math.max(4,Math.min(VW-4-w,e.x));
    } else if(e.type==='boss'){
      e.t++;
      /* El brujo tiene tres modos EXCLUYENTES. Mientras dura una habilidad
         no dispara ni empieza otra: e.hab manda sobre todo lo demas.
           0 = vuelo y bola dirigida de siempre
           1 = tormenta: burbuja oscura, invulnerable, cuatro rayos verticales
           2 = arcos de magia oscura que atraviesan los muros            */
      if(e.hab===undefined){e.hab=0;e.habT=0;e.habCd=ri(240,320);}

      if(e.hab===0){
        e.x+=e.vx;e.y+=e.vy;
        if(e.x<18||e.x>VW-42)e.vx*=-1;
        if(e.y<22||e.y>PH-72)e.vy*=-1;
        if(--e.shootT<=0){
          /* La cadencia sube al bajarle la vida, pero con tope: sin el, al
             final quedaba en 62-64 = dispara todos los fotogramas, una
             ametralladora. El intervalo no baja de un tercio del inicial. */
          const BASE=62, MINIMO=Math.round(BASE/3);
          e.shootT=Math.max(MINIMO, BASE-(G.bossHp-e.hp)*2);
          const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
          shots.push({x:e.x+8,y:e.y+10,vx:dx/d*1.6,vy:dy/d*1.6,t:0});
          beep(240,.18,'sawtooth',.05,-120);
        }
        // cuanta menos vida le queda, antes vuelve a lanzar una habilidad
        if(cuentaRecarga(e)&&--e.habCd<=0){
          e.hab=(e.ultima===1)?2:1;      // alterna, para que no repita
          e.ultima=e.hab; e.habT=0;
          if(e.hab===1){
            /* Cuatro rayos con separacion IGUAL y un margen de arranque al
               azar. Con 72 px de paso y rayos de 8, quedan huecos de 64 px:
               el heroe mide 10, asi que siempre cabe entre dos. */
            const paso=72, inicio=20+ri(0,34);
            e.rayos=[0,1,2,3].map(i=>inicio+i*paso);
            e.rayoY=0;
          }else{
            e.arcosLanzados=0;
            e.arcoDir=(P.x+P.w/2 < e.x+w/2)?-1:1;   // hacia donde esta el heroe
          }
          SFX.magia('rayo');
        }
      }

      else if(e.hab===1){
        /* TORMENTA. Tres tramos: la burbuja se cierra y se marcan las zonas,
           caen los rayos, y se disuelve. Invulnerable de principio a fin, que
           es lo que obliga a dejar de pegar y ocuparse de esquivar. */
        e.habT++;
        e.invulnerable=true;
        if(e.habT===1)SFX.magia('hielo');
        if(e.habT>60&&e.habT<=110){
          // el frente del rayo baja de arriba abajo
          e.rayoY=((e.habT-60)/50)*PH;
          if(e.habT===61)beep(90,.5,'sawtooth',.07,-40);
          (e.rayos||[]).forEach(rx=>{
            if(rect(P.x,P.y,P.w,P.h,rx,0,8,e.rayoY))damage(3);
          });
        }
        if(e.habT>=136){e.hab=0;e.invulnerable=false;e.habCd=ri(200,300);e.shootT=40;}
      }

      else {
        /* ARCOS. Grandes, lentos y atraviesan muros: las plataformas no
           salvan. Se sueltan tres a distinta altura y bien espaciados en el
           tiempo, para que siempre haya sitio y momento de apartarse. */
        e.habT++;
        if(e.habT===1)SFX.magia('viento');
        const CUANDO=[30,95,160];
        if(CUANDO.includes(e.habT)&&e.arcosLanzados<3){
          const alto=46;
          // alterna alto y bajo, y el tercero a la altura del heroe
          const cy = e.arcosLanzados===0 ? 26
                   : e.arcosLanzados===1 ? PH-alto-26
                   : Math.max(6,Math.min(PH-alto-6,P.y+P.h/2-alto/2));
          shots.push({tipo:'arco',x:e.x+w/2-10,y:cy,vx:e.arcoDir*1.15,vy:0,
            an:20,al:alto,atraviesa:true,vida:400,t:0,dmg:2,giro:0});
          e.arcosLanzados++;
          beep(150,.35,'sawtooth',.06,-60);
        }
        if(e.habT>=200){e.hab=0;e.habCd=ri(220,320);e.shootT=40;}
      }
    }
    // el rayo lo deja clavado: se queda donde estaba, pero se le puede golpear
    if(e.paralizado>0&&e.type!=='boss'){e.x=_px;e.y=_py;}
    if(P.atk>7&&G.rol==='caballero'){
      /* Dos cajas excluyentes, nunca las dos a la vez. La de arriba es
         estrecha a proposito: 12 px, apenas un pixel a cada lado del
         heroe (que mide 10). Asi no barre en diagonal y no se cuelga el
         merito de matar a algo que estaba al lado y no encima. */
      const alcance=13;
      const caja = P.atkUp
        ? [P.x-1, P.y-alcance-1, 12, alcance+3]
        : [P.face?P.x-alcance:P.x+P.w, P.y+2, alcance, 12];
      if(rect(caja[0],caja[1],caja[2],caja[3],e.x,e.y,w,h)&&e.hit===0&&!e.invulnerable){
        /* Los jefes ya no retroceden, asi que sin una ventana propia se les
           podia hostigar a espadazos sin que llegaran a reaccionar. 30
           fotogramas les dan tiempo a seguir con lo suyo entre golpe y golpe. */
        /* El Nazgul se aparta de la mitad de los golpes. Se avisa con
           destello y sonido propios: sin eso pareceria que la espada no
           registra, y eso es peor que un enemigo duro. */
        /* El Nazgul se aparta y el Dementor se desvanece: uno de cada
           cuatro golpes no les entra. Con la mitad, que es como estaba,
           eran una pelea de desgaste. */
        if((e.type==='nazgul'||e.type==='dementor')&&RND()<.25){ e.esquivo=14; e.hit=10; SFX.esquiva(); }
        else {
        e.hp-=blindaje(e,G.dmg);
        e.hit=(e.type==='mini'||e.type==='boss')?30:16;
        SFX.hit();G.shake=4;
        /* NINGUN jefe retrocede al ser golpeado (ver nota en el disparo:
           la unica excepcion es el viento del mago). Los enemigos normales
           si: el golpe alto empuja menos, solo los despega. */
        if(e.type!=='boss'&&e.type!=='mini'){
          e.kb=(P.face?-1:1)*(P.atkUp?1.2:2.6);
          if(e.vx)e.vx=Math.abs(e.vx)*(P.face?-1:1);
        }
        if(e.hp<=0)matar(e);
        }
      }
    }
    if(rect(P.x,P.y,P.w,P.h,e.x,e.y,w,h)){
      const antes=G.hp;
      damage(e.type==='boss'?3:(e.type==='mini'?2:1));
      // el vampiro se alimenta: recupera lo que te quita
      if(e.type==='vampiro'&&G.hp<antes){
        e.hp=Math.min(4,e.hp+(antes-G.hp));
        e.chupando=25; SFX.hurt();
      }
    }
  });
  ents=ents.filter(e=>!e.dead);

  pickups.forEach(g=>{g.t++;g.vy+=.25;g.y+=g.vy;
    if(boxSolid(g.x,g.y+5,5,2)){g.y=Math.floor((g.y+5)/TS)*TS-5;g.vy=0;}
    if(rect(P.x,P.y,P.w,P.h,g.x,g.y,6,6)){G.gold+=g.val;G.oroTotal+=g.val;SFX.gold();g.dead=true;}
    if(g.t>600)g.dead=true;});
  pickups=pickups.filter(g=>!g.dead);

  shots.forEach(s=>{
    s.t++;
    /* Las plumas de la cortina caen bamboleandose. El vaiven va sobre la
       x de salida, no acumulado, o derivarian hasta salirse de la sala. */
    if(s.zig)s.x=s.x0+Math.sin(s.t*.10+s.desf)*11;
    /* Guadana: no se mueve en linea recta sino describiendo un circulo que
       se va abriendo. La posicion se calcula en polares desde el centro, no
       acumulando velocidad, o el circulo se deformaria al mas minimo error. */
    if(s.orbita){
      s.ang+=s.dAng; s.rad+=s.dRad;
      s.x=s.cx+Math.cos(s.ang)*s.rad-(s.an||10)/2;
      s.y=s.cy+Math.sin(s.ang)*s.rad-(s.al||10)/2;
      s.vx=0; s.vy=0;
    }
    // el yelmo sale, se frena y vuelve a su duenyo como un bumeran
    if(s.tipo==='yelmo'){
      s.giro+=.3;
      // el yelmo no da la vuelta hasta rebasar al heroe por la espalda
      const rebasado = s.vx>0 ? (s.x > P.x+P.w+22) : (s.x < P.x-22);
      if(s.ida>0 && !rebasado){ s.ida--; }
      else if(s.duenyo&&!s.duenyo.dead){
        const dx=s.duenyo.x+2-s.x, dy=s.duenyo.y+1-s.y, d=Math.hypot(dx,dy)||1;
        s.vx=dx/d*3.2; s.vy=dy/d*3.2;
        if(d<7){ s.duenyo.sinYelmo=false; s.dead=true; return; }
      } else { s.dead=true; return; }
      s.x+=s.vx; s.y+=s.vy;
      if(rect(P.x,P.y,P.w,P.h,s.x,s.y,8,6)){damage(s.dmg||2);}
      if(s.t>300){if(s.duenyo)s.duenyo.sinYelmo=false;s.dead=true;}
      return;
    }
    // notas y bolas de fuego teledirigidas: corrigen el rumbo poco a poco
    if(s.dirigido){
      const dx=P.x+P.w/2-s.x, dy=P.y+P.h/2-s.y, d=Math.hypot(dx,dy)||1;
      const giro=s.giroMax||.055;
      s.vx+=dx/d*giro; s.vy+=dy/d*giro;
      const v=Math.hypot(s.vx,s.vy), vmax=s.vmax||1.9;
      if(v>vmax){s.vx=s.vx/v*vmax;s.vy=s.vy/v*vmax;}
    }
    if(s.vuelve){
      /* Espada bumeran: frena, se para, vuelve y su dueno la recoge. Si el
         dueno ha muerto entretanto sigue de largo y se agota sola. */
      s.vx+=s.ax;
      const d=s.duenyo;
      if(d&&d.hp>0){
        if(s.vx*(s.ax>0?1:-1)>0){          // ya viene de vuelta
          if(Math.abs(s.vx)>4)s.vx=Math.sign(s.vx)*4;   // no se dispara al volver
          const dx=(d.x+(d.w||16)/2)-s.x, dy=(d.y+(d.h||20)/2)-s.y;
          s.y+=dy*.10;                      // se recoloca hacia la mano
          /* Se recoge por REBASAMIENTO, no por cercania: a 4 px por
             fotograma la espada saltaba por encima de cualquier ventana de
             proximidad y se perdia sala afuera acelerando sin freno. */
          if(Math.abs(dx)<10||Math.sign(dx)!==Math.sign(s.vx)){
            d.sinEspada=false; s.dead=true; SFX.tela();
          }
        }
      }
    }
    if(s.grav){s.vy+=s.grav;}
    s.x+=s.vx;s.y+=s.vy;
    if(s.giro!==undefined)s.giro+=.22;
    /* Caja propia del proyectil: los arcos del brujo son enormes y no
       pueden usar el 5x5 de siempre. */
    if(s.mordido>0)s.mordido--;
    /* El pincho avisa antes de brotar: durante el aviso solo se ve la grieta
       y no hace dano. Sin ese margen seria un golpe imposible de esquivar,
       porque nace justo debajo del heroe. */
    if(s.aviso>0)s.aviso--;
    if(rect(P.x,P.y,P.w,P.h,s.x,s.y,s.an||5,s.al||5)&&!(s.mordido>0)&&!(s.aviso>0)){
      if(s.tipo==='venda'){
        // El enredo prende siempre, incluso durante la invulnerabilidad:
        // asi la rafaga se acumula de verdad. Cada venda frena mas.
        P.vendas=Math.min(3,(P.vendas||0)+1);
        P.enredado=75;
        SFX.venda();
      }
      if(s.tipo==='canto'){
        /* Prende aunque el heroe sea invulnerable, como las vendas y el
           sismo, o justo despues de encajar un golpe no llegaria nunca. */
        P.atraido=100;                       // 2 s a 50 Hz
        const q=s.duenyo;
        P.atraeX=q?(q.x+(q.w||12)/2):s.x;
        SFX.venda();
        s.dead=true;
      }
      if(s.tipo==='sismo'){
        /* Aturde en vez de castigar solo con dano, y de paso rehace a la
           gargola. Prende aunque el heroe sea invulnerable, como la tela y
           las vendas, o el aturdimiento no llegaria nunca tras un golpe. */
        P.atrapado=Math.max(P.atrapado||0,60);
        const g=s.duenyo;
        if(g&&g.hp>0&&!s.cobrado){
          s.cobrado=1;
          g.hp=Math.min(g.maxhp||g.hp,g.hp+Math.ceil((g.maxhp||g.hp)*0.25));
          g.cura=40;
        }
        s.dead=true; SFX.rugido();
      }
      if(s.tipo==='tela'){
        /* No hace dano: solo pega los pies al suelo. Prende aunque el
           heroe sea invulnerable, como las vendas, o no serviria de nada
           justo despues de encajar un golpe. */
        P.atrapado=50;                       // 1 s a 50 Hz
        SFX.tela();
        s.dead=true; return;
      }
      damage(s.dmg||2);
      /* El bumeran NO se consume al herir: tiene que volver a la mano de su
         dueno o la armadura se quedaria desarmada el resto del combate.
         Se le pone un respiro para que no sangre al heroe cada fotograma. */
      /* El bumeran y el pincho NO se consumen al herir: uno tiene que volver
         a la mano de su dueno y el otro se queda clavado en el suelo hasta
         que se retrae. Un respiro entre mordiscos evita que desangren al
         heroe fotograma a fotograma. */
      if(s.vuelve){s.mordido=30;}
      else if(s.tipo==='pincho'||s.tipo==='rayoCielo'){s.mordido=25;}
      else s.dead=true;
    }
    if(s.t>(s.vida||260))s.dead=true;
    if(boxSolid(s.x,s.y,4,4)){
      if(s.bote&&s.botes>0){          // las rocas del ogro rebotan una vez
        s.botes--;s.vy=-Math.abs(s.vy)*.5;s.y-=3;
      } else if(s.atraviesa){ /* las notas cruzan la roca */ }
      else s.dead=true;
    }
  });
  shots=shots.filter(s=>!s.dead);

  /* ---- flechas y hechizos del jugador ---- */
  pshots.forEach(s=>{
    s.t++;
    const paso=Math.abs(s.vx);
    s.x+=s.vx; s.rec+=paso;
    // el viento serpentea: desplazamiento respecto a su altura de salida,
    // no acumulado, que lo hacia derivar hasta chocar con el suelo
    if(s.tipo==='viento')s.y=s.y0+Math.sin(s.t*.22)*3.5;
    if(s.rec>s.rango||boxSolid(s.x,s.y,4,4)){s.dead=true;return;}
    for(const e of ents){
      if(e.hit>0)continue;
      // la burbuja del brujo tampoco deja pasar flechas ni hechizos
      if(e.invulnerable){ if(rect(s.x,s.y,6,5,e.x,e.y,e.w||12,e.h||12)){s.dead=true;G.shake=2;} continue; }
      if(!rect(s.x,s.y,6,5,e.x,e.y,e.w||12,e.h||12))continue;
      if((e.type==='nazgul'||e.type==='dementor')&&RND()<.25){ e.esquivo=14; e.hit=10; SFX.esquiva(); s.dead=true; return; }
      e.hp-=blindaje(e,s.dmg);
      e.hit=(e.type==='mini'||e.type==='boss')?30:16;
      SFX.hit(); G.shake=3;
      const dir=s.vx>0?1:-1;
      /* Los jefes no retroceden. La UNICA excepcion es el viento del mago,
         que es justo para lo que sirve: apartarlos. Ademas el retroceso
         sustituia a toda su IA mientras duraba, asi que encadenando golpes
         se les dejaba sin pensar. */
      const esJefe=(e.type==='boss'||e.type==='mini');
      if(!esJefe||s.tipo==='viento'){
        e.kb=dir*(s.tipo==='viento'?(esJefe?2.6:4.2):(s.tipo==='rayo'?3.2:2.2));
        if(e.vx)e.vx=Math.abs(e.vx)*dir;
      }
      if(s.tipo==='hielo')e.lento=170;
      if(s.tipo==='fuego')e.quema=110;
      if(s.tipo==='rayo'){e.paralizado=75;e.chispas=75;}   // segundo y medio clavado
      if(e.hp<=0)matar(e);
      s.dead=true; break;
    }
  });
  pshots=pshots.filter(s=>!s.dead);

  /* ---- quemadura persistente del fuego ---- */
  ents.forEach(e=>{
    if(e.quema>0){
      e.quema--;
      if(e.quema%22===0){
        e.hp-=.25;
        if(e.hp<=0&&e.type!=='boss')matar(e);
      }
    }
    if(e.lento>0)e.lento--;
  });
  ents=ents.filter(e=>!e.dead);

  if(P.inv>0)P.inv--;
  if(P.enredado>0){ P.enredado--; if(P.enredado===0)P.vendas=0; }
  if(P.atrapado>0)P.atrapado--;
  if(P.atraido>0)P.atraido--;
  if(P.abatido>0)P.abatido--;
}
function matar(e){
  // los zombis no mueren: se derrumban dos segundos y vuelven a alzarse
  if(e.type==='zombi'){
    e.caido=100; e.hp=4; e.hit=0; e.kb=0; e.vy=0;
    SFX.hurt();
    return;
  }
  e.dead=true;
  if(e.type==='boss'){G.taken.boss=1;G.mode='creditos';G.credT=0;
    SFX.win();musPlay('victoria');G.gano=1;anotarMarca();return;}
  if(e.type==='mini'){
    G.taken['mini:'+e.lv]=1;
    G.msg=e.nombre+' HA CAÍDO';G.msgT=150;G.shake=10;
    SFX.win();
    // botin generoso: recompensa por despejar el paso
    for(let i=0;i<6;i++)
      pickups.push({x:e.x+e.w/2-3+ri(-8,8),y:e.y+6,vy:-2-Math.random()*1.5,val:ri(6,12),t:0});
    return;
  }
  if(e.i!==undefined)G.killed[claveSala()+'#'+e.i]=1;
  // los esbirros que invoca un jefe no sueltan nada: serian una fuente
  // infinita de oro mientras el jefe siga vivo
  if(e.invocado)return;
  pickups.push({x:e.x+3,y:e.y,vy:-1.6,val:ri(2,5),t:0});
}

function rect(a,b,c,d,e,f,g,h){return a<e+g&&a+c>e&&b<f+h&&b+d>f;}

/* La Gargola Mayor endurece la piedra segun se la va rompiendo: por cada
   25% de vida que le falta encaja un 15% menos, hasta tres escalones (45%
   como mucho). Se deja SIEMPRE pasar 1 punto: sin ese suelo, un heroe con
   poco ataque se quedaria sin poder matarla nunca. */
function blindaje(e,n){
  if(!e||e.clase!=='gargola')return n;
  if(e.maxhp===undefined)e.maxhp=e.hp;
  const esc=Math.min(3,Math.floor((1-Math.max(0,e.hp)/e.maxhp)/0.25));
  e.placas=esc;
  return Math.max(1,Math.round(n*(1-0.15*esc)));
}

/* Empuje del escudo y del orbe: aparta a los enemigos cercanos.
   El desplazamiento se hace por 'kb', que ya sabe frenarse ante un
   muro y ante el borde de un foso; asi el empuje no puede tirar a
   nadie al agua ni a los pinchos. Este empuje SI alcanza a los jefes:
   es la utilidad del escudo y del orbe, aparte del viento del mago. */
function empujarConEscudo(){
  const cx=P.x+P.w/2, cy=P.y+P.h/2;
  ents.forEach(e=>{
    if(e.dead)return;
    const w=e.w||12, h=e.h||12;
    const dx=(e.x+w/2)-cx, dy=(e.y+h/2)-cy;
    if(Math.abs(dx)>40||Math.abs(dy)>28)return;
    const dir=dx<0?-1:1;
    e.kb=dir*(e.type==='mini'?1.5:3.0);
    e.hit=Math.max(e.hit||0,10);
    if(e.vx)e.vx=Math.abs(e.vx)*dir;      // que se aleje, no que insista
    if(e.cargando>0)e.cargando=0;         // la embestida se corta en seco
  });
  G.shake=Math.max(G.shake,4);
}

/* ambiental: pinchos, agua y caidas. No lo cubren las pasivas. */
function damage(n,ambiental){
  if(P.inv>0||P.dead>0)return;
  const pas=!ambiental&&PASIVAS[G.rol];
  if(pas&&Math.random()<pas.prob){
    /* El orbe dura medio segundo mas que el resto, asi que su destello
       tiene que acompanarlo o pareceria que se apaga antes de tiempo. */
    P.pas=pas.tipo==='esquiva'?22:(pas.tipo==='orbe'?51:26);
    P.pasTipo=pas.tipo;
    P.inv=Math.max(P.inv,pas.inv);       // se solapa con la invulnerabilidad normal
    if(pas.tipo==='esquiva'){SFX.esquiva();}
    else{empujarConEscudo();SFX[pas.tipo==='orbe'?'orbe':'escudo']();}
    return;
  }
  const D=DIFICULTADES[G.dif]||DIFICULTADES.normal;
  if(D.unGolpe){                       // pesadilla: un golpe y fuera
    G.hp=0;P.inv=72;G.shake=8;SFX.hurt();
    P.vy=-2.4;P.vx=P.face?2.2:-2.2;P.onLadder=false;
    P.dead=60;SFX.die();return;
  }
  n=Math.ceil(n*(ROLES[G.rol]?ROLES[G.rol].encaja:1));   // el mago encaja un 50% mas
  n=Math.ceil(n*D.mult);                                  // y la dificultad elegida
  /* La vida se lleva en CUARTOS de corazon. El dano se calcula igual que
     siempre y se dobla al final, asi que con armadura 0 y 1 los numeros son
     identicos a los de antes en las tres dificultades: lo unico que cambia
     es que ahora hay sitio para escalones mas finos por encima. */
  n=Math.max(1, n*2 - RED_ARM[Math.min(RED_ARM.length-1,G.armor||0)]);
  G.hp-=n;P.inv=72;G.shake=6;SFX.hurt();
  P.vy=-2.4;P.vx=P.face?2.2:-2.2;P.onLadder=false;
  if(G.hp<=0){G.hp=0;P.dead=60;SFX.die();}
}
function guardiaViva(){
  return ents.some(e=>e.type==='mini'&&!e.dead);
}
function avisoGuardia(){
  const g=ents.find(e=>e.type==='mini');
  G.msg=(g?g.nombre:'EL GUARDIAN')+' TE CIERRA EL PASO';G.msgT=110;SFX.no();
}
function transitions(){
  const L=LEVELS[G.lv],last=L.rooms-1;
  const SALIDA=3;                 // margen para dar por cruzado el borde
  const ENT_IZQ=TS+4;             // entradas: siempre fuera de la columna de muro
  const ENT_DER=VW-P.w-TS-4;
  if(P.x<SALIDA){
    if(G.idx>0){enterRoom(G.lv,G.idx-1,{x:ENT_DER,y:P.y});return;}
    P.x=SALIDA;P.vx=0;
  }
  if(P.x+P.w>VW-SALIDA){
    if(G.idx<last){enterRoom(G.lv,G.idx+1,{x:ENT_IZQ,y:P.y});return;}
    /* El Vampiro Mayor custodia el porton: era el unico paso del juego que
       no consultaba al guardian, asi que se le podia saltar por la derecha y
       colarse en el castillo sin pelear. */
    if(G.lv==='exterior'&&guardiaViva()){P.x=VW-P.w-SALIDA;P.vx=0;avisoGuardia();return;}
    if(G.lv==='exterior'){SFX.gate();fadeTo(()=>enterRoom('p0',0,{x:ENT_IZQ,y:(ROWS-3)*TS}));return;}
    P.x=VW-P.w-SALIDA;P.vx=0;
  }
  if(P.y<-4&&UPLINK[G.lv]&&G.idx===last&&guardiaViva()){P.y=0;P.vy=0;avisoGuardia();return;}
  if(P.y<-4&&UPLINK[G.lv]&&G.idx===last){SFX.stairs();const d=UPLINK[G.lv][1];
    fadeTo(()=>enterRoom(d,0,{x:TS*2,y:(ROWS-3)*TS}));return;}
  // regreso desde los sotanos: se sale por la primera sala hacia la planta de arriba
  if(P.y<-4&&REGRESO[G.lv]&&G.idx===0){
    SFX.stairs();const d=REGRESO[G.lv];
    fadeTo(()=>enterRoom(d,LEVELS[d].rooms-1,{x:TS*5,y:(ROWS-3)*TS}));return;
  }
  if(P.y>PH+6){
    if(DOWNLINK[G.lv]&&G.idx===last){SFX.stairs();const d=DOWNLINK[G.lv][1];
      fadeTo(()=>enterRoom(d,0,{x:TS*2,y:(ROWS-3)*TS}));return;}
    damage(3,true);P.y=PH-40;P.vy=0;   // caida al vacio: sin pasiva
  }
  const puedeSubir=(UPLINK[G.lv]&&G.idx===last)||(REGRESO[G.lv]&&G.idx===0);
  if(P.y<0&&!puedeSubir)P.y=0;
}

/* ==========================================================
   DIFICULTAD
   Cambia lo que encajas, no lo que repartes: el reto esta en
   aguantar, no en tardar mas en matar.
   ========================================================== */
/* Reduccion de dano por nivel de armadura, en cuartos de corazon.
   Los dos primeros escalones reproducen exactamente el comportamiento
   anterior; a partir de ahi el suelo de 1 cuarto deja margen para mas. */
const RED_ARM=[0,2,4,5,6];
/* Un enemigo helado no solo anda mas despacio: tambien TARDA MUCHO MAS en
   volver a atacar. Sus contadores de recarga solo avanzan uno de cada tres
   fotogramas, asi que el hielo triplica de hecho cualquier cadencia. Se
   centraliza aqui para que valga igual para caminantes, minijefes y jefe. */
const cuentaRecarga=e=>!(e.lento>0&&(G.tick%3));
/* El precio de un articulo puede depender de la partida. */
const precio=it=>typeof it.c==='function'?it.c():it.c;
/* Hasta que nivel la armadura sigue reduciendo dano de verdad en cada
   dificultad. Por encima el escalon es ESPURIO: en facil ni se vende, y en
   normal y dificil se paga con vidas extra en vez de con reduccion. */
/* Hasta arm3 la armadura reduce dano. arm4 es el escalon ESPURIO: ya no
   puede quitar mas, asi que paga en vidas. En facil el suelo llega antes,
   asi que ahi los ultimos escalones son solo aspecto y valen una miseria. */
const ARM_UTIL={facil:2,normal:3,dificil:3,pesadilla:0};
const armUtil=()=>ARM_UTIL[G.dif]!==undefined?ARM_UTIL[G.dif]:3;
const armEspuria=()=>(G.armor||0)>=armUtil();
const soloEstetica=()=>armEspuria()&&G.dif==='facil';
const vidasPorEspurio=()=>G.dif==='dificil'?2:1;

const DIFICULTADES={
  facil:    {nombre:'FACIL',    mult:.5,  vidas:2, desc:['LOS MONSTRUOS HACEN LA MITAD DE DANO','PARA APRENDER EL CASTILLO']},
  normal:   {nombre:'NORMAL',   mult:1,   vidas:2, desc:['EL EQUILIBRIO PREVISTO','COMO SE PENSO EL JUEGO']},
  dificil:  {nombre:'DIFICIL',  mult:1.5, vidas:2, desc:['LOS MONSTRUOS HACEN UN 50% MAS','PARA QUIEN YA CONOCE RAVENMOOR']},
  pesadilla:{nombre:'PESADILLA',mult:99,  vidas:3, unGolpe:true,
             desc:['UN SOLO GOLPE Y PIERDES LA VIDA','TRES VIDAS Y NADA MAS','LAS BOTAS DE NORA SON TU UNICA RED']}
};
const ORDEN_DIF=['facil','normal','dificil','pesadilla'];

const BOTAS={n:'BOTAS DE VIAJE',d:'UNA VIDA MAS PARA SEGUIR SUBIENDO',c:260,
  do:()=>{G.lives++;G.botas=(G.botas||0)+1;},max:()=>(G.botas||0)>=4};
const SHOP=[
 {n:'CORAZON EXTRA',d:'+1 CORAZON DE VIDA MAXIMA',c:120,do:()=>{G.maxhp+=4;G.hp=G.maxhp;}},
 {n:'ARMADURA',
   d:()=>(soloEstetica()
     ? 'SOLO ADORNO AQUI. ARMADURA DE '+proxMat(G.armor)
     : armEspuria()
       ? '+'+vidasPorEspurio()+' VIDA'+(vidasPorEspurio()>1?'S':'')+
         (G.dif==='dificil'?' Y ALGO MENOS DE DANO. ':'. ')+'ARMADURA DE '+proxMat(G.armor)
       : '-1/4 DE CORAZON POR GOLPE. ARMADURA DE '+proxMat(G.armor)),
   c:()=>soloEstetica()?40:220,
   do:()=>{
     /* Pasado el nivel util la placa ya no quita mas dano: en normal y
        dificil se paga en vidas, y en facil se vende como adorno a precio
        simbolico en vez de prohibirse. */
     if(armEspuria()&&!soloEstetica())G.lives+=vidasPorEspurio();
     G.armor++;
   },
   max:()=>G.armor>=MEJORA_MAX},
 {n:'ARMA MEJORADA',d:()=>'+50% DE DANO. ARMA DE '+proxMat(G.mejoras),c:200,
   do:()=>{G.dmg=Math.round((G.dmg+ROLES[G.rol].dmg*.5)*100)/100;G.mejoras=(G.mejoras||0)+1;},
   max:()=>(G.mejoras||0)>=MEJORA_MAX},
 {n:'POCION MAYOR',d:'RECUPERA TODA LA VIDA',c:60,do:()=>{G.hp=G.maxhp;}},
 {n:'SALIR',d:'VOLVER A LA CUEVA',c:0,do:()=>{}}
];
/* El puesto ambulante: menos surtido y mas caro. La cueva sigue
   siendo la buena, y por eso merece la pena bajar tres plantas. */
const SHOP_AMB=[
 {n:'POCION',d:'RECUPERA TODA LA VIDA',c:110,do:()=>{G.hp=G.maxhp;}},
 {n:'CORAZON EXTRA',d:'+1 CORAZON DE VIDA MAXIMA',c:260,do:()=>{G.maxhp+=4;G.hp=G.maxhp;}},
 {n:'ARMA MEJORADA',d:()=>'+50% DE DANO. ARMA DE '+proxMat(G.mejoras),c:380,
   do:()=>{G.dmg=Math.round((G.dmg+ROLES[G.rol].dmg*.5)*100)/100;G.mejoras=(G.mejoras||0)+1;},
   max:()=>(G.mejoras||0)>=MEJORA_MAX},
 {n:'SALIR',d:'SEGUIR EXPLORANDO',c:0,do:()=>{}}
];
function tienda(){
  const base=G.ambulante?SHOP_AMB:SHOP;
  const D=DIFICULTADES[G.dif]||DIFICULTADES.normal;
  if(!D.unGolpe)return base;
  // en pesadilla los corazones y la armadura no sirven de nada:
  // Nora vende botas, que son vidas
  return [BOTAS].concat(base.filter(it=>it.n!=='CORAZON EXTRA'&&it.n!=='ARMADURA'&&it.n!=='POCION MAYOR'&&it.n!=='POCION'));
}
const OPCIONES_PAUSA=[
  {n:'CONTINUAR',      hacer:()=>{G.mode='play';beep(500,.08);}},

  {n:'CONTROLES',      valor:()=>G.ctrlAbajo?'DEBAJO':'SOBRE EL JUEGO',

];

function updateShop(){
  const CAT=tienda();
  if(IN.upP){G.shopSel=(G.shopSel+CAT.length-1)%CAT.length;beep(700,.05);}
  if(IN.downP){G.shopSel=(G.shopSel+1)%CAT.length;beep(700,.05);}
  if(IN.jumpP||IN.atkP){
    const it=CAT[G.shopSel];
    if(precio(it)===0){G.mode='play';musPlay(MUSICA_ZONA[LEVELS[G.lv].theme]||'castillo');return;}
    if(it.max&&it.max()){G.fraseNora=pick2(FRASES_NORA.tope);SFX.no();return;}
    const pc=precio(it);
    if(G.gold>=pc){G.gold-=pc;it.do();SFX.buy();G.fraseNora=pick2(FRASES_NORA.compra);}
    else{SFX.no();G.fraseNora=pick2(FRASES_NORA.pobre);}
  }
}

   DIBUJO DE CASILLAS
   ========================================================== */
/* ==========================================================
   SILLARES
   Seis variantes elegidas por un ruido determinista de la
   posicion, mas remates segun los vecinos: lo que rompe el
   patron repetido es lo que mas delata el tile art pobre.
   ========================================================== */
const RAMPA_TEMA={piedra:'piedra',salon:'piedraC',biblio:'ladrillo',noche:'piedra',azotea:'piedra',
  torreon:'torreon',cripta:'cripta',cueva:'cueva',cielo:'torreon'};
function tileTierra(x,y,vecinos){
  const T=RAMPA.tierra, H=RAMPA.hierba;
  const v=ruidoCasilla(x/TS|0,y/TS|0,23);
  ctx.fillStyle=T[1];ctx.fillRect(x,y,TS,TS);
  // grumos y piedrecillas
  ctx.fillStyle=T[0];
  ctx.fillRect(x+((v*12)|0)+1,y+5,3,2);ctx.fillRect(x+((v*8)|0)+6,y+11,4,2);
  ctx.fillStyle=T[2];
  ctx.fillRect(x+((v*10)|0)+2,y+8,2,1);ctx.fillRect(x+((v*6)|0)+10,y+3,2,1);
  if(v>.72){ctx.fillStyle=RAMPA.piedra[1];ctx.fillRect(x+3,y+9,4,3);
    ctx.fillStyle=RAMPA.piedra[2];ctx.fillRect(x+3,y+9,4,1);}
  if(vecinos&&!vecinos.arriba){
    // corona de hierba con matas irregulares
    ctx.fillStyle=H[1];ctx.fillRect(x,y,TS,4);
    ctx.fillStyle=H[2];ctx.fillRect(x,y,TS,2);
    ctx.fillStyle=H[3];
    for(let i=0;i<TS;i+=3){
      const a=1+((ruidoCasilla((x/TS|0)*17+i,y/TS|0,29)*3)|0);
      ctx.fillRect(x+i,y-a+1,1,a);
    }
    ctx.fillStyle=H[0];ctx.fillRect(x,y+4,TS,1);
  }
  if(vecinos&&!vecinos.abajo){ctx.fillStyle=T[0];ctx.fillRect(x,y+TS-2,TS,2);}
}
function tileStone(x,y,tema,vecinos){
  if(tema==='noche')return tileTierra(x,y,vecinos);
  const R=RAMPA[RAMPA_TEMA[tema]||'piedra'];
  const v=ruidoCasilla(x/TS|0,y/TS|0,7);
  const tipo=Math.floor(v*6);
  ctx.fillStyle=R[1];ctx.fillRect(x,y,TS,TS);

  // juntas de mamposteria: aparejo a soga, alternando por fila
  ctx.fillStyle=R[0];
  const desfase=(((y/TS)|0)%2)*8;
  ctx.fillRect(x,y+7,TS,1);ctx.fillRect(x,y+15,TS,1);
  ctx.fillRect(x+((desfase+7)%16),y,1,8);
  ctx.fillRect(x+((desfase+3)%16),y+8,1,8);

  // luz superior de cada sillar y sombra inferior
  ctx.fillStyle=R[2];
  ctx.fillRect(x+1,y+1,6,1);ctx.fillRect(x+9,y+1,6,1);
  ctx.fillRect(x+1,y+9,6,1);ctx.fillRect(x+9,y+9,6,1);
  ctx.fillStyle=R[0];
  ctx.fillRect(x+1,y+6,6,1);ctx.fillRect(x+9,y+6,6,1);

  // variantes de desgaste
  if(tipo===1){ // agrietado
    ctx.fillStyle=R[0];
    ctx.fillRect(x+4,y+1,1,3);ctx.fillRect(x+5,y+3,1,3);ctx.fillRect(x+5,y+9,1,4);
  } else if(tipo===2){ // sillar picado
    ctx.fillStyle=R[0];
    ctx.fillRect(x+10,y+3,3,2);ctx.fillRect(x+2,y+11,2,2);
  } else if(tipo===3){ // piedra clara, recien tallada
    ctx.fillStyle=R[2];
    ctx.fillRect(x+9,y+8,6,6);
    ctx.fillStyle=R[3];ctx.fillRect(x+9,y+8,6,1);
  } else if(tipo===4){ // pequenos guijarros embebidos
    ctx.fillStyle=R[3];
    ctx.fillRect(x+3,y+3,1,1);ctx.fillRect(x+11,y+12,1,1);ctx.fillRect(x+7,y+10,1,1);
  }

  // remates segun vecinos
  if(vecinos&&!vecinos.arriba){        // coronacion iluminada
    ctx.fillStyle=R[3];ctx.fillRect(x,y,TS,1);
    ctx.fillStyle=R[2];ctx.fillRect(x,y+1,TS,1);
    if(tipo===5){ctx.fillStyle=RAMPA.musgo[2];  // musgo asomando
      ctx.fillRect(x+2,y+2,2,2);ctx.fillRect(x+9,y+2,3,1);ctx.fillRect(x+13,y+2,1,2);}
  }

/* Pinchos: tres puas de hierro forjado en vez de cuatro dientes iguales.
   Cada una lleva luz por un lado y sombra por el otro, punta blanca y una
   base ancha remachada. Alturas distintas para que no parezcan un peine. */
function tileSpike(x,y){
  ctx.fillStyle='#000';ctx.fillRect(x,y,TS,TS);
  const puas=[[1,13],[6,15],[11,12]];       // [columna, alto]
  for(const [px,alto] of puas){
    const base=y+TS-2, cima=base-alto;
    for(let j=0;j<alto;j++){
      const yy=base-j;
      const an=Math.max(1,Math.round(4*(1-j/alto)));  // se afila hacia arriba
      const x0=px+Math.floor((4-an)/2);
      ctx.fillStyle=PAL.w;ctx.fillRect(x+x0,yy,an,1);           // cuerpo
      ctx.fillStyle=PAL.e;ctx.fillRect(x+x0,yy,1,1);            // filo iluminado
      if(an>2){ctx.fillStyle=PAL.d;ctx.fillRect(x+x0+an-1,yy,1,1);}  // sombra
    }
    ctx.fillStyle=PAL.W;ctx.fillRect(x+px+1,cima,1,2);          // punta
  }
  // zocalo de piedra con remaches, del que salen las puas
  ctx.fillStyle=PAL.d;ctx.fillRect(x,y+TS-2,TS,2);
  ctx.fillStyle=PAL.w;ctx.fillRect(x,y+TS-2,TS,1);
  ctx.fillStyle=PAL.k;

}

/* Puerta de mazmorra: arco de sillería, hoja entreabierta y,

function tilePuerta(x,y,sube){
  const P=RAMPA.piedra, M=RAMPA.madera, T=RAMPA.metal;

  ctx.fillStyle=P[0];ctx.fillRect(bx+2,by,2,AL);
  // dovelas del arco

  ctx.fillStyle=P[2];ctx.fillRect(bx+6,by-2,20,1);ctx.fillRect(bx+4,by,24,1);
