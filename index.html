<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ravenmoor — El Castillo</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, rgba(0,0,0,0) 2px 4px),
      radial-gradient(circle at 50% 35%, #191a3d 0%, #04040a 72%);
    color:#8a8ab0;font-family:"Courier New",monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:8px;overflow:hidden;
  }
  #frame{background:#0000AA;padding:14px;border-radius:6px;position:relative;
    box-shadow:0 0 0 3px #000 inset,0 12px 40px rgba(0,0,0,.85)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    width:min(94vw, calc((100vh - 190px) * 1.6));max-width:1000px;
    aspect-ratio:320/200;background:#000}
  #hint{font-size:12px;letter-spacing:1px;text-align:center;line-height:1.7}
  #hint b{color:#FFCC33;font-weight:normal}
  #pad{display:none;gap:14px;width:min(94vw,540px);justify-content:space-between;user-select:none}
  .cluster{display:flex;gap:8px}
  .btn{width:58px;height:58px;border-radius:8px;border:2px solid #000;background:#0000AA;
    color:#FFCC33;font:15px "Courier New",monospace;display:flex;align-items:center;
    justify-content:center;user-select:none}
  .btn:active{background:#FF8800;color:#000}
  #full{position:fixed;top:8px;right:8px;z-index:30;width:40px;height:40px;border-radius:8px;
    border:2px solid #000;background:rgba(0,0,170,.85);color:#FFCC33;font-size:18px;
    display:flex;align-items:center;justify-content:center}
  #girar{display:none}

  @media (pointer:coarse){#pad{display:flex}#hint{display:none}}

  /* ---------- PANTALLA COMPLETA ----------
     El marco desaparece, el lienzo ocupa todo lo posible manteniendo
     la proporcion 320x200, y los mandos se superponen translucidos. */
  body.completa{padding:0;gap:0;background:#000}
  body.completa #hint{display:none}
  body.completa #frame{padding:0;border-radius:0;box-shadow:none;background:#000}
  body.completa canvas{
    width:min(100vw, calc(100vh * 1.6));
    height:min(100vh, calc(100vw / 1.6));
    max-width:none;
  }
  body.completa #pad{
    display:flex;position:fixed;left:0;right:0;bottom:0;
    width:100%;padding:0 10px 8px;pointer-events:none;
    justify-content:space-between;align-items:flex-end;z-index:20;
  }
  body.completa #pad .cluster{pointer-events:auto}
  body.completa .btn{
    width:50px;height:50px;background:rgba(0,0,170,.24);
    border-color:rgba(0,0,0,.35);color:rgba(255,204,51,.55);backdrop-filter:blur(1px);
  }
  body.completa .btn:active{background:rgba(255,136,0,.8);color:#000;
    border-color:rgba(0,0,0,.6)}

  /* ---------- CONTROLES DEBAJO ----------
     Reserva una banda propia para los mandos: el lienzo encoge un poco
     pero nada tapa al personaje. Se cambia desde el menu de pausa. */
  body.completa.ctrl-abajo{justify-content:flex-start}
  body.completa.ctrl-abajo canvas{
    width:min(100vw, calc((100vh - 74px) * 1.6));
    height:min(calc(100vh - 74px), calc(100vw / 1.6));
  }
  body.completa.ctrl-abajo #pad{
    position:static;padding:6px 10px 4px;background:#05050f;
    align-items:center;
  }
  body.completa.ctrl-abajo .btn{
    background:#0000AA;color:#FFCC33;border-color:#000;width:52px;height:52px;
  }
  body.completa.ctrl-abajo .btn:active{background:#FF8800;color:#000}

  /* Aviso para girar el movil: el juego es apaisado */
  @media (pointer:coarse) and (orientation:portrait){
    #girar{display:block;font-size:12px;color:#FFCC33;text-align:center;letter-spacing:1px}
  }
</style>
</head>
<body>
<button id="full" title="Pantalla completa">&#9974;</button>
<div id="frame"><canvas id="cv" width="320" height="200"></canvas></div>
<div id="girar">&#8635; Gira el móvil en horizontal para verlo más grande</div>
<div id="hint">
  <b>&#8592; &#8594;</b> mover · <b>&#8593; &#8595;</b> escaleras, puertas y tienda · <b>ESPACIO</b> saltar (mantén para saltar más) · <b>X</b> espada<br>
  Mando compatible: <b>cruceta</b> / stick, <b>A</b> saltar, <b>X</b> o <b>B</b> atacar, <b>Start</b> continuar. &nbsp;·&nbsp; <b>M</b> música &nbsp;·&nbsp; <b>F</b> pantalla completa &nbsp;·&nbsp; <b>ESC</b> o <b>P</b> pausa.
</div>
<div id="pad">
  <div class="cluster">
    <button class="btn" data-k="ArrowLeft">&#8592;</button>
    <button class="btn" data-k="ArrowUp">&#8593;</button>
    <button class="btn" data-k="ArrowDown">&#8595;</button>
    <button class="btn" data-k="ArrowRight">&#8594;</button>
  </div>
  <div class="cluster">
    <button class="btn" data-k="KeyX">ESP</button>
    <button class="btn" data-k="Space">SALT</button>
    <button class="btn" data-k="Escape">II</button>
  </div>
</div>
<script>
(()=>{
"use strict";
/* ==========================================================
   PALETA AMSTRAD CPC
   ========================================================== */
/* ==========================================================
   PALETA
   El CPC clasico da 27 tintas; el 6128 PLUS permite 32 tintas
   simultaneas de una paleta de 4096. Aprovechamos eso para
   trabajar con rampas de 3-4 tonos por material.
   ========================================================== */
const PAL={k:'#000000',n:'#000080',b:'#0000FF',r:'#800000',m:'#800080',v:'#8000FF',
R:'#FF0000',p:'#FF0080',P:'#FF00FF',g:'#008000',c:'#008080',l:'#0080FF',q:'#808000',
w:'#808080',a:'#8080FF',o:'#FF8000',h:'#FF8080',y:'#FFFF00',G:'#00FF00',C:'#00FFFF',
W:'#FFFFFF',s:'#804000',d:'#404040',e:'#C0C0C0',t:'#FFCC33',
/* Verdes anadidos para el rediseno de los jefes: ambos son colores
   legitimos del hardware CPC, la rampa solo tenia g y G. */
L:'#80FF80',E:'#80FF00',
/* Tintas que llevaban tiempo en el editor de sprites pero no aqui: sin ellas
   los dibujos hechos con el se colaban con huecos invisibles. */
j:'#FF9EC4',J:'#C4527F',f:'#E8D8B0',F:'#A89878'};

/* Rampas de material: [sombra, medio, luz, brillo] */
const RAMPA={
  piedra:  ['#191922','#2E2E3E','#4A4A60','#6E6E8A'],
  piedraC: ['#22221C','#3A3A30','#5C5C4E','#84846E'],   // salones, mas calida
  ladrillo:['#2A1418','#44202A','#5E2E3A','#7E4450'],
  cripta:  ['#0E1014','#1C2028','#2E3440','#454E5E'],
  cueva:   ['#1E1008','#34200E','#4E3418','#6E4C26'],
  torreon: ['#0A1820','#142C38','#204450','#2E606E'],
  madera:  ['#2A1608','#4A2A10','#6E4018','#96602A'],
  metal:   ['#20242C','#3A4048','#5C646E','#8A94A0'],
  oro:     ['#5A4000','#8A6400','#C09000','#FFD24A'],
  /* Escalado de las mejoras de la tienda: cinco peldanos de material.
     'oro' ya existia y se reaprovecha como tercer peldano. */
  bronce:  ['#3A2008','#6A3C12','#9A5C1E','#C88A3E'],
  plata:   ['#33383F','#666D78','#A2A9B4','#E6EAF2'],
  platino: ['#243634','#4E6E6A','#8CAEA8','#DCF0EC'],
  diamante:['#0E2E46','#1C5E8C','#48AEDC','#C6F4FF'],
  musgo:   ['#12200E','#1E3818','#2E5424','#447434'],
  tierra:  ['#1A1208','#2E2114','#443220','#5E4830'],
  hierba:  ['#10240E','#1A3A16','#28542A','#3A7038'],
  hueso:   ['#3A3830','#5E5A4E','#8A8474','#B8B2A0']
};
/* Sombra de cada tinta, para dar bulto a los sprites */
const SOMBRA={s:'#4A2400',d:'#1E1E1E',y:'#B8A000',h:'#B84E4E',e:'#7E7E7E',g:'#004A00',
  v:'#4A0090',q:'#4A4A00',o:'#B85200',w:'#4A4A4A',W:'#B0B0B0',m:'#4A004A',
  R:'#960000',C:'#00A0A0',G:'#00A000',b:'#0000A0',c:'#004A4A',t:'#B08A22'};
const sombraDe=c=>SOMBRA[c]||PAL[c]||'#000000';
/* Ruido determinista por casilla: la misma sala se ve siempre igual */
function ruidoCasilla(x,y,sal){
  let h=(x*73856093)^(y*19349663)^((sal||0)*83492791);
  h=(h^(h>>>13))>>>0; h=Math.imul(h,1274126177)>>>0;
  return ((h^(h>>>16))>>>0)/4294967296;
}

const TS=16,COLS=20,ROWS=11,VW=320,VH=200,PH=ROWS*TS;
const HUD_H=VH-PH;   // franja del marcador, ahora en la parte de arriba
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

/* ==========================================================
   AUDIO
   ========================================================== */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(f,d,t='square',v=.055,sl=0){
  const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();
  o.type=t;o.frequency.setValueAtTime(f,a.currentTime);
  if(sl)o.frequency.linearRampToValueAtTime(Math.max(30,f+sl),a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
/* ==========================================================
   MOTOR DE MUSICA CHIPTUNE
   4 canales: dos pulsos (melodia y contracanto), triangulo
   para el bajo y ruido para la percusion, como un AY con
   arreglos al estilo de los cartuchos de 8 bits.
   ========================================================== */
let masterMus=null, musTimer=null, musActual=null, musPaso=0, musTiempo=0, musMudo=false;
let ruidoBuf=null;

function musGain(){
  const a=ac(); if(!a)return null;
  if(!masterMus){masterMus=a.createGain();masterMus.gain.value=.34;masterMus.connect(a.destination);}
  return masterMus;
}
const ESCALA={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nota(n){
  const m=/^([A-G]#?)(-?\d)$/.exec(n); if(!m)return 0;
  return 440*Math.pow(2,(ESCALA[m[1]]+12*(+m[2]+1)-69)/12);
}
function ruido(){
  const a=ac(); if(!ruidoBuf&&a){
    ruidoBuf=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);
    const d=ruidoBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  return ruidoBuf;
}
function voz(tipo,f,t,dur,vol){
  const a=ac(),g0=musGain(); if(!a||!g0||!f)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=tipo; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.008);
  g.gain.setValueAtTime(vol,t+dur*.55);
  g.gain.exponentialRampToValueAtTime(.0005,t+dur*.98);
  o.connect(g);g.connect(g0);o.start(t);o.stop(t+dur);
}
function percu(tipo,t){
  const a=ac(),g0=musGain(); if(!a||!g0)return;
  if(tipo==='k'){
    const o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.setValueAtTime(170,t);
    o.frequency.exponentialRampToValueAtTime(46,t+.11);
    g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);
    o.connect(g);g.connect(g0);o.start(t);o.stop(t+.14);
    return;
  }
  const src=a.createBufferSource();src.buffer=ruido();
  const f=a.createBiquadFilter(),g=a.createGain();
  let fin;
  if(tipo==='s'){f.type='bandpass';f.frequency.value=1900;
    g.gain.setValueAtTime(.34,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);fin=.13;}
  else{f.type='highpass';f.frequency.value=7000;
    g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);fin=.06;}
  src.connect(f);f.connect(g);g.connect(g0);
  src.start(t);            // siempre arrancar antes de programar la parada
  src.stop(t+fin);
}
const T=s=>s.trim().split(/\s+/);

function musPlay(id){
  if(musActual===id)return;
  musActual=id; musPaso=0;
  const a=ac(); if(!a)return;
  musTiempo=a.currentTime+.08;
  if(!musTimer)musTimer=setInterval(musTick,25);
}
function musStop(){musActual=null;}
function musTick(){
  const a=ac(); if(!a||!musActual||musMudo)return;
  const P=MUSICA[musActual]; if(!P)return;
  const paso=15/P.bpm;                    // duracion de una semicorchea
  if(musTiempo<a.currentTime)musTiempo=a.currentTime+.05;
  while(musTiempo<a.currentTime+.22){
    const i=musPaso;
    const lee=(pista,mult)=>{
      if(!pista)return;
      const v=pista[i%pista.length];
      if(v&&v!=='.')return v;
    };
    const l=lee(P.lead), h=lee(P.harm), b=lee(P.bass), d=lee(P.drum);
    if(l)voz(P.ondaLead||'square',nota(l),musTiempo,paso*(P.largoLead||3.4),.16);
    if(h)voz(P.ondaHarm||'square',nota(h),musTiempo,paso*2.6,.085);
    if(b)voz('triangle',nota(b),musTiempo,paso*3.2,.30);
    if(d)percu(d,musTiempo);
    musPaso++; musTiempo+=paso;
  }
}
/* ==========================================================
   REPERTORIO: una pieza por zona, en semicorcheas.
   '.' = silencio o nota sostenida.
   ========================================================== */
const MUSICA={
  /* Titulo: fanfarria heroica en Re menor */
  titulo:{bpm:128,
    lead:T(`D5 . A4 . D5 . F5 . E5 . . . D5 . . .
            C5 . G4 . C5 . E5 . D5 . . . A4 . . .
            A#4 . F4 . A#4 . D5 . C5 . . . A4 . . .
            G4 . A4 . A#4 . C5 . D5 . . . . . . .`),
    harm:T(`F4 . . . A4 . . . A4 . . . F4 . . .
            E4 . . . G4 . . . F4 . . . E4 . . .
            D4 . . . F4 . . . E4 . . . C4 . . .
            A#3 . . . C4 . . . D4 . . . . . . .`),
    bass:T(`D2 . D2 . D2 . D2 . A2 . A2 . D2 . D2 .
            C2 . C2 . C2 . C2 . G2 . G2 . C2 . C2 .
            A#1 . A#1 . A#1 . A#1 . F2 . F2 . A#1 . A#1 .
            G2 . G2 . A2 . A2 . D2 . D2 . D2 . . .`),
    drum:T(`k . h . s . h . k . k . s . h .
            k . h . s . h . k . k . s . h .
            k . h . s . h . k . k . s . h .
            k . h . s . h . k . s . k s k s`)},

  /* Creditos: marcha de victoria en Re mayor, amplia y luminosa. Suena
     durante toda la secuencia final. */
  victoria:{bpm:112, largoLead:3.4,
    lead:T(`D5 . . . F#5 . . . A5 . . . . . F#5 .
            G5 . . . F#5 . E5 . D5 . . . . . . .
            E5 . . . G5 . . . B5 . . . . . A5 .
            F#5 . . . E5 . . . D5 . . . . . . .
            A5 . . . A5 . G5 . F#5 . . . D5 . . .
            E5 . . . F#5 . G5 . A5 . . . . . . .
            D6 . . . A5 . . . F#5 . . . D5 . . .
            E5 . F#5 . G5 . A5 . D6 . . . . . . .`),
    harm:T(`A4 . . . D5 . . . F#5 . . . . . D5 .
            B4 . . . A4 . . . F#4 . . . . . . .
            G4 . . . B4 . . . D5 . . . . . C#5 .
            A4 . . . G4 . . . F#4 . . . . . . .
            F#4 . . . E4 . . . D4 . . . A4 . . .
            A4 . . . B4 . . . C#5 . . . . . . .
            F#5 . . . D5 . . . A4 . . . F#4 . . .
            A4 . B4 . C#5 . D5 . F#5 . . . . . . .`),
    bass:T(`D2 . D2 . A2 . A2 . D3 . D2 . A2 . A2 .
            G2 . G2 . D2 . D2 . A2 . A2 . D2 . D2 .
            E2 . E2 . B2 . B2 . E3 . E2 . B2 . B2 .
            A2 . A2 . E2 . E2 . D2 . D2 . D2 . D2 .
            D2 . D2 . A2 . A2 . D3 . D2 . G2 . G2 .
            A2 . A2 . E2 . E2 . A2 . A2 . A2 . A2 .
            D2 . D2 . F#2 . F#2 . A2 . A2 . D2 . D2 .
            G2 . A2 . D2 . D2 . D3 . . . D2 . . .`),
    drum:T(`k . h . s . h . k . k . s . h .
            k . h . s . h . k . k . s . h .
            k . h . s . h . k . k . s . h .
            k . h . s . h . k . s . k . s .
            k . h . s . h . k . k . s . h .
            k . h . s . h . k . k . s . h .
            k . h . s . h . k . k . s . h .
            k . s . k . s . k s k s k s k s`)},

  /* Fanfarria: golpe de trompeteria corto y brillante para el momento en que
     el rey arma caballero al heroe. */
  fanfarria:{bpm:120, largoLead:4.2,
    lead:T(`D5 . D5 . D5 . . . F#5 . . . A5 . . .
            A5 . . . B5 . A5 . F#5 . . . . . . .
            A5 . A5 . A5 . . . D6 . . . . . . .
            C#6 . B5 . A5 . . . D6 . . . . . . .`),
    harm:T(`A4 . A4 . A4 . . . D5 . . . F#5 . . .
            F#5 . . . G5 . F#5 . D5 . . . . . . .
            F#5 . F#5 . F#5 . . . A5 . . . . . . .
            A5 . G5 . F#5 . . . A5 . . . . . . .`),
    bass:T(`D2 . . . D2 . . . D3 . . . D2 . . .
            D2 . . . G2 . . . D2 . . . A2 . . .
            D2 . . . D2 . . . D3 . . . A2 . . .
            A2 . . . A2 . . . D2 . D3 . D2 . . .`),
    drum:T(`k . . . k . . . s . . . k . . .
            k . . . s . . . k . . . s . . .
            k . . . k . . . s . . . k s k s
            k . s . k . s . k s k s k s k s`)},

  /* Azotea: tension antes del final. Do menor, tempo contenido, la melodia
     sube por semitonos sin llegar nunca a resolver: el oido espera un cierre
     que no llega, y eso es lo que pone nervioso. */
  azotea:{bpm:96, largoLead:5,
    lead:T(`C5 . . . . . D#5 . . . G5 . . . . .
            F#5 . . . . . G5 . . . . . . . . .
            G#5 . . . . . G5 . . . D#5 . . . . .
            D5 . . . . . . . C5 . . . . . . .
            G5 . . . . . G#5 . . . A#5 . . . . .
            A5 . . . . . A#5 . . . . . . . . .
            C6 . . . . . A#5 . . . G#5 . . . . .
            G5 . . . F#5 . . . G5 . . . . . . .`),
    harm:T(`G4 . . . . . . . C5 . . . . . . .
            A#4 . . . . . . . C5 . . . . . . .
            C5 . . . . . . . A#4 . . . . . . .
            G#4 . . . . . . . G4 . . . . . . .
            C5 . . . . . . . D#5 . . . . . . .
            D5 . . . . . . . D#5 . . . . . . .
            F5 . . . . . . . D#5 . . . . . . .
            D5 . . . C#5 . . . D5 . . . . . . .`),
    bass:T(`C2 . . . C2 . . . G#1 . . . G#1 . . .
            A#1 . . . A#1 . . . C2 . . . C2 . . .
            C2 . . . C2 . . . G#1 . . . G#1 . . .
            G1 . . . G1 . . . C2 . . . C2 . . .
            C2 . . . C2 . . . D#2 . . . D#2 . . .
            D2 . . . D2 . . . D#2 . . . D#2 . . .
            F2 . . . F2 . . . D#2 . . . D#2 . . .
            D2 . . . C#2 . . . C2 . . . C2 . . .`),
    drum:T(`k . . . . . h . . . . . s . . .
            k . . . . . h . . . . . s . . .
            k . . . . . h . . . . . s . . .
            k . . . . . h . . . s . k . s .
            k . . . . . h . . . . . s . . .
            k . . . . . h . . . . . s . . .
            k . . h . . h . . . . . s . . .
            k . s . k . s . k . s . k s k s`)},

  /* Cementerio: marcha inquietante en La menor */
  cementerio:{bpm:104, largoLead:4.5,
    lead:T(`A4 . . . C5 . . . E5 . . . D5 . . .
            C5 . . . B4 . . . A4 . . . . . . .
            F4 . . . A4 . . . C5 . . . B4 . . .
            A4 . . . G#4 . . . A4 . . . . . . .`),
    harm:T(`. . . . A3 . . . . . . . A3 . . .
            . . . . G#3 . . . . . . . G#3 . . .

/* ==========================================================
   ESCALA DE MATERIALES
   Cada mejora comprada sube un peldano y se ve: el arma y la
   armadura cambian de material, no solo de numero en el marcador.
   Cinco peldanos = cuatro compras de cada cosa.
   ========================================================== */
const MATERIALES=['bronce','plata','oro','platino','diamante'];
const NOM_MATERIAL={bronce:'BRONCE',plata:'PLATA',oro:'ORO',platino:'PLATINO',diamante:'DIAMANTE'};
/* Siglas de dos letras para el marcador: PL y PT no se confunden */
const SIGLA_MATERIAL={bronce:'BR',plata:'PL',oro:'OR',platino:'PT',diamante:'DI'};
const MEJORA_MAX=MATERIALES.length-1;
const nivelMat=n=>Math.max(0,Math.min(MEJORA_MAX,n||0));
const rampaArma     =()=>RAMPA[MATERIALES[nivelMat(G.mejoras)]];
const rampaArmadura =()=>RAMPA[MATERIALES[nivelMat(G.armor)]];
const nombreMat     =n=>NOM_MATERIAL[MATERIALES[nivelMat(n)]];
const proxMat       =n=>NOM_MATERIAL[MATERIALES[nivelMat((n||0)+1)]];
const siglaMat      =n=>SIGLA_MATERIAL[MATERIALES[nivelMat(n)]];

const ORDEN_PJ=['hombre','mujer','rubia','castana'];
const ORDEN_ROL=['caballero','arquero','mago'];

function paleta(){
  const a=PJS[G.pj]||PJS.hombre, r=ROLES[G.rol]||ROLES.caballero;
  return {A:PAL[a.pelo],B:PAL[a.piel],C:PAL[r.ropa],D:PAL[r.cinto],
          x:sombraDe(a.pelo), z:sombraDe(a.piel), y:sombraDe(r.ropa)};
}
function drawHeroe(spr,x,y,flip,esc){
  esc=esc||1;
  const a=PJS[G.pj]||PJS.hombre, r=ROLES[G.rol]||ROLES.caballero, mapa=paleta();
  const px=(cx,cy,c,w,h)=>{ctx.fillStyle=(typeof c==='string'&&c[0]==='#')?c:PAL[c];
    ctx.fillRect(Math.round(x+(flip?11-cx-(w||1)+1:cx)*esc),Math.round(y+cy*esc),(w||1)*esc,(h||1)*esc);};
  if(a.melena){
    for(let j=1;j<10;j++){px(2,j,PAL[a.pelo]);px(9,j,sombraDe(a.pelo));}
    px(2,10,PAL[a.pelo]);px(9,10,sombraDe(a.pelo));
  }
  if(a.coletas){px(1,1,PAL[a.pelo],2,4);px(10,1,sombraDe(a.pelo),2,4);
    px(1,5,'k',2,1);px(10,5,'k',2,1);}
  const w=spr[0].length;
  for(let j=0;j<spr.length;j++)for(let i=0;i<w;i++){
    let c=spr[j][i]; if(!c||c==='.')continue;
    let col;
    if(c==='k')col=PAL.k; else if(c==='W')col=PAL.W;
    else if(mapa[c])col=mapa[c]; else col=PAL[c];
    if(!col)continue;
    // sombreado: el ultimo pixel de cada fila y la mitad inferior se oscurecen
    const borde=(i===w-1)||(spr[j][i+1]==='.'&&i>w/2);
    if(borde&&c!=='k'&&c!=='W'){
      if(c==='A')col=mapa.x; else if(c==='B')col=mapa.z; else if(c==='C')col=mapa.y;
    }
    ctx.fillStyle=col;
    ctx.fillRect(Math.round(x+(flip?w-1-i:i)*esc),Math.round(y+j*esc),esc,esc);
  }
  if(a.falda){
    for(let i=2;i<10;i++)px(i,11,PAL[r.ropa]);
    for(let i=1;i<11;i++)px(i,12,i>6?sombraDe(r.ropa):PAL[r.ropa]);
    px(1,13,'k');px(10,13,'k');
  }
  /* La armadura comprada se ve: cada peldano cambia el material y anade
     una pieza. El yelmo del caballero usa la misma rampa que el resto. */
  const AR=rampaArmadura();
  if(G.rol==='caballero'){
    px(3,1,AR[3],6,1);px(4,2,AR[2],1,2);px(7,2,AR[1],1,2);
  }
  if((G.armor||0)>0){
    px(2,7,AR[2],2,1); px(9,7,AR[1],2,1);            // hombreras
    if(G.armor>=2){px(4,8,AR[3],4,1);}               // peto
    if(G.armor>=3){px(3,9,AR[2],1,1);px(8,9,AR[1],1,1);}  // faldar
    if(G.armor>=4&&(G.tick>>3)%2){px(5,8,AR[3],2,1);}     // el diamante centellea
  }
  if(G.rol==='mago'){
    px(3,0,PAL[r.ropa],6,1);px(2,1,PAL[r.ropa],5,1);px(7,1,sombraDe(r.ropa),3,1);
    px(5,-3,PAL[r.ropa],2,4);
  }
}

/* draw() no escala: su quinto parametro es la OPACIDAD. Para los creditos
   hace falta agrandar sprites, asi que va aparte. */
function drawEsc(spr,x,y,flip,esc){
  ctx.save();ctx.translate(x,y);ctx.scale(esc,esc);
  draw(spr,0,0,flip);ctx.restore();
}
function draw(spr,x,y,flip,alpha){
  x=Math.round(x);y=Math.round(y);
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  const w=spr[0].length;
  for(let j=0;j<spr.length;j++){const row=spr[j];
    for(let i=0;i<w;i++){const c=row[i];if(!c||c==='.')continue;
      const col=PAL[c];if(!col)continue;ctx.fillStyle=col;
      ctx.fillRect(x+(flip?w-1-i:i),y+j,1,1);}}
  ctx.globalAlpha=1;
}

/* ==========================================================
   RNG SEMILLA
   ========================================================== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RND=mulberry(1);
const ri=(a,b)=>a+Math.floor(RND()*(b-a+1));
const pick=arr=>arr[Math.floor(RND()*arr.length)];

/* ==========================================================
   ESTRUCTURA DEL MUNDO
   Niveles: exterior -> p0..p6 -> torre ; sotanos s1,s2,s3
   ========================================================== */
const LEVELS={
  exterior:{name:'CEMENTERIO DE RAVENMOOR',rooms:5,theme:'noche',depth:0},
  p0:{name:'PLANTA BAJA',rooms:7,theme:'piedra',depth:1},
  p1:{name:'PRIMERA PLANTA',rooms:7,theme:'piedra',depth:2},
  p2:{name:'SEGUNDA PLANTA',rooms:7,theme:'salon',depth:3},
  p3:{name:'TERCERA PLANTA',rooms:7,theme:'salon',depth:4},
  p4:{name:'CUARTA PLANTA',rooms:7,theme:'biblio',depth:5},
  p5:{name:'QUINTA PLANTA',rooms:7,theme:'biblio',depth:6},
  p6:{name:'SEXTA PLANTA',rooms:7,theme:'torreon',depth:7},
  /* La azotea: al aire libre, en plena tormenta, y sin minijefe. Es la
     antesala del Brujo, asi que la tension la ponen el escenario y los
     rayos, no otra pelea de jefe antes de la de verdad. */
  p7:{name:'LA AZOTEA',rooms:7,theme:'azotea',depth:8},
  torre:{name:'LA TORRE DEL BRUJO',rooms:1,theme:'cielo',depth:9},
  s1:{name:'LA CRIPTA',rooms:7,theme:'cripta',depth:-1},
  s2:{name:'LAS CATACUMBAS',rooms:7,theme:'cripta',depth:-2},
  s3:{name:'LA CUEVA',rooms:7,theme:'cueva',depth:-3}
};
// conexiones verticales: [nivel, tipo, destino]
const UPLINK={p0:['escalera','p1'],p1:['puerta','p2'],p2:['escalera','p3'],
  p3:['puerta','p4'],p4:['escalera','p5'],p5:['puerta','p6'],
  p6:['escalera','p7'],p7:['escalera','torre']};
const DOWNLINK={p0:['puerta','s1'],s1:['puerta','s2'],s2:['puerta','s3']};
// enlaces de regreso: se sube por la primera sala de cada sotano
const REGRESO={s1:'p0',s2:'s1',s3:'s2'};
const ORDER=['exterior','p0','p1','p2','p3','p4','p5','p6','p7','torre'];

const rooms={}; // cache "nivel:indice"
function roomKey(l,i){return l+':'+i;}
/* Clave de la sala en curso: las camaras ocultas llevan prefijo propio
   para que su botin y sus enemigos se recuerden por separado */
function claveSala(){return (G.room&&G.room.secreta?'S:':'')+G.lv+':'+G.idx;}

/* ---------- generacion procedural con paso garantizado ---------- */
function genRoom(lv,idx){
  const key=roomKey(lv,idx);
  if(rooms[key])return rooms[key];
  const L=LEVELS[lv];
  RND=mulberry(hash(lv)*7919+idx*104729+G.seed);
  const m=[];for(let y=0;y<ROWS;y++)m.push(Array(COLS).fill('.'));
  const set=(x,y,c)=>{if(x>0&&x<COLS-1&&y>0&&y<ROWS-1)m[y][x]=c;};
  // bordes
  for(let x=0;x<COLS;x++){m[0][x]='#';m[ROWS-1][x]='#';}
  for(let y=0;y<ROWS;y++){m[y][0]='#';m[y][COLS-1]='#';}
  const last=L.rooms-1, first=idx===0;
  /* La columna del conector vertical se escribe al final y arrasa con lo
     que encuentre: la escalera de regreso rellena de 'H' de arriba abajo
     y el enlace de subida despeja la columna entera. Se reserva ahora
     para que nadie coloque nada ahi (invariante 6). */
  const colConector = ((first&&REGRESO[lv])||(idx===last&&UPLINK[lv])) ? COLS-4 : -1;
  const enemies=[], deco=[];
  let manual=false, cementerio=false;

  if(lv==='torre'){
    for(let x=3;x<8;x++)m[ROWS-3][x]='=';
    for(let x=12;x<17;x++)m[ROWS-3][x]='=';
    m[1][1]='!';m[1][18]='!';
    garantizarAlcance(m);limpiarEscaleras(m);
    rooms[key]={m,enemies:[],deco:[],lv,idx,boss:true,name:L.name};
    return rooms[key];
  }

  /* ==========================================================
     INTENCION DE LA SALA
     Se decide antes de colocar un bloque, y la geometria se
     deriva de ella. Sin intencion, las alturas no significan nada.
     ========================================================== */
  const intencion=elegirIntencion(lv,idx,last);
  rooms[key+'_int']=intencion;

  /* --- suelo con fosos saltables ---
     Las salas de minijefe van con el suelo entero: los jefes no
     comprueban el terreno al embestir, al reaparecer ni al retroceder,
     y acababan cayendose o apareciendo dentro del foso. La unica
     excepcion es la Sirena Reina, que necesita su agua para emerger. */
  const salaJefe = !!(MINIJEFES[lv] && idx===last);
  const sinFosos = salaJefe && lv!=='s3';
  const gy=ROWS-2;
  let x=2;
  const densidadFoso=intencion==='atajo'?.42:(intencion==='transito'?.12:.24);
  while(x<COLS-3 && !sinFosos){
    if(RND()<densidadFoso && x>3 && x<COLS-5){
      const w=ri(1,2);
      for(let i=0;i<w;i++) m[ROWS-1][x+i]= (L.theme==='cueva'||L.theme==='cripta')?'~':'^';
      x+=w+ri(2,3);
    } else x+=ri(2,4);
  }

  /* --- plataformas segun la intencion --- */
  const cadenas=[];
  const nCadenas = intencion==='transito'?0
                 : ((intencion==='tesoro'||intencion==='antecamara')?1 : ri(1,2));
  /* Registro de lo ya colocado: dos cadenas independientes no deben cruzarse
     ni quedar una justo encima de otra, o no habria por donde subir. */
  const ocupa=(f,c1,c2)=>{
    for(const cad of cadenas)for(const p of cad){
      if(Math.abs(p.fila-f)>2)continue;
      if(!(c2 < p.col-1 || c1 > p.col+p.ancho))return true;
    }
    return false;
  };
  for(let c=0;c<nCadenas;c++){
    let fila=8, col=(intencion==='tesoro')?ri(3,COLS-9):ri(2,COLS-8);
    if(c>0){ // buscar un arranque despejado para la segunda cadena
      let libre=false;
      for(let intento=0;intento<10&&!libre;intento++){
        col=ri(2,COLS-8);
        if(!ocupa(fila,col,col+4))libre=true;
      }
      if(!libre)break;
    }
    const alto = intencion==='tesoro'?ri(2,3)
               : (intencion==='antecamara'?ri(2,3)
               : (intencion==='atajo'?1 : ri(1,2)));
    const cadena=[]; let anchoProx=0;
    for(let p=0;p<alto&&fila>=3;p++){
      const ancho = (intencion==='atajo'&&p===0) ? ri(6,9) : (anchoProx||ri(3,5));
      if(c>0&&ocupa(fila,col,col+ancho-1))break;   // chocaria con la otra cadena
      for(let j=0;j<ancho;j++) set(col+j,fila,'=');
      cadena.push({fila,col,ancho});
      /* El siguiente escalon sube 2 filas y se corre a un lado: debe quedar
         al costado, no encima, o seria imposible subirse a el. La separacion
         entre los bordes se mantiene entre -1 y 2 casillas. */
      fila-=2;
      const anchoSig=ri(3,5);
      let dir = (col<4) ? 1 : (col+ancho>COLS-5 ? -1 : (RND()<.5?-1:1));
      const sep=ri(-1,2);
      // la separacion entre bordes ha de ser exactamente 'sep':
      // el borde derecho del de abajo es col+ancho-1
      let nuevoCol = dir>0 ? (col+ancho-1+sep) : (col-anchoSig+1-sep);
      if(nuevoCol<2){nuevoCol=col+ancho-1+sep;}
      if(nuevoCol+anchoSig>COLS-2){nuevoCol=col-anchoSig+1-sep;}
      col=Math.max(2,Math.min(COLS-2-anchoSig,nuevoCol));
      anchoProx=anchoSig;
    }
    if(cadena.length)cadenas.push(cadena);
  }

  /* --- la recompensa, en la cima de la cadena mas alta --- */
  const cima=cadenas.map(c=>c[c.length-1]).sort((a,b)=>a.fila-b.fila)[0];
  const esSalaLlave = !!(G.cerrojos&&G.cerrojos[lv]&&idx===salaDeLaLlave(lv)&&idx!==last);
  if(cima && intencion!=='transito' && intencion!=='atajo'){
    const cx=cima.col+Math.floor(cima.ancho/2);
    if(esSalaLlave)              set(cx,cima.fila-1,'K');   // la llave manda
    else if(intencion==='tesoro')      set(cx,cima.fila-1,'$$');
    else if(intencion==='santuario') set(cx,cima.fila-1,'C');
    else if(intencion==='emboscada') set(cx,cima.fila-1,'$');
  }
  /* --- la antecamara esconde un pasadizo, telegrafiado con una
         antorcha apagada donde todas las demas arden --- */
  if(intencion==='antecamara'){
    let px=-1,py=-1;
    if(cima){
      px=cima.col+Math.floor(cima.ancho/2); py=cima.fila-1;
      // si cae en la columna del conector, se corre por la misma plataforma
      if(px===colConector){
        if(cima.col<colConector) px=colConector-1;
        else if(cima.col+cima.ancho-1>colConector) px=colConector+1;
        else px=-1;                                  // no cabe: se busca nicho
      }
      const base=cadenas[0][0];
      if(base)set(base.col+1,base.fila-1,'$');   // moneda al pie: invita a subir
    }
    if(px<0){
      // sin sitio en la cima: el pasadizo se abre en un nicho del muro alto
      for(let intento=0;intento<20&&px<0;intento++){
        const cx=ri(3,COLS-4), cy=ri(3,6);
        if(cx===colConector)continue;
        if(m[cy][cx]==='.'&&m[cy+1][cx]==='.'){px=cx;py=cy;}
      }
      if(px>=0){
        // repisa para poder posarse delante del hueco
        for(let j=-1;j<=1;j++)if(px+j!==colConector)set(px+j,py+1,'=');
      }
    }
    if(px>=0){
      set(px,py,'X');
      // la antorcha apagada delata el hueco: nunca en la columna reservada
      if(px-2>1&&px-2!==colConector)set(px-2,py,'i');
      else if(px+2<COLS-1&&px+2!==colConector)set(px+2,py,'i');
    }
  }
  /* --- el atajo elevado premia con monedas repartidas --- */
  if(intencion==='atajo'&&cadenas.length){
    const c=cadenas[0][0];
    for(let j=1;j<c.ancho;j+=3) set(c.col+j,c.fila-1,'$');
  }
  /* --- puesto ambulante de Nora: como mucho uno por planta,
         y no en todas las plantas --- */
  const plantaConPuesto = hash('nora'+lv+G.seed)%100 < 55;      // poco mas de la mitad
  const salaDelPuesto   = hash('puesto'+lv+G.seed)%Math.max(1,last);
  if(L.depth>0 && lv!=='torre' && idx<last && plantaConPuesto && idx===salaDelPuesto){
    const p=(()=>{for(let i=0;i<14;i++){
      const cx=ri(3,COLS-5), fy=findFloorY(m,cx);
      if(fy<ROWS&&(m[fy][cx]==='#')&&m[fy-1][cx]==='.'&&m[fy-1][cx+1]==='.')return {x:cx,y:fy-1};
    }return null;})();
    if(p){ m[p.y][p.x]='N'; enemies.length=Math.max(0,enemies.length-2); }
  }
  /* --- atrezo propio de cada zona ---
     Cada pieza declara su tamano y reserva sus casillas: sin esto
     las piezas se montaban unas sobre otras. --- */
  const reservado=new Set();
  const clave=(cx,cy)=>cx+','+cy;
  const libreZona=(cx,cy,an,al)=>{
    for(let i=0;i<an;i++)for(let j=0;j<al;j++){
      const px=cx+i, py=cy-j;
      if(px<1||px>COLS-2||py<1||py>ROWS-2)return false;
      if(m[py][px]!=='.')return false;
      if(reservado.has(clave(px,py)))return false;
    }
    return true;
  };
  const reservar=(cx,cy,an,al)=>{
    for(let i=0;i<an;i++)for(let j=0;j<al;j++)reservado.add(clave(cx+i,cy-j));
  };
  const pon=(tipo,n)=>{
    const {an,al}=ATREZO[tipo]||{an:1,al:1};
    for(let k=0;k<n;k++){
      let puesto=false;
      for(let intento=0;intento<16&&!puesto;intento++){
        const cx=ri(2,COLS-2-an), fy=findFloorY(m,cx);
        if(fy>=ROWS)continue;
        const bajo=m[fy][cx];
        if(bajo!=='#'&&bajo!=='=')continue;
        // el suelo debe ser firme bajo toda la pieza
        let apoyo=true;
        for(let i=0;i<an;i++){const c=m[fy][cx+i];if(c!=='#'&&c!=='=')apoyo=false;}
        if(!apoyo)continue;
        if(!libreZona(cx,fy-1,an,al))continue;
        reservar(cx,fy-1,an,al);
        deco.push([tipo,cx,fy-1]);
        puesto=true;
      }
    }
  };
  const pared=(tipo,n,alturaMin,alturaMax)=>{
    const {an,al}=ATREZO[tipo]||{an:1,al:1};
    for(let k=0;k<n;k++){
      for(let intento=0;intento<16;intento++){
        const cx=ri(2,COLS-2-an), cy=ri(alturaMin,alturaMax);
        // para el atrezo colgante la zona crece hacia abajo
        let hueco=true;
        for(let i=0;i<an;i++)for(let j=0;j<al;j++){
          const px=cx+i, py=cy+j;
          if(px<1||px>COLS-2||py<1||py>ROWS-2)hueco=false;
          else if(m[py][px]!=='.'||reservado.has(clave(px,py)))hueco=false;
        }
        if(!hueco)continue;
        for(let i=0;i<an;i++)for(let j=0;j<al;j++)reservado.add(clave(cx+i,cy+j));
        deco.push([tipo,cx,cy]);
        break;
      }
    }
  };
  /* El decorado del cementerio NO va aqui: la bandera 'cementerio' se asigna
     mas abajo y ademas el exterior vacia 'deco' despues, asi que este bloque
     estaba muerto y no salia ni una lapida. Se coloca tras marcarla. */
  if(L.theme==='piedra'){ pon('barril',ri(1,3)); pon('caja',ri(0,2)); pared('tapiz',ri(0,2),2,4); }
  else if(L.theme==='salon'){ pared('tapiz',ri(1,3),2,4); pon('armadura',ri(1,2));
    if(RND()<.6)pared('arana',1,1,2); pared('estandarte',ri(0,2),1,3); }
  else if(L.theme==='biblio'){ pon('libreria',ri(2,3)); if(RND()<.5)pared('arana',1,1,2);
    pon('caja',ri(0,2)); }
  else if(L.theme==='torreon'){ pon('barril',ri(0,2)); pared('estandarte',ri(1,2),1,3);
    pon('armadura',ri(0,1)); }
  else if(L.theme==='cripta'){ pon('sarcofago',ri(1,2)); pon('huesos',ri(1,3));
    pared('telarana',ri(2,4),1,4); pon('columna',ri(1,2)); pon('saco',ri(0,1)); }
  else if(L.theme==='cueva'){ pon('cristal',ri(1,3)); pared('raiz',ri(1,3),1,3);
    pon('seta',ri(1,3)); pared('veta',ri(1,3),2,6); pon('puntal',ri(0,2));
    pared('telarana',ri(0,2),1,3); pon('caja',ri(0,1)); }
  else if(L.theme==='cielo'){ pared('gargola',ri(1,3),2,4); }
  /* --- botin suelto, mucho menos que antes: lo de valor esta arriba --- */
  if(intencion==='transito'&&RND()<.4){const cx=ri(3,COLS-4);set(cx,findFloorY(m,cx)-1,'$');}

  /* --- Sin escaleras decorativas: una escalera debe llevar a algun sitio.
         Las unicas que se generan son las que anade la reparacion de
         alcance (pegadas a una plataforma) y las de los conectores. --- */
  /* --- antorchas / decorado --- */
  for(let i=0;i<ri(1,3);i++){const tx=ri(2,COLS-3);if(m[2][tx]==='.')m[2][tx]='!';}

  /* --- la cueva tiene lagunas con sirenas: agua ancha salvada por
         plataformas, y sirenas que cantan notas en diagonal --- */
  if(L.theme==='cueva'&&idx<last){
    const lagunas=ri(1,2);
    for(let n=0;n<lagunas;n++){
      const ancho=ri(3,5), ini=ri(3,COLS-4-ancho);
      const fin=ini+ancho;
      for(let xx=ini;xx<fin;xx++)m[ROWS-1][xx]='~';
      // pasarela continua: arranca y termina en tierra firme, a un salto del suelo
      for(let xx=ini-1;xx<=fin;xx++)
        if(xx>0&&xx<COLS-1)m[ROWS-3][xx]='=';
      // una sirena por laguna, asomando entre el agua y la pasarela
      enemies.push(['sirena',Math.min(COLS-3,ini+((ancho/2)|0)),ROWS-2,3]);
    }
  }
  /* --- botin menor: solo en casillas libres, para no pisar
         la recompensa de la intencion ni el pasadizo --- */
  const libre=(cx,cy)=>cy>0&&cy<ROWS-1&&m[cy][cx]==='.';
  if(RND()<.30){const cx=ri(3,COLS-4),cy=findFloorY(m,cx)-1;if(libre(cx,cy))m[cy][cx]='$';}
  if(RND()<.14){const cx=ri(3,COLS-4),cy=findFloorY(m,cx)-1;if(libre(cx,cy))m[cy][cx]='C';}

  /* --- enemigos --- */
  // cada zona tiene su fauna propia
  const POOL={
    noche:  ['vampiro','zombi','zombi','bat'],
    piedra: ['rat','bat','armadura','armadura'],
    salon:  ['rat','skel','armadura','armadura','bat'],
    biblio: ['mago_e','mago_e','bat','skel'],
    torreon:['diablillo','diablillo','ghost','skel'],
    cripta: ['skel','arquero_e','ghost','spider','arquero_e'],
    cueva:  ['skel','spider','sirena'],
    azotea: ['nazgul','dementor','nazgul','dementor'],
    cielo:  ['diablillo']
  };
  const pool = POOL[L.theme] || ['rat','bat'];
  let n=Math.min(4,1+Math.floor(Math.abs(L.depth)/2)+ri(0,1));
  /* La cripta y las catacumbas salian casi vacias: con la formula general la
     primera planta de sotano se quedaba en uno o dos bichos por sala. */
  if(L.theme==='cripta')n=ri(3,5);
  // En la cueva las sirenas mandan: como mucho un tipo mas y pocos ejemplares
  let poolSala=pool;
  if(L.theme==='cueva'){
    poolSala=[pick(pool.filter(t=>t!=='sirena'))];
    n=ri(1,2);
  }
  for(let i=0;i<n;i++){
    const t=pick(poolSala), ex=ri(3,COLS-4);
    let ey;
    if(t==='bat'){
      // a la altura de paso y sobre el corredor: donde de verdad estorban
      ey=ri(ROWS-5,ROWS-3);
    } else if(t==='dementor'){
      ey=ri(1,2);          // los dementores bajan desde lo alto de la pantalla
    } else if(t==='ghost'||t==='diablillo'||t==='mago_e') ey=ri(4,7);
    else ey=findFloorY(m,ex)-1;
    enemies.push([t,ex,ey,ri(3,6)]);
  }
  /* --- la sala del conector se despeja: el duelo es contra el minijefe --- */
  if(MINIJEFES[lv] && idx===last && lv!=='torre') enemies.length=0;

  /* --- la emboscada pone un guardian junto al premio --- */
  if(intencion==='emboscada'&&cima){
    const gx=Math.max(2,Math.min(COLS-3,cima.col+1));
    enemies.push([pick(poolSala),gx,cima.fila-1,2]);
  }

  /* --- escalera de regreso hacia la planta superior --- */
  if(idx===0 && REGRESO[lv]){
    const cx=COLS-4;
    for(let y=1;y<ROWS-1;y++)m[y][cx]='H';
    m[0][cx]='H';
    deco.push(['salida',cx,1]);
  }
  /* --- conectores verticales en la ultima sala --- */
  if(idx===last && UPLINK[lv]){
    const [tipo]=UPLINK[lv]; const cx=COLS-4;
    for(let y=1;y<ROWS-1;y++) m[y][cx]='.';
    if(tipo==='escalera'){for(let y=1;y<ROWS-1;y++)m[y][cx]='H'; m[0][cx]='H';}
    else { // vano de 2x2 casillas para la puerta de mazmorra
      m[ROWS-2][cx]='M'; m[ROWS-2][cx-1]='M';
      m[ROWS-3][cx]='M'; m[ROWS-3][cx-1]='M';
      m[0][cx]='.';m[0][cx-1]='.';
    }
    // si la planta esta cerrada, una verja corta el paso al conector
    if(G.cerrojos&&G.cerrojos[lv]){
      for(let y=ROWS-4;y<ROWS-1;y++){m[y][cx-2]='D';}
      deco.push(['cerradura',cx-2,ROWS-4]);
    }
  }
  /* --- la llave de la planta, en una sala anterior y siempre en alto --- */
  // red de seguridad: si la sala de la llave no llego a tener cima, se pone a ras de suelo
  if(esSalaLlave && !cima){
    const cx=ri(4,COLS-5); set(cx,findFloorY(m,cx)-1,'K');
  }
  if(idx===last && DOWNLINK[lv]){
    // Siempre una puerta con escalones, nunca un agujero en el suelo:
    // los agujeros se tragaban a los jefes y quedaban fuera de alcance.
    const cx=3;
    for(let y=ROWS-4;y<ROWS-1;y++){m[y][cx]='.';m[y][cx+1]='.';}
    m[ROWS-2][cx]='m';m[ROWS-2][cx+1]='m';
    m[ROWS-3][cx]='m';m[ROWS-3][cx+1]='m';
    m[ROWS-1][cx]='#';m[ROWS-1][cx+1]='#';   // el suelo queda firme
  }
  /* --- tienda en la cueva --- */
  if(lv==='s3'&&idx===last){
    for(let xx=COLS-8;xx<COLS-2;xx++)m[ROWS-1][xx]='#';
    m[ROWS-2][COLS-5]='T';
    enemies.length=0;
    /* ATAJO: puerta que devuelve directo a la sala del ogro. Bajar hasta la
       tienda ya cuesta lo suyo; obligar ademas a deshacer tres sotanos solo
       hacia perder el tiempo. Deshacer el camino sigue siendo posible por
       las salidas de siempre, para recoger lo que quedara atras. */
    const ax=3;
    for(let y=ROWS-4;y<ROWS-1;y++){m[y][ax]='.';m[y][ax+1]='.';}
    m[ROWS-2][ax]='A';m[ROWS-2][ax+1]='A';
    m[ROWS-3][ax]='A';m[ROWS-3][ax+1]='A';
    m[ROWS-1][ax]='#';m[ROWS-1][ax+1]='#';
    deco.push(['salida',ax,ROWS-4]);
  }
  /* --- azotea: sin techo, a la intemperie, con almenas en vez de muro --- */
  if(lv==='p7'){
    for(let xx=0;xx<COLS;xx++) m[0][xx]='.';
    for(let y=1;y<4;y++)for(let xx=1;xx<COLS-1;xx++) if(m[y][xx]==='#'||m[y][xx]==='!')m[y][xx]='.';
    /* Un pretil bajo a los lados, para que se lea que estas en lo alto y
       no se pueda uno caer por el borde de la pantalla. */
    m[ROWS-2][0]='#'; m[ROWS-2][COLS-1]='#';
    /* TODAS las salas llevan plataformas y fosos con pinchos: en la azotea
       hay que ir por lo alto, con el vacio debajo. Se colocan aqui, despues
       de la generacion normal, y el saneado posterior recorta los fosos a
       dos casillas y deja firmes las entradas laterales. */
    {
      // los pinchos primero, para que las plataformas sepan lo que hay debajo
      for(let k=0;k<2;k++){
        const c0=ri(5,COLS-8);
        for(let x=c0;x<c0+2;x++) if(m[ROWS-1][x]==='#') m[ROWS-1][x]='^';
      }
      const hueco=(fila,c0,an)=>{
        for(let x=c0-1;x<=c0+an;x++)
          if(x<1||x>COLS-2||m[fila][x]!=='.'||m[fila-1][x]!=='.')return false;
        /* Y para las bajas, que haya suelo firme debajo desde donde saltar:
           una plataforma colgada sobre el foso no se alcanza. */
        if(fila===ROWS-4){
          let firme=false;
          for(let x=c0-1;x<=c0+an;x++)
            if(x>0&&x<COLS-1&&m[ROWS-1][x]==='#')firme=true;
          if(!firme)return false;
        }
        return true;
      };
      const pone=(fila,c0,an)=>{ for(let x=c0;x<c0+an;x++)m[fila][x]='='; };
      /* Primero las bajas, alcanzables de un salto desde el suelo. La alta
         SOLO se coloca escalonada junto a una baja: suelta en mitad del aire
         dejaba salas sin forma de llegar arriba. */
      const bajas=[];
      /* Se insiste mas veces en vez de ampliar el plan B: buscar sitio con
         mas intentos es seguro, mientras que relajar las condiciones del
         plan B dejaba plataformas inalcanzables. */
      const quiero=ri(2,3);
      for(let intento=0;intento<14&&bajas.length<quiero;intento++){
        const an=ri(3,4), c0=ri(3,COLS-4-an);
        if(!hueco(ROWS-4,c0,an))continue;
        pone(ROWS-4,c0,an); bajas.push({c0,an});
      }
      /* Plan B: si el azar no encontro sitio, se barre la fila entera en
         busca del primer hueco. Sin esto una de cada treinta salas se
         quedaba a ras de suelo, y aqui la gracia es ir por lo alto. */
      if(!bajas.length){
        // se prueban dos alturas y dos anchos antes de rendirse
        buscar:
        for(const fila of [ROWS-4])   // ROWS-5 queda a tres casillas del suelo: inalcanzable
          for(const an of [3])
            for(let c0=3;c0<=COLS-4-an;c0++){
              if(!hueco(fila,c0,an))continue;
              pone(fila,c0,an); bajas.push({c0,an}); break buscar;
            }
      }
      /* Se quitaron las plataformas de la fila alta: la sala ya trae sus
         propias escaleras y cadenas, y encadenarlas a mano dejaba 3 salas de
         11.620 con un rincon inalcanzable. No compensa. */
    }
    /* El conector a la Torre se coloca ANTES que este bloque, y al abrir el
       cielo se le borraba la fila de arriba: la ultima sala quedaba sin
       salida y el jefe final era inalcanzable. Se repone aqui. */
    if(idx===last&&UPLINK[lv]){
      const cx=COLS-4;
      for(let y=1;y<ROWS-1;y++)m[y][cx]='H';
      m[0][cx]='H';
      m[ROWS-1][cx]='#';           // y suelo firme al pie de la escalera
    }
    pon('gargola',ri(0,2));
  }
  /* --- exterior: no hay techo, hay lapidas y verja --- */
  if(lv==='exterior'){
    for(let xx=0;xx<COLS;xx++) m[0][xx]='.';
    for(let y=1;y<5;y++)for(let xx=1;xx<COLS-1;xx++) if(m[y][xx]==='#'||m[y][xx]==='!')m[y][xx]='.';
    deco.length=0; enemies.length=0;
    cementerio=true;
    // ahora si: el decorado se coloca DESPUES de vaciar deco
    pon('tumba',ri(5,8)); pon('arbol',ri(1,3));
    if(RND()<.45)pon('mausoleo',1);
    if(RND()<.5)pon('verja',1);
    pon('huesos',ri(0,2));
    const en=ri(2,3);
    for(let i=0;i<en;i++){
      const t=pick(['vampiro','zombi','zombi','bat']);
      const ey=(t==='bat')?ri(3,6):ROWS-3;
      enemies.push([t,ri(4,COLS-4),ey,ri(3,6)]);
    }
    if(idx===last){ // el foso, el puente levadizo y el porton, a la derecha
      for(let y=1;y<ROWS-1;y++)m[y][COLS-2]='.';
      for(let xx=1;xx<COLS-1;xx++) m[ROWS-1][xx]='#';
      // el foso rodea el castillo: justo delante de la puerta
      for(let xx=11;xx<15;xx++) m[ROWS-1][xx]='~';
      // tablero del puente, salvando el foso y apoyado en ambas orillas
      for(let xx=10;xx<16;xx++) m[ROWS-2][xx]='P';
      deco.push(['puente',10,ROWS-2]);
      deco.push(['porton',COLS-4,ROWS-2]);   // apoyado en el suelo, al fondo
      enemies.length=0;
      // conserva lapidas al otro lado del foso: seguimos en el cementerio
      manual=true;
    }
  }
  /* --- aberturas laterales entre salas --- */
  if(idx>0) for(let y=ROWS-4;y<ROWS-1;y++)m[y][0]='.';
  if(idx<last) for(let y=ROWS-4;y<ROWS-1;y++)m[y][COLS-1]='.';
  if(lv==='exterior'&&idx===last) for(let y=ROWS-4;y<ROWS-1;y++)m[y][COLS-1]='.';

  /* ==========================================================
     GARANTIA DE TRAVESIA Y DE ALCANCE
     ========================================================== */
  garantizarPaso(m,lv,idx,last,manual);

  /* --- limpieza final: las escaleras y remates se anaden despues del
         atrezo, asi que se retira toda pieza que haya quedado invadida --- */
  const decoLimpio=deco.filter(([t,cx,cy])=>{
    const info=ATREZO[t]; if(!info)return true;
    for(let a=0;a<info.an;a++)for(let bq=0;bq<info.al;bq++){
      const px=cx+a, py=info.ancla==='suelo'?cy-bq:cy+bq;
      if(px<1||px>COLS-2||py<0||py>ROWS-2)return false;
      if(m[py][px]!=='.')return false;
    }
    return true;
  });
  deco.length=0; decoLimpio.forEach(d=>deco.push(d));

  /* Red de seguridad: una antorcha apagada promete un pasadizo. Si por lo
     que sea no llego a colocarse, se apaga la promesa en vez de dejar al
     jugador buscando un hueco que no existe. */
  {
    let hayX=false;
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(m[y][x]==='X')hayX=true;
    if(!hayX)for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(m[y][x]==='i')m[y][x]='.';
  }

  /* La sala del Vampiro Mayor debe cumplir el mismo invariante que las demas
     salas de jefe: suelo continuo, sin fosos ni pinchos. Va AQUI, al final,
     porque el terreno del exterior se genera despues y lo sobrescribia. */
  if(lv==='exterior'&&idx===last&&MINIJEFES[lv]){
    for(let xx=0;xx<COLS;xx++){
      m[ROWS-1][xx]='#';
      let habiaPuente=false;
      for(let y=ROWS-5;y<ROWS-1;y++){
        /* Los tablones elevados del puente formaban un escalon en mitad de
           la arena. Se bajan al nivel del suelo: la casilla de abajo pasa a
           dibujarse como puente con agua, sin dejar de ser suelo firme. */
        if(m[y][xx]==='P'){habiaPuente=true;m[y][xx]='.';}
        else if(m[y][xx]==='~'||m[y][xx]==='^')m[y][xx]='.';
      }
      if(habiaPuente)m[ROWS-1][xx]='B';
    }
    // y su decorado, que ya no tiene sobre que apoyarse
    for(let i=deco.length-1;i>=0;i--)
      if(deco[i][0]==='puente')deco.splice(i,1);
  }

  rooms[key]={m,enemies,deco,lv,idx,intencion,name:L.name+' '+(idx+1)+'/'+L.rooms};
  return rooms[key];
}

function garantizarPaso(m,lv,idx,last,manual){
  const suelo=ROWS-1, corr=[ROWS-2];   // una sola fila reservada: cabe el heroe de pie
  if(!manual){
    // 1. despejar el corredor de bloques solidos (escaleras y objetos se respetan)
    for(const y of corr)
      for(let x=1;x<COLS-1;x++)
        if(m[y][x]==='#'||m[y][x]==='=') m[y][x]='.';
    // 2. recortar fosos: ninguna serie de casillas peligrosas mayor de 2
    let run=0;
    for(let x=1;x<COLS-1;x++){
      const c=m[suelo][x];
      if(c==='^'||c==='~'){ run++; if(run>2){ m[suelo][x]='#'; run=0; } } else run=0;
    }
    // 3. las casillas junto a los accesos laterales siempre firmes
    for(const x of [1,2,COLS-3,COLS-2]) if(m[suelo][x]!=='#') m[suelo][x]='#';
    // 4. no dejar plataformas justo encima de un foso estrecho: taparian el
    //    salto. Las lagunas anchas si llevan pasarela, que es su unico paso.
    for(let x=1;x<COLS-1;x++){
      const c=m[suelo][x];
      if(c!=='^'&&c!=='~')continue;
      let ancho=1;
      for(let d=1;x+d<COLS-1&&(m[suelo][x+d]==='^'||m[suelo][x+d]==='~');d++)ancho++;
      for(let d=1;x-d>0&&(m[suelo][x-d]==='^'||m[suelo][x-d]==='~');d++)ancho++;
      if(ancho>2)continue;                       // laguna: la pasarela se respeta
      for(let d=-2;d<=2;d++){const xx=x+d; if(xx>0&&xx<COLS-1&&m[ROWS-3][xx]==='=')m[ROWS-3][xx]='.';}
    }
  }
  // 5. aberturas laterales despejadas de verdad
  if(idx>0) for(const y of [ROWS-2,ROWS-3]) m[y][0]='.';
  if(idx<last) for(const y of [ROWS-2,ROWS-3]) m[y][COLS-1]='.';
  if(!manual&&m[suelo][1]!=='#') m[suelo][1]='#';
  garantizarAlcance(m);
  limpiarEscaleras(m);
}

/* ==========================================================
   ESCALERAS HUERFANAS
   Una escalera debe llevar a algun sitio: a otra planta, a una
   plataforma o al techo. Las que mueren en el aire se retiran.
   ========================================================== */
function limpiarEscaleras(m){
  const sol=c=>c==='#'||c==='='||c==='P'||c==='B';
  for(let x=1;x<COLS-1;x++){
    for(let y=0;y<ROWS;y++){
      if(m[y][x]!=='H')continue;
      if(y>0&&m[y-1][x]==='H')continue;           // no es el extremo superior
      // ¿a donde lleva este tramo?
      let fin=y; while(fin+1<ROWS&&m[fin+1][x]==='H')fin++;
      if(y===0||fin===ROWS-1)continue;            // sale de la sala: conector
      if(y>0&&sol(m[y-1][x]))continue;            // topa con techo o plataforma
      let sirve=false;
      for(const dy of [-1,0,1])for(const dx of [-1,1]){
        const yy=y+dy, xx=x+dx;
        if(yy>=0&&yy<ROWS&&xx>=0&&xx<COLS&&sol(m[yy][xx]))sirve=true;
      }
      if(sirve)continue;
      for(let yy=y;yy<=fin;yy++)m[yy][x]='.';     // no lleva a nada: se retira
    }
  }
}

/* ==========================================================
   ALCANCE DE LAS PLATAFORMAS
   Recorrido en anchura desde el suelo: toda plataforma debe
   ser accesible de un salto (2 casillas de subida, 3 de avance)
   desde otra superficie ya alcanzada. Si no, se le pone escalera.
   ========================================================== */
const SUBIDA_MAX=2;
/* Medido sobre la fisica real del salto: al subir 1 casilla quedan 3,3 de
   avance; al subir 2, solo 2,7. Se descuenta margen por el ancho del heroe. */
const AVANCE_POR_SUBIDA={1:3,2:2};
function superficies(m){
  const lista=[];
  for(let y=1;y<ROWS;y++){
    let x=1;
    while(x<COLS-1){
      const solida=c=>c==='#'||c==='='||c==='P'||c==='B';
      if(solida(m[y][x])&&!solida(m[y-1][x])){
        let x2=x;
        while(x2+1<COLS-1&&solida(m[y][x2+1])&&!solida(m[y-1][x2+1]))x2++;
        lista.push({y,x1:x,x2:x2,suelo:y===ROWS-1});
        x=x2+1;
      } else x++;
    }
  }
  return lista;
}
function garantizarAlcance(m){
  for(let intento=0;intento<4;intento++){
    const sup=superficies(m);
    if(!sup.length)return;
    const alcanzada=sup.map(s=>s.suelo);
    let creci=true;
    while(creci){
      creci=false;
      sup.forEach((a,i)=>{
        if(!alcanzada[i])return;
        sup.forEach((b,j)=>{
          if(alcanzada[j])return;
          const subida=a.y-b.y;                       // cuantas casillas hay que subir
          if(subida<1||subida>SUBIDA_MAX)return;
          const hueco=Math.max(b.x1-a.x2, a.x1-b.x2); // separacion horizontal
          if(hueco>(AVANCE_POR_SUBIDA[subida]||0))return;
          // Y hace falta un hueco donde ponerse que no este bajo la plataforma
          // de arriba: si esta justo encima, el salto choca con su panza.
          const asomaIzq = a.x1 <= b.x1-1, asomaDer = a.x2 >= b.x2+1;
          if(!asomaIzq && !asomaDer) return;
          alcanzada[j]=true; creci=true;
        });
      });
    }
    const sueltas=sup.map((s,i)=>({s,i})).filter(o=>!alcanzada[o.i]);
    if(!sueltas.length)return;                        // todo accesible
    // a las plataformas sueltas se les arrima una escalera lateral
    sueltas.forEach(({s})=>{
      const libre=c=>c>0&&c<COLS-1;
      // columna pegada a un lado de la plataforma, nunca sobre ella
      let col=s.x1-1;
      if(!libre(col)||m[s.y][col]==='#')col=s.x2+1;
      if(!libre(col)||m[s.y][col]==='#')col=s.x1;      // ultimo recurso
      // la escalera asoma una casilla por encima para poder pisar la plataforma
      for(let y=Math.max(1,s.y-1);y<ROWS-1;y++){
        const c=m[y][col];
        if(y>s.y&&(c==='#'||c==='='||c==='P'||c==='B'))break;   // ya hay suelo debajo
        if(c==='='&&y!==s.y)break;
        if(c!=='.'&&c!=='H'&&c!=='=')continue;         // no pisar objetos ni pasadizos
        m[y][col]='H';
      }
    });
  }
}
/* ==========================================================
   ARQUETIPOS DE SALA
   La intencion se elige antes de generar nada. Las alturas
   existen para expresarla, no al reves.
   ========================================================== */
const INTENCIONES={
  transito:  {nombre:'',                 peso:26},
  tesoro:    {nombre:'CAMARA DEL TESORO',peso:24},
  atajo:     {nombre:'PASO ELEVADO',     peso:16},
  emboscada: {nombre:'EMBOSCADA',        peso:13},
  santuario: {nombre:'SANTUARIO',        peso:11},
  antecamara:{nombre:'',                 peso:12}   // esconde un pasadizo: sin rotulo
};
function elegirIntencion(lv,idx,last){
  if(lv==='torre')return 'transito';
  if(lv==='exterior'&&idx===last)return 'transito';   // el porton se compone a mano
  if(idx===last)return 'transito';                    // sala del conector: despejada
  // la sala de la llave es siempre camara del tesoro: la llave ocupa la cima
  if(G.cerrojos&&G.cerrojos[lv]&&idx===salaDeLaLlave(lv))return 'tesoro';
  const pesos={};
  for(const [k,v] of Object.entries(INTENCIONES))pesos[k]=v.peso;
  // el santuario aparece mas si el heroe llega tocado
  if(G.hp<=G.maxhp*.5)pesos.santuario+=22;
  // los sotanos son mas avaros y mas peligrosos
  if(LEVELS[lv].depth<0){pesos.tesoro+=14;pesos.emboscada+=10;pesos.transito-=10;}
  const total=Object.values(pesos).reduce((a,b)=>a+Math.max(0,b),0);
  let r=RND()*total;
  for(const [k,p] of Object.entries(pesos)){r-=Math.max(0,p);if(r<=0)return k;}
  return 'transito';
}

/* ==========================================================
   CAMARA SECRETA
   Fuera de la secuencia normal de salas. Se entra por el
   pasadizo de una antecamara y solo se sale por donde entraste.
   ========================================================== */
function genSecreta(lv,idx){
  const key='S:'+lv+':'+idx;
  if(rooms[key])return rooms[key];
  const L=LEVELS[lv];
  RND=mulberry(hash('secreta'+lv)*7919+idx*104729+G.seed);
  const m=[];for(let y=0;y<ROWS;y++)m.push(Array(COLS).fill('.'));
  for(let x=0;x<COLS;x++){m[0][x]='#';m[ROWS-1][x]='#';}
  for(let y=0;y<ROWS;y++){m[y][0]='#';m[y][COLS-1]='#';}
  // camara estrecha: se cierra por arriba con sillares
  for(let x=1;x<COLS-1;x++){m[1][x]='#';m[2][x]='#';}
  const deco=[],enemies=[];
  // la salida, en el mismo lado por el que se entra
  m[ROWS-2][2]='X';
  // el botin: cofre en el centro sobre un pedestal, y algo mas
  const cofre=ri(8,13);
  for(let j=-1;j<=1;j++)m[ROWS-2][cofre+j]='=';
  m[ROWS-3][cofre]='$$';
  if(RND()<.7)m[ROWS-2][cofre+(RND()<.5?-4:4)]='C';
  for(let i=0;i<ri(2,4);i++){const cx=ri(4,COLS-3);if(m[ROWS-2][cx]==='.')m[ROWS-2][cx]='$';}
  // ambiente: antorchas y atrezo segun la zona
  m[3][4]='!';m[3][COLS-5]='!';
  if(L.theme==='cueva'||L.theme==='cripta'){
    for(let i=0;i<3;i++)deco.push(['telarana',ri(3,COLS-4),3]);
    deco.push(['cristal',ri(4,COLS-5),ROWS-3]);
  } else {
    deco.push(['tapiz',ri(4,COLS-6),3]);
    for(let i=0;i<ri(1,2);i++)deco.push(['barril',ri(4,COLS-4),ROWS-2]);
  }
  // un guardian, porque el premio debe costar algo
  if(RND()<.65){
    const t=L.depth<0?pick(['ghost','skel']):pick(['skel','bat','vampiro']);
    enemies.push([t,ri(9,COLS-4),ROWS-3,4]);
  }
  rooms[key]={m,enemies,deco,lv,idx,secreta:true,intencion:'transito',
    name:'CAMARA OCULTA'};
  return rooms[key];
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function findFloorY(m,x){for(let y=1;y<ROWS;y++){if(m[y][x]==='#'||m[y][x]==='='||y===ROWS-1)return y;}return ROWS-1;}

/* ==========================================================
   ESTADO
   ========================================================== */
const G={mode:'title',lv:'exterior',idx:0,room:null,seed:Date.now()&0xffff,
  pj:'hombre',rol:'caballero',dif:'normal',selPj:0,selRol:0,selDif:1,
  hp:12,maxhp:12,lives:3,gold:0,oroTotal:0,dmg:2,armor:0,tick:0,msg:'',msgT:0,killed:{},taken:{},
  shake:0,bossHp:32,shopSel:0,fade:0,fadeCb:null};
const P={x:40,y:100,vx:0,vy:0,w:10,h:16,face:0,onGround:false,onLadder:false,
  atk:0,atkCd:0,inv:0,anim:0,dead:0,coyote:0,buffer:0,jumping:false,
  atkUp:false,pas:0,pasTipo:''};
let ents=[],shots=[],pickups=[],pshots=[];

function enterRoom(id,idx,entry,secreta){
  G.lv=id;G.idx=idx;
  G.room = secreta ? genSecreta(id,idx) : genRoom(id,idx);
  const clave = secreta ? 'S:'+id+':'+idx : roomKey(id,idx);
  ents=[];shots=[];pickups=[];pshots=[];
  G.room.enemies.forEach((e,i)=>{
    if(G.killed[clave+'#'+i])return;
    const[t,tx,ty,rg]=e;
    const VEL={rat:.7,skel:.55,zombi:.32,vampiro:.85,sirena:.35,armadura:.45,mago_e:.5,diablillo:.6,nazgul:.5};
    // la vida va en medios puntos: la espada hace 2, la flecha 1, el hechizo 0.75
    const VIDA={ghost:6,skel:4,zombi:4,vampiro:4,sirena:4,armadura:6,mago_e:4,diablillo:4,
                nazgul:8,dementor:6};
    const ALTO={bat:8,ghost:10,spider:10,vampiro:14,zombi:14,sirena:16,armadura:14,mago_e:14,diablillo:10,
                dementor:14,nazgul:20};
    const h=ALTO[t]||10;
    /* 'suelo' aqui significa que NO se apoya en el suelo. El dementor flota y
       ademas debe nacer arriba; el nazgul, en cambio, es terrestre. */
    const suelo=(t==='bat'||t==='ghost'||t==='spider'||t==='sirena'||t==='diablillo'||t==='mago_e'||t==='dementor');
    let ey=ty*TS, cx=tx;
    if(!suelo){
      // buscar una columna con suelo firme (ni pinchos ni agua) cerca del punto elegido
      const firme=c=>{
        for(let fy=ty;fy<ROWS;fy++){
          const casilla=G.room.m[fy]&&G.room.m[fy][c];
          if(casilla==='^'||casilla==='~')return -1;
          if(casilla==='#'||casilla==='=')return fy;
        }
        return -1;
      };
      let fy=firme(cx);
      for(let d=1;fy<0&&d<9;d++){
        if(tx-d>1&&firme(tx-d)>=0){cx=tx-d;fy=firme(cx);break;}
        if(tx+d<COLS-2&&firme(tx+d)>=0){cx=tx+d;fy=firme(cx);break;}
      }
      if(fy<0)return;              // sin sitio seguro: no se genera
      ey=fy*TS-h;
    }
    /* El dementor SIEMPRE entra por lo alto, venga como venga de la
       generacion: hay varios sitios donde se apilan enemigos y no todos
       pasan por el reparto por temas. */
    if(t==='dementor')ey=ri(TS,TS*2);
    ents.push({type:t,i,x:cx*TS,y:ey,ox:cx*TS,oy:ey,
      vx:(VEL[t]||.5)*(RND()<.5?-1:1),vy:0,
      rng:rg*TS,hp:VIDA[t]||2,t:RND()*100,hit:0,kb:0,fl:0,lento:0,quema:0});
  });
  if(G.room.boss&&!G.taken.boss)
    ents.push({type:'boss',x:150,y:56,vx:.8,vy:.55,hp:G.bossHp,t:0,hit:0,shootT:70});
  // el minijefe guarda la sala del conector de cada planta
  const MJ=(!secreta)&&MINIJEFES[id];
  if(MJ && idx===LEVELS[id].rooms-1 && !G.taken['mini:'+id] && id!=='torre'){
    ents.push({type:'mini',lv:id,clase:MJ.clase,nombre:MJ.nombre,spr:MJ.spr(),
      w:MJ.an,h:MJ.al,hpMax:MJ.hp,hp:MJ.hp,
      x:Math.round(VW*.42),y:(ROWS-2)*TS-MJ.al,vx:-.6,vy:0,t:0,hit:0,kb:0,
      ataque:ri(60,110),fase:0,face:1});
  }
  if(entry){P.x=entry.x;P.y=entry.y;}
  P.vx=0;P.vy=0;
  /* DESPEJE DE LA ENTRADA. Los enemigos se colocan al generar la sala, sin
     saber por que lado entrara el heroe, asi que a veces aparecian justo
     encima de el: un golpe imposible de evitar nada mas cruzar la puerta.
     Aqui se aparta a los que hayan quedado demasiado cerca. Los jefes no se
     tocan: su sala se entra sabiendo lo que hay. */
  {
    const MARGEN=58;                       // algo mas de tres casillas
    const flota=t=>(t==='bat'||t==='ghost'||t==='spider'||t==='sirena'
                   ||t==='diablillo'||t==='mago_e'||t==='dementor');
    const firme=(c,desde)=>{
      for(let fy=desde;fy<ROWS;fy++){
        const casilla=G.room.m[fy]&&G.room.m[fy][c];
        if(casilla==='^'||casilla==='~')return -1;
        if(casilla==='#'||casilla==='='||casilla==='P'||casilla==='B')return fy;
      }
      return -1;
    };
    const pcx=P.x+P.w/2;
    ents.forEach(e=>{
      if(e.type==='mini'||e.type==='boss')return;
      const w=e.w||12, h=e.h||10;
      if(Math.abs((e.x+w/2)-pcx)>MARGEN)return;
      const lejos=(pcx<VW/2)?1:-1;          // se aparta hacia el lado opuesto
      if(flota(e.type)){
        e.x=Math.max(TS,Math.min(VW-TS-w,
            pcx+lejos*(MARGEN+ri(4,40))-w/2));
        e.ox=e.x;
        return;
      }
      // de suelo: se busca la primera columna firme pasado el margen
      for(let d=0;d<COLS;d++){
        const c=Math.round((pcx+lejos*(MARGEN+d*TS))/TS);
        if(c<2||c>COLS-3)continue;
        const fy=firme(c,1);
        if(fy>0){ e.x=c*TS; e.y=fy*TS-h; e.ox=e.x; e.oy=e.y; return; }
      }
      /* Si no hay ni una columna firme lejos del heroe, se retira: mejor una
         sala con un bicho menos que un golpe gratis al entrar. */
      e.dead=true;
    });
  }
  musPlay(MUSICA_ZONA[LEVELS[id].theme]||'castillo');
  if(G.room.secreta){G.msg='CAMARA OCULTA';G.msgT=130;}
  else{
    const eti=G.room.intencion&&INTENCIONES[G.room.intencion];
    G.msg=(eti&&eti.nombre)?eti.nombre:LEVELS[id].name;
    G.msgT=100;
  }
}
function fadeTo(fn){G.fade=1;G.fadeCb=fn;}

function newGame(){
  const r=ROLES[G.rol];
  const D=DIFICULTADES[G.dif]||DIFICULTADES.normal;
  Object.assign(G,{hp:r.vida,maxhp:r.vida,lives:D.vidas,gold:0,oroTotal:0,gano:0,dmg:r.dmg,armor:0,mejoras:0,botas:0,
    killed:{},taken:{},llaves:{},bossHp:32,mode:'play',seed:(Date.now()&0xffff)});
  // dos plantas al azar cierran el paso: hay que encontrar su llave
  const sorteo=mulberry(G.seed*7919+13);
  const candidatas=['p1','p2','p3','p4','p5'];
  G.cerrojos={};
  for(let i=0;i<2&&candidatas.length;i++){
    const j=Math.floor(sorteo()*candidatas.length);
    G.cerrojos[candidatas.splice(j,1)[0]]=true;
  }
  // Conejito guarda la llave de la planta mas baja; Brocoli la de la mas alta
  G.guardianes={};
  Object.keys(G.cerrojos).sort((a,b)=>LEVELS[a].depth-LEVELS[b].depth)
    .forEach((lv,i)=>{G.guardianes[lv]=i===0?'conejito':'brocoli';});
  G.hablado={};
  Object.keys(rooms).forEach(k=>delete rooms[k]);
  P.dead=0;P.inv=0;P.face=0;
  pshots=[];
  enterRoom('exterior',0,{x:30,y:(ROWS-3)*TS});
}
/* En que sala de la planta esta la llave: determinista por semilla */
function salaDeLaLlave(lv){
  return hash('llave'+lv+G.seed)%Math.max(1,LEVELS[lv].rooms-1);
}
function respawn(){
  G.lives--;if(G.lives<0){G.mode='gameover';musStop();anotarMarca();return;}
  G.hp=G.maxhp;P.inv=100;P.dead=0;P.enredado=0;P.vendas=0;P.atrapado=0;P.atraido=0;P.abatido=0;
  enterRoom(G.lv,G.idx,{x:TS*2,y:(ROWS-3)*TS});
}

/* ==========================================================
   PANTALLA COMPLETA
   El juego es apaisado (320x200), asi que en movil conviene
   girar. Se intenta bloquear la orientacion; si el navegador
   no lo permite, el aviso de girar sigue visible.
   ========================================================== */
const btnFull=document.getElementById('full');
// en pantalla tactil los mandos van debajo por defecto, para no tapar al heroe
try{ if(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches){
  G.ctrlAbajo=true; document.body.classList.add('ctrl-abajo'); } }catch(e){}
function enPantallaCompleta(){
  return !!(document.fullscreenElement||document.webkitFullscreenElement);
}
async function alternarCompleta(){
  try{
    if(!enPantallaCompleta()){
      const e=document.documentElement;
      if(e.requestFullscreen)await e.requestFullscreen({navigationUI:'hide'});
      else if(e.webkitRequestFullscreen)e.webkitRequestFullscreen();
      try{ if(screen.orientation&&screen.orientation.lock)
        await screen.orientation.lock('landscape'); }catch(err){}
    } else {
      try{ if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock(); }catch(err){}
      if(document.exitFullscreen)await document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }
  }catch(err){
    // Algunos navegadores (iOS Safari) no dan pantalla completa:
    // al menos se aplica el diseno ampliado.
    document.body.classList.toggle('completa');
  }
  ac();
}
function sincronizarCompleta(){
  const activa=enPantallaCompleta();
  document.body.classList.toggle('completa',activa);
  document.body.classList.toggle('ctrl-abajo',!!G.ctrlAbajo);
  btnFull.innerHTML=activa?'&#10005;':'&#9974;';
}
if(btnFull){
  btnFull.addEventListener('click',alternarCompleta);
  document.addEventListener('fullscreenchange',sincronizarCompleta);
  document.addEventListener('webkitfullscreenchange',sincronizarCompleta);
}
// F para pantalla completa desde teclado
addEventListener('keydown',e=>{if(e.code==='KeyF')alternarCompleta();});

/* Lectura de mandos tolerante: si el navegador o la política de permisos
   del iframe bloquea la API, se desactiva sin romper el juego. */
let padOK=true;
function readPads(){
  if(!padOK||!navigator.getGamepads)return [];
  try{ return navigator.getGamepads()||[]; }
  catch(err){ padOK=false; return []; }
}

const IN={left:0,right:0,up:0,down:0,jump:0,atk:0,jumpP:0,upP:0,downP:0,atkP:0,startP:0};
let prev={};
function readInput(){
  let l=K.ArrowLeft||K.KeyA, r=K.ArrowRight||K.KeyD, u=K.ArrowUp||K.KeyW,
      d=K.ArrowDown||K.KeyS, j=K.Space||K.KeyZ, a=K.KeyX||K.KeyK, st=K.Enter;
  const gps=readPads();
  for(const gp of gps){ if(!gp)continue;
    const ax=gp.axes[0]||0, ay=gp.axes[1]||0, B=gp.buttons;
    const bt=i=>B[i]&&B[i].pressed;
    l=l||ax<-.4||bt(14); r=r||ax>.4||bt(15);
    u=u||ay<-.4||bt(12); d=d||ay>.4||bt(13);
    j=j||bt(0); a=a||bt(2)||bt(1)||bt(3); st=st||bt(9);
    break;
  }
  IN.left=l;IN.right=r;IN.up=u;IN.down=d;IN.jump=j;IN.atk=a;
  IN.jumpP=j&&!prev.j; IN.upP=u&&!prev.u; IN.downP=d&&!prev.d; IN.atkP=a&&!prev.a; IN.startP=st&&!prev.st;
  IN.leftP=l&&!prev.l; IN.rightP=r&&!prev.r;
  const pa=K.Escape||K.KeyP||st;
  IN.pausaP=pa&&!prev.pa;
  prev={j,u,d,a,st,l,r,pa};
  if(G.mode==='title'&&(IN.jumpP||IN.startP||IN.atkP)){ac();musPlay('titulo');G.mode='selPj';beep(700,.08);return;}
  if(G.mode==='title'&&(IN.leftP||IN.rightP||IN.upP||IN.downP)){ac();musPlay('titulo');}
  if(G.mode==='selPj'){
    if(IN.leftP){G.selPj=(G.selPj+ORDEN_PJ.length-1)%ORDEN_PJ.length;beep(600,.05);}
    if(IN.rightP){G.selPj=(G.selPj+1)%ORDEN_PJ.length;beep(600,.05);}
    G.pj=ORDEN_PJ[G.selPj];
    if(IN.jumpP||IN.atkP||IN.startP){G.mode='selRol';beep(900,.09);}
    if(IN.downP){G.mode='title';}
    return;
  }
  if(G.mode==='selRol'){
    if(IN.leftP){G.selRol=(G.selRol+ORDEN_ROL.length-1)%ORDEN_ROL.length;beep(600,.05);}
    if(IN.rightP){G.selRol=(G.selRol+1)%ORDEN_ROL.length;beep(600,.05);}
    G.rol=ORDEN_ROL[G.selRol];
    if(IN.jumpP||IN.atkP||IN.startP){G.mode='selDif';beep(900,.09);}
    if(IN.downP){G.mode='selPj';}
    return;
  }
  if(G.mode==='selDif'){
    if(IN.leftP){G.selDif=(G.selDif+ORDEN_DIF.length-1)%ORDEN_DIF.length;beep(600,.05);}
    if(IN.rightP){G.selDif=(G.selDif+1)%ORDEN_DIF.length;beep(600,.05);}
    G.dif=ORDEN_DIF[G.selDif];
    if(IN.jumpP||IN.atkP||IN.startP){ac();SFX.buy();newGame();}
    if(IN.downP){G.mode='selRol';}
    return;
  }
  /* --- PAUSA: se entra y se sale con Start o Escape --- */
  if(G.mode==='play'&&(IN.startP||IN.pausaP)){G.mode='pausa';G.selPausa=0;beep(500,.08);return;}
  if(G.mode==='pausa'){
    const OP=OPCIONES_PAUSA;
    if(IN.upP){G.selPausa=(G.selPausa+OP.length-1)%OP.length;beep(700,.05);}
    if(IN.downP){G.selPausa=(G.selPausa+1)%OP.length;beep(700,.05);}
    if(IN.startP||IN.pausaP){G.mode='play';beep(500,.08);return;}
    if(IN.jumpP||IN.atkP)OP[G.selPausa].hacer();
    return;
  }
  if((G.mode==='gameover'||G.mode==='win')&&(IN.jumpP||IN.startP)){ac();musPlay('titulo');G.mode='selPj';}
}

/* ==========================================================
   COLISIONES
   ========================================================== */
const SOLID=c=>c==='#'||c==='='||c==='P'||c==='B'||
  (c==='D'&&!(G.llaves&&G.llaves[G.lv]));
const HURT=c=>c==='^'||c==='~';
/* Hay suelo firme bajo un punto, mirando unos pixeles hacia abajo.
   La holgura es necesaria: algunos enemigos se colocan con una altura y
   colisionan con otra, y descansan unos pixeles por encima de la casilla.
   Sin holgura se les daba por colgados y se les anulaba el retroceso. */
function firmeBajo(px,py,margen){
  const lim=margen||8;
  for(let d=1;d<=lim;d++){
    const c=tileAt(px,py+d);
    if(HURT(c))return false;                        // foso: esta columna no vale
    if(c==='#'||c==='='||c==='P'||c==='B')return true;
  }
  return false;                                     // nada cerca: al aire
}
function tileAt(px,py){const tx=Math.floor(px/TS),ty=Math.floor(py/TS);
  if(tx<0||tx>=COLS)return '#'; if(ty<0)return '.'; if(ty>=ROWS)return '#';
  return G.room.m[ty][tx];}
function boxSolid(x,y,w,h){
  const pts=[[0,0],[w-1,0],[0,h-1],[w-1,h-1],[w/2,h/2],[w/2,0],[w/2,h-1]];
  return pts.some(([i,j])=>SOLID(tileAt(x+i,y+j)));}
function boxHurt(x,y,w,h){
  const pts=[[0,0],[w-1,0],[0,h-1],[w-1,h-1],[w/2,h-1]];
  return pts.some(([i,j])=>HURT(tileAt(x+i,y+j)));}
function tileMid(){return tileAt(P.x+P.w/2,P.y+P.h/2);}
function ladderHere(){return tileAt(P.x+P.w/2,P.y+P.h/2)==='H'||tileAt(P.x+P.w/2,P.y+P.h-2)==='H';}

/* ==========================================================
   LOGICA
   ========================================================== */
function update(){
  G.tick++; readInput();
  if(G.msgT>0)G.msgT--; if(G.shake>0)G.shake--;
  if(G.fade>0){G.fade+=.06; if(G.fade>=2&&G.fadeCb){const f=G.fadeCb;G.fadeCb=null;f();} if(G.fade>3)G.fade=0; return;}
  if(G.mode==='shop')return updateShop();
  /* Los creditos avanzan solos. Se pueden saltar, pero solo despues de tres
     segundos: si no, el salto con el que acabas de matar al brujo se los
     comeria entero sin que te diera tiempo a ver nada. */
  if(G.mode==='creditos'){
    G.credT++;
    /* La marcha de victoria acompana toda la secuencia y cede el paso a la
       fanfarria justo cuando el rey levanta la espada. */
    const tNombra=CREDITOS.slice(0,8).reduce((a,c)=>a+c.t,0);
    musPlay(G.credT>=tNombra?'fanfarria':'victoria');
    if(G.credT>=CRED_TOTAL||(G.credT>150&&(IN.startP||IN.jumpP))){G.mode='win';}
    return;
  }
  /* TORMENTA DE LA AZOTEA. Cada pocos segundos cae un rayo sobre la vertical
     del heroe, con casi un segundo de aviso: una marca en el suelo que se
     acelera. Igual que los pinchos del Necromante, sin aviso seria injusto. */
  if(G.mode==='play'&&G.lv==='p7'){
    if(G.rayoCd===undefined)G.rayoCd=ri(150,240);
    if(--G.rayoCd<=0){
      G.rayoCd=ri(200,330);
      const cx=Math.max(14,Math.min(VW-14,P.x+P.w/2+ri(-10,10)));
      shots.push({tipo:'rayoCielo',x:cx-7,y:0,vx:0,vy:0,
        aviso:46,atraviesa:true,t:0,dmg:2,an:14,al:(ROWS-1)*TS,vida:78});
      SFX.magia('rayo');
    }
  }
  if(G.mode==='pausa')return;
  if(G.mode!=='play')return;
  if(P.dead>0){P.dead--;P.y+=1.1;if(P.dead===0)respawn();return;}

  /* ---- SALTO SUAVE: coyote time, buffer, altura variable, apex flotante ---- */
  if(IN.jumpP)P.buffer=9; if(P.buffer>0)P.buffer--;
  if(P.onGround)P.coyote=8; else if(P.coyote>0)P.coyote--;

  const onLad=ladderHere();
  if(onLad&&(IN.up||IN.down)){P.onLadder=true;}
  if(P.onLadder&&!onLad)P.onLadder=false;

  if(P.onLadder){
    P.vy=IN.up?-1.3:(IN.down?1.3:0);
    P.vx=IN.left?-.9:(IN.right?.9:0);
    if(IN.left)P.face=1; if(IN.right)P.face=0;
    /* Sin pulsar a los lados, el heroe se centra en el larguero.
       Si no, al ir descolocado su hombro chocaba con el techo y se
       quedaba clavado bajo la salida sin poder cambiar de planta. */
    if(!IN.left&&!IN.right){
      const colEsc=Math.floor((P.x+P.w/2)/TS);
      const centro=colEsc*TS+(TS-P.w)/2;
      const dif=centro-P.x;
      if(Math.abs(dif)>.2)P.x+=Math.sign(dif)*Math.min(.8,Math.abs(dif));
      else P.x=centro;
    }
    if(P.buffer>0){P.onLadder=false;P.vy=-4.4;P.buffer=0;SFX.jump();}
  } else {
    // las vendas de la momia se acumulan: hasta un 60% mas lento
    /* El abatimiento del Dementor se acumula con las vendas de la Momia,
       pero nunca por debajo del 45%: por debajo de ahi habria saltos del
       escenario que no se podrian hacer. */
    const frenoAbat = (P.abatido>0) ? .62 : 1;
    const frenoVendas = Math.max(.45,(P.enredado>0 ? (1-.2*(P.vendas||0)) : 1)*frenoAbat);
    const acel=(P.onGround?.55:.34)*frenoVendas, maxv=1.55*frenoVendas;
    if(P.atrapado>0){
      /* Telarana: pies pegados al suelo. Ni andar ni saltar durante un
         segundo, pero SI atacar: quedarse inmovil y ademas indefenso
         seria un castigo doble por un proyectil que no hace dano. */
      P.vx=0; P.buffer=0;
    }
    else if(IN.left){P.vx=Math.max(P.vx-acel,-maxv);P.face=1;}
    else if(IN.right){P.vx=Math.min(P.vx+acel,maxv);P.face=0;}
    else P.vx*=P.onGround?.62:.9;
    /* El canto de la Sirena Reina tira del heroe hacia ella. NO le quita el
       control: se puede seguir andando y el tiron se resta, asi que luchar
       contra la corriente frena el arrastre pero no lo anula. Sin ese
       margen seria un empujon al agua imposible de evitar. */
    if(P.atraido>0){
      const haciaSirena=Math.sign((P.atraeX||P.x)-(P.x+P.w/2));
      P.vx+=haciaSirena*0.30;
      P.vx=Math.max(-maxv*1.6,Math.min(maxv*1.6,P.vx));
    }
    if(Math.abs(P.vx)<.05)P.vx=0;

    if(P.buffer>0&&P.coyote>0){P.vy=-4.55*(P.enredado>0?.88:1)*(P.abatido>0?.86:1);P.onGround=false;P.coyote=0;P.buffer=0;P.jumping=true;SFX.jump();}
    if(!IN.jump&&P.vy<-1.6&&P.jumping){P.vy*=.55;P.jumping=false;}   // corte de salto
    if(P.onGround&&P.vy>=0){
      P.vy=0;                       // apoyado: nada de gravedad residual
    } else {
      const apex=Math.abs(P.vy)<1.1;
      const grav = P.vy<0 ? (apex?.16:.235) : (apex?.19:.36);
      P.vy=Math.min(P.vy+grav,5.6);
    }
  }

  // X
  let nx=P.x+P.vx;
  if(!boxSolid(nx,P.y,P.w,P.h))P.x=nx; else P.vx=0;
  // Y
  const wasAir=!P.onGround;
  let ny=P.y+P.vy;
  if(!boxSolid(P.x,ny,P.w,P.h))P.y=ny;
  else{
    // el encaje se calcula con la posicion tentativa, no con la anterior
    if(P.vy>0){P.y=Math.floor((ny+P.h)/TS)*TS-P.h;P.jumping=false;}
    else P.y=Math.floor(ny/TS)*TS+TS;
    P.vy=0;
  }
  // el apoyo se comprueba sondeando 1 px bajo los pies, no por la colision
  P.onGround = P.vy>=0 && boxSolid(P.x,P.y+1,P.w,P.h);
  if(P.onGround){
    P.vy=0;
    P.y=Math.round((P.y+P.h)/TS)*TS-P.h;   // encaje exacto sobre la casilla
    if(wasAir)SFX.land();
  }
  P.anim+=Math.abs(P.vx)>.3?.22:0;

  /* ---- ataque segun el rol ---- */
  const ROL=ROLES[G.rol];
  if(P.atkCd>0)P.atkCd--;
  if(IN.atkP&&P.atkCd===0){
    P.atk=11;P.atkCd=ROL.cd;
    /* El caballero puede mandoblear hacia arriba manteniendo ARRIBA.
       La direccion se congela al empezar el golpe: si se soltara la
       tecla a mitad del barrido, el arco cambiaria de sitio y el
       jugador no sabria nunca donde ha pegado. Nunca en diagonal. */
    P.atkUp = (G.rol==='caballero') && !!IN.up && !IN.down;
    if(G.rol==='caballero')SFX.sword();
    else{
      const dir=P.face?-1:1;
      if(G.rol==='arquero'){
        pshots.push({tipo:'flecha',x:P.x+(P.face?-6:P.w),y:P.y+5,y0:P.y+5,vx:ROL.vel*dir,
          rec:0,rango:ROL.alcance,dmg:G.dmg,t:0});
        SFX.arco();
      } else {
        const magia=pick2(['fuego','hielo','rayo','viento']);
        pshots.push({tipo:magia,x:P.x+(P.face?-8:P.w),y:P.y+4,y0:P.y+4,vx:ROL.vel*dir,
          rec:0,rango:ROL.alcance,dmg:G.dmg,t:0});
        SFX.magia(magia);
      }
    }
  }
  if(P.atk>0)P.atk--;
  if(P.pas>0)P.pas--;

  /* ---- interacciones de casilla ---- */
  const cx=Math.floor((P.x+P.w/2)/TS),cy=Math.floor((P.y+P.h/2)/TS),cyF=Math.floor((P.y+P.h-2)/TS);
  const t=G.room.m[cy]&&G.room.m[cy][cx];
  const tf=G.room.m[cyF]&&G.room.m[cyF][cx];
  /* --- los guardianes de peluche: hay que hablar con ellos --- */
  if(t==='K'||tf==='K'||tileAt(P.x+P.w/2+10,P.y+P.h-2)==='K'){
    const quien=(G.guardianes&&G.guardianes[G.lv])||'conejito';
    if(IN.upP){
      // quitar la casilla del guardian, este donde este a nuestro alcance
      for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(G.room.m[y][x]==='K')G.room.m[y][x]='.';
      G.llaves[G.lv]=true;G.hablado[G.lv]=true;SFX.key();
      G.msg=(quien==='conejito'?'CONEJITO':'BROCOLI')+' TE DA LA LLAVE';G.msgT=150;
    } else if(G.msgT===0){
      G.msg=(quien==='conejito'?'CONEJITO':'BROCOLI')+': PULSA ARRIBA PARA HABLAR';
      G.msgT=70;
    }
  }
  /* Todas las fuentes de oro bajadas un 40%: con las cifras anteriores se
     llegaba al final comprandolo todo, y la tienda dejaba de ser una eleccion.
     Monedas 8-18 -> 5-11, cofres 45-80 -> 27-48, botin de jefe 10-20 -> 6-12,
     y de enemigo raso 3-9 -> 2-5. */
  if(t==='$'){G.room.m[cy][cx]='.';const o1=ri(5,11);G.gold+=o1;G.oroTotal+=o1;SFX.gold();G.msg='+ORO';G.msgT=50;}
  if(t==='$$'){G.room.m[cy][cx]='.';const oro=ri(27,48);G.gold+=oro;G.oroTotal+=oro;
    SFX.key();G.msg='COFRE  +'+oro+' DE ORO';G.msgT=110;}
  if(t==='C'){G.room.m[cy][cx]='.';G.hp=Math.min(G.maxhp,G.hp+4);SFX.heart();G.msg='POCION';G.msgT=60;}
  if(boxHurt(P.x,P.y,P.w,P.h))damage(2,true);   // pinchos y agua: sin pasiva

  // tienda
  const enTienda=c=>c==='T'||c==='N';
  const enElPuesto=(enTienda(t)||enTienda(tf)||enTienda(tileAt(P.x+P.w/2+8,P.y+P.h-2)));
  /* La tienda de la cueva comparte sala con la Sirena Reina: comprar o
     largarse por el atajo mientras ella sigue viva dejaba la pelea sin
     sentido. Primero se la despacha. */
  if(enElPuesto&&IN.upP&&guardiaViva()){avisoGuardia();}
  else if(enElPuesto&&IN.upP){
    G.ambulante=!(t==='T'||tf==='T'||tileAt(P.x+P.w/2+8,P.y+P.h-2)==='T');
    G.mode='shop';G.shopSel=0;SFX.stairs();musPlay('tienda');
    G.fraseNora=pick2(G.ambulante?FRASES_NORA.ambulante:FRASES_NORA.saluda);}

  /* --- pasadizo secreto: se entra y se sale por el mismo hueco --- */
  if((t==='X'||tf==='X')&&IN.upP){
    SFX.door();
    if(G.room.secreta){
      const v=G.volver||{lv:G.lv,idx:G.idx,x:TS*3,y:(ROWS-3)*TS};
      fadeTo(()=>enterRoom(v.lv,v.idx,{x:v.x,y:v.y}));
    } else {
      G.volver={lv:G.lv,idx:G.idx,x:P.x,y:P.y};
      const lv=G.lv,idx=G.idx;
      fadeTo(()=>enterRoom(lv,idx,{x:TS*3,y:(ROWS-3)*TS},true));
    }
    return;
  }
  /* --- aviso de verja cerrada --- */
  if(G.cerrojos&&G.cerrojos[G.lv]&&!G.llaves[G.lv]&&G.msgT===0
