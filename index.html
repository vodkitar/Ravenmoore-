/* ==========================================================
   ILUMINACION
   Una capa de penumbra fuera de pantalla en la que las luces
   recortan su alcance, y encima halos calidos en modo aditivo.
   ========================================================== */
let lienzoLuz=null, ctxLuz=null;
function capaLuz(){
  if(!lienzoLuz){
    lienzoLuz=document.createElement('canvas');
    lienzoLuz.width=VW; lienzoLuz.height=PH;
    ctxLuz=lienzoLuz.getContext('2d');
  }
  return ctxLuz;
}
/* Penumbra por zona y luz ambiental minima.
   La penumbra sola dejaba la sala en negro salvo los focos: hace falta
   un suelo de luz ambiental que garantice que la arquitectura se lee. */
const PENUMBRA={cripta:.52,cueva:.48,biblio:.30,salon:.26,torreon:.28,
  piedra:.24,noche:.20,cielo:.34};
const AMBIENTE={cripta:.52,cueva:.55,biblio:.66,salon:.70,torreon:.68,
  piedra:.72,noche:.76,cielo:.60};

function luces(r){
  const lista=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=r.m[y][x];
    if(c==='!')lista.push({x:x*TS+8,y:y*TS+6,rad:58,col:[255,150,40],parp:true});
    else if(c==='T'||c==='N')lista.push({x:x*TS+4,y:y*TS+8,rad:52,col:[255,210,90]});
    else if(c==='$$')lista.push({x:x*TS+8,y:y*TS+8,rad:26,col:[255,200,60]});
    else if(c==='K')lista.push({x:x*TS+8,y:y*TS+8,rad:30,col:[255,235,120]});
    else if(c==='X')lista.push({x:x*TS+8,y:y*TS+8,rad:20,col:[120,110,180]});
    else if(c==='C')lista.push({x:x*TS+8,y:y*TS+8,rad:22,col:[80,200,255]});
  }
  (r.deco||[]).forEach(d=>{
    if(d[0]==='arana')lista.push({x:d[1]*TS+10,y:d[2]*TS+16,rad:66,col:[255,190,80],parp:true});
    if(d[0]==='cristal')lista.push({x:d[1]*TS+8,y:d[2]*TS+8,rad:34,col:[110,220,255]});
  });
  // el heroe lleva su propia luz: garantiza que el suelo siempre se lea
  lista.push({x:P.x+5,y:P.y+8,rad:78,col:[190,190,255],suave:true});
  // proyectiles magicos iluminan
  pshots.forEach(s=>{if(s.tipo!=='flecha')
    lista.push({x:s.x+3,y:s.y+2,rad:30,col:[255,220,120]});});
  return lista;
}
function pintarLuz(r,tema){
  const L=luces(r);
  const oscuridad=PENUMBRA[tema]!==undefined?PENUMBRA[tema]:.34;
  // 1) capa de penumbra: se rellena y las luces la perforan
  if(oscuridad>0.01){
    const cl=capaLuz();
    cl.globalCompositeOperation='source-over';
    cl.clearRect(0,0,VW,PH);
    cl.fillStyle='rgba(6,6,22,'+oscuridad+')';
    cl.fillRect(0,0,VW,PH);
    cl.globalCompositeOperation='destination-out';
    // 1a) lavado ambiental uniforme: la sala nunca queda en negro plano
    const amb=AMBIENTE[tema]!==undefined?AMBIENTE[tema]:.7;
    cl.fillStyle='rgba(0,0,0,'+amb+')';
    cl.fillRect(0,0,VW,PH);
    // 1b) cada luz abre su propio claro, mas suave y mas ancho
    L.forEach(l=>{
      const parp=l.parp?1+Math.sin(G.tick*.22+l.x)*.06:1;
      const rad=l.rad*1.35*parp;
      const g=cl.createRadialGradient(l.x,l.y,0,l.x,l.y,rad);
      g.addColorStop(0,'rgba(0,0,0,1)');
      g.addColorStop(.35,'rgba(0,0,0,.85)');
      g.addColorStop(.7,'rgba(0,0,0,.45)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      cl.fillStyle=g;cl.fillRect(l.x-rad,l.y-rad,rad*2,rad*2);
    });
    ctx.drawImage(lienzoLuz,0,0);
  }
  // 2) halos calidos en aditivo, por encima de todo
  ctx.globalCompositeOperation='lighter';
  L.forEach(l=>{
    if(l.suave)return;
    const parp=l.parp?1+Math.sin(G.tick*.22+l.x)*.08:1;
    const rad=l.rad*.85*parp;
    const g=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,rad);
    g.addColorStop(0,'rgba('+l.col.join(',')+',.22)');
    g.addColorStop(.5,'rgba('+l.col.join(',')+',.08)');
    g.addColorStop(1,'rgba('+l.col.join(',')+',0)');
    ctx.fillStyle=g;ctx.fillRect(l.x-rad,l.y-rad,rad*2,rad*2);
  });
  ctx.globalCompositeOperation='source-over';
}

/* ==========================================================

   'suelo' se apoya y crece hacia arriba; 'techo' cuelga del muro

  tapiz:{an:2,al:3,ancla:'techo'},    estandarte:{an:2,al:2,ancla:'techo'},
  arana:{an:2,al:2,ancla:'techo'},    telarana:{an:1,al:1,ancla:'techo'},
  veta:{an:1,al:1,ancla:'techo'},     raiz:{an:1,al:1,ancla:'techo'},

function decoDraw(d){

    for(let i=0;i<10;i++){ctx.fillStyle=[PAL.R,PAL.g,PAL.b,PAL.q,PAL.m][i%5];
      ctx.fillRect(x+3+(i%5)*3,o+4+((i/5)|0)*15,2,10);}
    ctx.fillStyle=M[0];ctx.fillRect(x,o+15,20,2);ctx.fillRect(x,o+30,20,2);}
  else if(t==='barril'){
    const M=RAMPA.madera,T=RAMPA.metal;

/* ==========================================================
   FONDOS EN CAPAS
   Cada tema tiene cielo/muro, una capa lejana con parallax
   segun la sala, y detalle cercano.
   ========================================================== */
function estrellas(n,alto,vel){
  ctx.fillStyle=PAL.W;
  for(let i=0;i<n;i++){
    const px=(i*89+G.idx*53)%VW, py=(i*47)%alto;
    if(((G.tick>>(vel||4))+i)%6)ctx.fillRect(px,py,1,1);
  }
}
function luna(x,y,r){
  /* Circulo trazado por filas: en un lienzo de pixeles hay que calcular
     el ancho de cada linea, o sale un cuadrado. */
  const rad=r/2, cx=x+rad, cy=y+rad;
  const filas=[];
  for(let j=0;j<r;j++){
    const dy=j-rad+.5;
    const semi=Math.sqrt(Math.max(0,rad*rad-dy*dy));
    filas.push([Math.round(cx-semi),Math.round(semi*2)]);
  }
  // halo tenue alrededor
  ctx.globalAlpha=.10;ctx.fillStyle='#FFFFEE';
  for(let j=-3;j<r+3;j++){
    const dy=j-rad+.5, semi=Math.sqrt(Math.max(0,(rad+3)*(rad+3)-dy*dy));
    if(semi>0)ctx.fillRect(Math.round(cx-semi),y+j,Math.round(semi*2),1);
  }
  ctx.globalAlpha=1;
  // disco
  ctx.fillStyle=PAL.e;
  filas.forEach(([px,w],j)=>{ if(w>0)ctx.fillRect(px,y+j,w,1); });
  // cara iluminada, desplazada hacia arriba y a la izquierda
  ctx.fillStyle=PAL.W;
  filas.forEach(([px,w],j)=>{
    if(w<=2||j>r-3)return;
    const merma=Math.max(0,Math.round((j-r*.25)*.35));
    const ww=w-2-merma;
    if(ww>0)ctx.fillRect(px+1,y+j,ww,1);
  });
  // crateres
  ctx.fillStyle=PAL.w;
  ctx.fillRect(x+Math.round(r*.55),y+Math.round(r*.22),3,3);
  ctx.fillRect(x+Math.round(r*.28),y+Math.round(r*.55),4,3);
  ctx.fillRect(x+Math.round(r*.62),y+Math.round(r*.62),2,2);
  ctx.fillStyle=PAL.d;
  ctx.fillRect(x+Math.round(r*.30),y+Math.round(r*.56),2,1);
}
function siluetaCastillo(bx,by,esc,col){
  ctx.fillStyle=col;
  ctx.fillRect(bx,by,86*esc,60);
  for(let i=0;i<7;i++)ctx.fillRect(bx+i*12*esc,by-6,7*esc,7);
  ctx.fillRect(bx+30*esc,by-34,26*esc,36);
  for(let i=0;i<3;i++)ctx.fillRect(bx+(30+i*9)*esc,by-40,5*esc,7);
  ctx.fillRect(bx+8*esc,by-18,12*esc,20);
  ctx.fillRect(bx+66*esc,by-18,12*esc,20);
}
function ventanaOjival(x,y,w,h,vidrio){
  ctx.fillStyle=PAL.k;ctx.fillRect(x,y,w,h);
  ctx.fillStyle=vidrio?PAL.n:'#0a0a18';ctx.fillRect(x+1,y+2,w-2,h-3);
  ctx.fillRect(x+2,y,w-4,3);
  if(vidrio){
    const c=[PAL.b,PAL.v,PAL.r,PAL.c];
    for(let i=0;i<4;i++){ctx.fillStyle=c[(i+G.idx)%4];
      ctx.fillRect(x+2+(i%2)*((w-4)/2),y+4+((i/2)|0)*((h-6)/2),(w-5)/2,(h-8)/2);}
    ctx.fillStyle=PAL.k;ctx.fillRect(x+(w>>1)-1,y+2,1,h-4);ctx.fillRect(x+1,y+(h>>1),w-2,1);
  }
}
function arcada(x,y,w,h,col){
  ctx.fillStyle=col;
  ctx.fillRect(x,y,3,h);ctx.fillRect(x+w-3,y,3,h);
  ctx.fillRect(x,y,w,3);ctx.fillRect(x+3,y+3,w-6,2);
  ctx.fillRect(x-2,y+h-4,7,4);ctx.fillRect(x+w-5,y+h-4,7,4);
}
function niebla(y,alt,col,vel){
  ctx.globalAlpha=.35;ctx.fillStyle=col;
  for(let i=0;i<6;i++){
    const w=40+((i*37)%50), px=((G.tick*vel+i*70)%(VW+90))-70;
    ctx.fillRect(px,y+((i*13)%alt),w,3);
  }
  ctx.globalAlpha=1;
}

function bg(theme){
  const t=G.tick;
  if(theme==='noche'){
    // cielo degradado en bandas duras, al estilo CPC
    const bandas=['#0A0A26','#101038','#18184A','#242460'];
    bandas.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(0,i*22,VW,22);});
    ctx.fillStyle='#2A2A62';ctx.fillRect(0,88,VW,PH-88);
    estrellas(52,86,4);
    luna(258,18,22);
    // nubes jironadas cruzando la luna
    ctx.fillStyle='#3A3A76';
    for(let i=0;i<4;i++){const px=((t*.18+i*97)%(VW+120))-120;
      ctx.fillRect(px,26+((i*11)%20),56+i*8,5);ctx.fillRect(px+10,31+((i*11)%20),40,4);}
    // castillo lejano, mas cerca segun avanzas por el cementerio
    siluetaCastillo(150+G.idx*10,64-G.idx*4,1+G.idx*.12,'#12123A');
    ctx.fillStyle=PAL.o;
    [[172,80],[196,80],[220,74]].forEach(([x,y],i)=>{
      if(((t>>4)+i)%5)ctx.fillRect(x+G.idx*10,y-G.idx*4,3,4);});
    // verja de hierro y colina cercana
    ctx.fillStyle='#1A1A44';
    for(let i=0;i<9;i++)ctx.fillRect(i*38-14,100-((i*17)%18),34,56);
    ctx.fillStyle=PAL.k;
    for(let i=0;i<VW;i+=10){ctx.fillRect(i,118,2,26);ctx.fillRect(i,114,2,3);}
    ctx.fillRect(0,120,VW,2);
    niebla(146,14,'#3a3a6a',.35);
  }
  else if(theme==='azotea'){
    /* Cielo de tormenta en bandas duras. El relampago no es aleatorio puro:
       va por un ciclo largo con un doble destello, que es como se leen de
       verdad en pantalla. */
    const ciclo=G.tick%320;
    const fogonazo=(ciclo<3)||(ciclo>7&&ciclo<10);
    const bandas=fogonazo?['#5A5A8E','#6A6AA0','#7878B0','#8686C0']
                         :['#0A0A1E','#12122C','#1A1A3A','#24244C'];
    bandas.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(0,i*24,VW,24);});
    ctx.fillStyle=fogonazo?'#4A4A7A':'#181834';ctx.fillRect(0,96,VW,PH-96);
    // nubarrones bajos arrastrandose
    ctx.fillStyle=fogonazo?'#6A6A9E':'#101026';
    for(let i=0;i<6;i++){const px=((G.tick*.25+i*83)%(VW+140))-140;
      ctx.fillRect(px,18+((i*13)%26),74+i*9,7);
      ctx.fillRect(px+14,25+((i*13)%26),52,6);}
    /* Pinaculos: agujas estrechas rematadas en punta. Anchos y cuadrados
       parecian una arcada, que es justo lo contrario de una azotea. */
    for(let cap=0;cap<2;cap++){
      ctx.fillStyle=fogonazo?(cap?'#3A3A66':'#2A2A50'):(cap?'#0E0E22':'#080816');
      const base=cap?106:98;
      for(let i=0;i<9;i++){
        const px=4+i*38+cap*19;
        const alto=(cap?34:26)+((i*7)%9);
        const an=cap?7:5;
        ctx.fillRect(px,base-alto,an,alto);              // fuste
        for(let k=0;k<6;k++){                             // chapitel en punta
          const cw=an+4-k;
          if(cw<=0)break;
          ctx.fillRect(px-2+((an+4-cw)>>1),base-alto-3-k*3,cw,3);
        }
        // saliente de la cornisa, para que no floten
        ctx.fillRect(px-2,base-3,an+4,3);
      }
    }
    // el rayo del fogonazo, quebrado, cayendo tras los pinaculos
    if(fogonazo){
      ctx.fillStyle='#E8E8FF';
      let rx=40+((G.tick/320|0)*67)%240, ry=0;
      for(let i=0;i<7;i++){
        const alto=8+((i*5)%7), lado=((i%2)?-1:1)*(3+(i%3));
        ctx.fillRect(rx,ry,2,alto); ry+=alto;
        ctx.fillRect(Math.min(rx,rx+lado),ry,Math.abs(lado)+2,2); rx+=lado;
      }
    }
    /* Lluvia en dos capas: la de atras mas lenta y tenue, la de delante
       rapida y marcada. Es lo que da la sensacion de profundidad. */
    for(let cap=0;cap<2;cap++){
      const n=cap?46:34, vel=cap?9:5, largo=cap?7:4;
      ctx.fillStyle=cap?'#8C8CC8':'#4A4A78';
      for(let i=0;i<n;i++){
        const px=(i*(cap?29:41)+((G.tick*2)%17)*(cap?3:2))%VW;
        const py=((G.tick*vel)+i*37)%(PH+20)-10;
        ctx.fillRect(px,py,1,largo);
      }
    }
  }
  else if(theme==='cielo'){
    for(let i=0;i<6;i++){ctx.fillStyle=['#08081E','#0E0E2A','#141438','#1A1A46','#222252','#2A2A60'][i];
      ctx.fillRect(0,i*30,VW,30);}
    estrellas(64,PH,3);
    // rayos lejanos
    if((t%180)<6){ctx.fillStyle=PAL.a;ctx.globalAlpha=.5;ctx.fillRect(0,0,VW,PH);ctx.globalAlpha=1;}
    luna(20,16,26);
    ctx.fillStyle='#16163E';
    for(let i=0;i<5;i++)ctx.fillRect(i*70-20,120-((i*23)%30),64,70);
    // almenas del propio torreon en primer plano
    ctx.fillStyle='#1E2436';ctx.fillRect(0,PH-26,VW,26);
    for(let i=0;i<20;i++)ctx.fillRect(i*16,PH-32,10,7);
    niebla(150,12,'#20204a',.5);
  }
  else if(theme==='cueva'){
    ctx.fillStyle='#2A1608';ctx.fillRect(0,0,VW,PH);
    // estalactitas y estalagmitas
    ctx.fillStyle='#2a1000';
    for(let i=0;i<14;i++){const px=(i*27+G.idx*13)%VW,h=10+((i*19)%26);
      for(let j=0;j<h;j++)ctx.fillRect(px-((h-j)>>2),j,((h-j)>>1)+2,1);}
    for(let i=0;i<10;i++){const px=(i*37+G.idx*21)%VW,h=8+((i*23)%20);
      for(let j=0;j<h;j++)ctx.fillRect(px-((h-j)>>2),PH-1-j,((h-j)>>1)+2,1);}
    // vetas de cristal que laten
    const pulso=(t>>3)%2;
    [[40,60],[120,40],[210,70],[280,50]].forEach(([x,y],i)=>{
      ctx.fillStyle=i%2?PAL.c:PAL.v;
      ctx.fillRect(x,y,2,7);ctx.fillRect(x+3,y-3,2,9);ctx.fillRect(x+6,y+2,2,6);
      if(pulso){ctx.fillStyle=PAL.C;ctx.fillRect(x+3,y-3,2,4);}
    });
    // lago de lava al fondo
    ctx.fillStyle='#3a0d00';ctx.fillRect(0,PH-20,VW,20);
    ctx.fillStyle=(t>>4)%2?'#5a1400':'#4a1000';
    for(let i=0;i<VW;i+=8)ctx.fillRect(i,PH-20+Math.sin((t+i)*.06)*2,6,3);
  }
  else if(theme==='cripta'){
    ctx.fillStyle='#191E2C';ctx.fillRect(0,0,VW,PH);
    // bóveda de arcos repetidos
    for(let i=0;i<4;i++)arcada(i*84-20+((G.idx*9)%20),18,80,PH-40,'#2A2A40');
    // nichos con urnas
    ctx.fillStyle='#20263A';
    for(let i=0;i<6;i++){const x=14+i*52;ctx.fillRect(x,64,30,34);
      ctx.fillStyle='#05050a';ctx.fillRect(x+3,68,24,30);
      ctx.fillStyle='#2a2a3a';ctx.fillRect(x+9,74,12,20);ctx.fillRect(x+11,70,8,5);
      ctx.fillStyle='#101018';}
    // goteras
    ctx.fillStyle=PAL.n;
    for(let i=0;i<5;i++){const px=(i*67+11)%VW,py=((t*1.4+i*40)%PH);ctx.fillRect(px,py,1,3);}
    niebla(PH-26,16,'#1c1c3a',.25);
  }
  else if(theme==='biblio'){
    ctx.fillStyle='#241430';ctx.fillRect(0,0,VW,PH);
    /* Estanterias de suelo a techo. Los libros no pueden ser todos iguales:
       se varian ancho, alto y color, se dejan huecos, y alguno se apoya
       inclinado o tumbado sobre los demas. Todo derivado de la posicion,
       sin azar, para que no parpadee entre fotogramas. */
    for(let s=0;s<5;s++){
      const y=12+s*30;
      ctx.fillStyle='#361E3A';ctx.fillRect(0,y,VW,26);
      ctx.fillStyle='#2A1730';ctx.fillRect(0,y+1,VW,2);      // sombra del estante
      ctx.fillStyle='#4E2A52';ctx.fillRect(0,y+24,VW,3);
      const COL=[PAL.r,PAL.g,PAL.n,PAL.q,PAL.m,PAL.e,PAL.p];
      let i=0, k=s*31;
      while(i<VW){
        k=(k*1103515245+12345)&0x7fffffff;
        const r=(k>>16)&0xff;
        if(r<26){ i+=2+(r%4); continue; }                    // hueco en la fila
        const an=2+(r%4);                                    // 2 a 5 px de lomo
        const al=9+((r>>2)%13);                              // 9 a 21 px de alto
        const c=COL[(r+s)%COL.length];
        if(r>238&&i+14<VW){
          // un par de libros tumbados encima de los demas
          ctx.fillStyle=c;ctx.fillRect(i,y+24-5,12,4);
          ctx.fillStyle=PAL.W;ctx.fillRect(i+1,y+24-4,10,1);
          i+=14; continue;
        }
        if(r>214){
          // lomo inclinado: se dibuja en escalones de un pixel
          for(let j=0;j<al;j++)ctx.fillStyle=c,ctx.fillRect(i+((j*2/al)|0),y+23-j,an,1);
          ctx.fillStyle=PAL.k;ctx.fillRect(i+an,y+24-al,1,al);
          i+=an+2; continue;
        }
        ctx.fillStyle=c;ctx.fillRect(i,y+24-al,an,al);
        // filo claro y tejuelo, para que el lomo no sea un rectangulo plano
        ctx.fillStyle=PAL.W;ctx.fillRect(i,y+24-al,an,1);
        if(an>=3&&al>12){ctx.fillStyle=PAL.y;ctx.fillRect(i+1,y+24-al+3,an-2,1);}
        ctx.fillStyle=PAL.k;ctx.fillRect(i+an,y+24-al,1,al);  // junta oscura
        i+=an+1;
      }
    }
    /* Velo sobre las estanterias. Con los lomos a todo color la biblioteca
       competia con el primer plano y se perdian heroe y enemigos: es la
       zona con mas luz ambiental del juego (0,66). El velo conserva la
       variedad de tamanos pero devuelve el conjunto a su sitio, detras. */
    ctx.globalAlpha=.52;ctx.fillStyle='#241430';ctx.fillRect(0,0,VW,PH);
    ctx.globalAlpha=1;
    // candelabro colgante
    const osc=Math.sin(t*.03)*3;
    ctx.fillStyle=PAL.d;ctx.fillRect(160+osc,0,1,26);
    ctx.fillStyle=PAL.q;ctx.fillRect(148+osc,26,26,3);
    for(let i=0;i<4;i++){ctx.fillStyle=PAL.e;ctx.fillRect(150+i*7+osc,20,2,7);
      ctx.fillStyle=(t>>3)%2?PAL.y:PAL.o;ctx.fillRect(150+i*7+osc,17,2,3);}
    /* Halo del candelabro. Antes era un fillRect a alfa fija y se veia el
       borde recto, horrible. Ahora un degradado radial como el de las
       antorchas, con el mismo latido. */
    const cxL=161+osc, cyL=24, R=54+((t>>3)%2?2:0);
    const gr=ctx.createRadialGradient(cxL,cyL,2,cxL,cyL,R);
    gr.addColorStop(0,'rgba(255,210,74,0.30)');
    gr.addColorStop(0.45,'rgba(255,180,60,0.13)');
    gr.addColorStop(1,'rgba(255,160,40,0)');
    ctx.fillStyle=gr;ctx.fillRect(cxL-R,cyL-R,R*2,R*2);
  }
  else if(theme==='salon'){
    ctx.fillStyle='#2A0C3C';ctx.fillRect(0,0,VW,PH);
    // sillería y tapices
    ctx.fillStyle='#301040';ctx.fillRect(0,0,VW,PH);
    for(let i=0;i<VW;i+=32){ctx.fillStyle='#26123A';ctx.fillRect(i,0,2,PH);}
    [30,150,250].forEach((x,i)=>{
      ctx.fillStyle=[PAL.r,PAL.n,PAL.g][i];ctx.fillRect(x,14,34,54);
      ctx.fillStyle=PAL.q;ctx.fillRect(x-2,12,38,4);
      ctx.fillStyle=PAL.y;ctx.fillRect(x+13,32,8,8);ctx.fillRect(x+16,26,2,20);
      ctx.fillStyle=PAL.k;ctx.fillRect(x,66,34,2);
    });
    // rosetón central
    ventanaOjival(140,72,40,44,true);
    ctx.globalAlpha=.14;ctx.fillStyle=PAL.b;ctx.fillRect(132,72,56,80);ctx.globalAlpha=1;
    ctx.fillStyle='#1A0828';ctx.fillRect(0,PH-14,VW,14);
  }
  else if(theme==='torreon'){
    ctx.fillStyle='#122A38';ctx.fillRect(0,0,VW,PH);
    // muro curvo de sillares y saeteras al exterior
    for(let y=0;y<PH;y+=12){
      ctx.fillStyle=(y/12)%2?'#16303E':'#122A36';ctx.fillRect(0,y,VW,12);
      ctx.fillStyle='#0C1E28';ctx.fillRect(0,y+11,VW,1);
      for(let x=((y/12)%2)*10;x<VW;x+=20)ctx.fillRect(x,y,1,11);
    }
    [46,150,254].forEach(x=>{
      ctx.fillStyle=PAL.k;ctx.fillRect(x,26,10,40);
      ctx.fillStyle='#102a3a';ctx.fillRect(x+3,30,4,32);
      ctx.fillStyle=PAL.n;ctx.fillRect(x+4,32,2,10);
      estrellasSaetera(x+4,34);
    });
    niebla(PH-30,18,'#0e2a3a',.3);
  }
  else { // piedra
    ctx.fillStyle='#1C1C32';ctx.fillRect(0,0,VW,PH);
    for(let y=0;y<PH;y+=14){
      ctx.fillStyle=(y/14)%2?'#242440':'#1E1E38';ctx.fillRect(0,y,VW,14);
      ctx.fillStyle='#141428';ctx.fillRect(0,y+13,VW,1);
      for(let x=((y/14)%2)*12;x<VW;x+=24)ctx.fillRect(x,y,1,13);
    }
    for(let i=0;i<3;i++)arcada(20+i*98,20,70,PH-46,'#30304C');
    ventanaOjival(60,40,16,30,true);
    ventanaOjival(240,40,16,30,true);
    // banderolas
    [110,200].forEach((x,i)=>{
      const w=Math.sin(t*.04+i)*2;
      ctx.fillStyle=i?PAL.r:PAL.n;ctx.fillRect(x+w,10,14,34);
      ctx.fillStyle=PAL.q;ctx.fillRect(x-2+w,8,18,3);
      ctx.fillStyle=PAL.y;ctx.fillRect(x+5+w,22,4,8);
      ctx.fillStyle='#0e0e1e';ctx.fillRect(x+w,44,7,5);ctx.fillRect(x+7+w,44,7,5);
    });
  }
}
function estrellasSaetera(x,y){
  if(((G.tick>>4)+x)%4)return;
  ctx.fillStyle=PAL.W;ctx.fillRect(x+1,y+((G.tick>>3)%8),1,1);
}

function render(){
  const sx=G.shake?((Math.random()*4-2)|0):0, sy=G.shake?((Math.random()*4-2)|0):0;
  if(G.mode==='creditos')return drawCreditos();
  if(G.mode==='title')return drawTitle();
  if(G.mode==='selPj')return drawSelPj();
  if(G.mode==='selRol')return drawSelRol();
  if(G.mode==='selDif')return drawSelDif();
  if(G.mode==='gameover')return drawEnd(false);
  if(G.mode==='win')return drawEnd(true);

  ctx.save();ctx.translate(sx,sy+HUD_H);   // el marcador ocupa la franja superior
  const r=G.room,L=LEVELS[r.lv];
  bg(L.theme);
  const dark=L.depth<0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=r.m[y][x],px=x*TS,py=y*TS;
    if(c==='#'){
      const sol=cc=>cc==='#'||cc==='='||cc==='P';
      tileStone(px,py,L.theme,{
        arriba: y>0      && sol(r.m[y-1][x]),
        abajo:  y<ROWS-1 && sol(r.m[y+1][x]),
        izq:    x>0      && sol(r.m[y][x-1]),
        der:    x<COLS-1 && sol(r.m[y][x+1])});
    }
    else if(c==='=')tilePlat(px,py);
    else if(c==='P')tilePuente(px,py);
    else if(c==='B')tilePuenteAgua(px,py);
    else if(c==='H')tileLadder(px,py);
    else if(c==='^')tileSpike(px,py);
    else if(c==='~')tileWater(px,py);
    else if(c==='!')tileTorch(px,py);
    else if(c==='i')tileApagada(px,py);
    else if(c==='X')tilePasadizo(px,py);
    else if(c==='D')tileVerja(px,py,!!(G.llaves&&G.llaves[G.lv]));
    else if(c==='K'){
      const quien=(G.guardianes&&G.guardianes[r.lv])||'conejito';
      const bota=Math.abs(Math.sin(G.tick*.06))*2;      // respira, como un peluche vivo
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(px+2,py+15,12,2);
      draw(quien==='conejito'?CONEJITO:BROCOLI,px+2,py-bota);
      // llavecita flotando sobre su cabeza
      const f=(G.tick>>4)%2;
      draw(KEYSPR,px+5,py-13-f);
      ctx.fillStyle=f?PAL.y:PAL.t;ctx.fillRect(px+4,py-16,8,1);
    }
    else if(c==='M'||c==='m'){
      // la puerta ocupa 2x2: se dibuja solo desde la casilla inferior izquierda
      const izq = x>0 && r.m[y][x-1]===c;
      const abajo = y<ROWS-1 && r.m[y+1][x]===c;
      if(!izq && !abajo) tilePuerta(px,py,c==='M');
    }
    else if(c==='A'){
      const izq = x>0 && r.m[y][x-1]==='A';
      const abajo = y<ROWS-1 && r.m[y+1][x]==='A';
      if(!izq && !abajo){
        tilePuerta(px,py,true);
        // flecha dorada parpadeante: no es una puerta cualquiera
        ctx.fillStyle=((G.tick>>3)%2)?PAL.y:PAL.t;
        ctx.fillRect(px+14,py-22,4,10);
        ctx.fillRect(px+12,py-24,8,3);
        ctx.fillRect(px+10,py-21,2,3);ctx.fillRect(px+20,py-21,2,3);
      }
    }
    else if(c==='T')tileShop(px,py);
    else if(c==='N')tilePuesto(px,py);
    else if(c==='$')draw(COINSPR,px+5,py+5);
    else if(c==='$$'){
      const b=(G.tick>>3)%2;
      ctx.fillStyle=PAL.s;ctx.fillRect(px+1,py+5,14,10);
      ctx.fillStyle=PAL.q;ctx.fillRect(px+1,py+3,14,3);
      ctx.fillStyle=PAL.y;ctx.fillRect(px+2,py+8,12,1);ctx.fillRect(px+7,py+6,2,5);
      ctx.fillStyle=PAL.k;ctx.fillRect(px+1,py+14,14,1);
      ctx.fillStyle=b?PAL.W:PAL.y;ctx.fillRect(px+3,py+1,2,2);ctx.fillRect(px+12,py+2,2,2);
    }
    else if(c==='C'){ctx.fillStyle=PAL.b;ctx.fillRect(px+3,py+6,10,8);
      ctx.fillStyle=PAL.C;ctx.fillRect(px+5,py+8,6,4);ctx.fillStyle=PAL.W;ctx.fillRect(px+6,py+3,4,3);}
  }
  r.deco.forEach(decoDraw);

  pickups.forEach(g=>{if((G.tick+g.t)%8<6)draw(COINSPR,g.x,g.y);});
  shots.forEach(s=>{
    const H=RAMPA.hueso;
    if(s.tipo==='hueso'){
      // hueso girando: dos nudillos y el cuerpo
      const g=Math.sin(s.giro), c=Math.cos(s.giro);
      const x1=s.x+2-c*3, y1=s.y+2-g*3, x2=s.x+2+c*3, y2=s.y+2+g*3;
      ctx.fillStyle=H[1];
      ctx.fillRect(Math.round((x1+x2)/2)-1,Math.round((y1+y2)/2)-1,3,3);
      ctx.fillStyle=H[2];
      ctx.fillRect(Math.round(x1)-1,Math.round(y1)-1,3,3);
      ctx.fillRect(Math.round(x2)-1,Math.round(y2)-1,3,3);
      ctx.fillStyle=H[3];ctx.fillRect(Math.round(x1),Math.round(y1)-1,1,1);
    } else if(s.tipo==='canto'){
      // onda sonora: anillos concentricos que laten
      const X=Math.round(s.x)+7, Y=Math.round(s.y)+6;

        else {
          e.paso=(e.paso||0)+Math.abs(e.vx||0)*.22;
          if(Math.abs(e.vx||0)>.05&&Math.abs(e.vy||0)<.01) bal=((e.paso|0)%2)?-1:0;
          if(e.cargando>0) bal=((G.tick>>1)%2)?-1:0;      // tiembla al embestir
          // el aviso previo tiembla mas fuerte: es la senal de apartarse
          if(e.preEmb>0||e.preArm>0) bal=((G.tick>>1)%2)?-2:1;
          if(e.aterrizo>0){ e.aterrizo--; ap=1; }         // amortigua la caida
        }
        /* El sprite puede ser uno solo o una lista de fotogramas. Al andar
           el cuadro sigue al paso; parado, alterna despacio para que no se
           quede completamente congelado. */
        /* OJO: S() devuelve un array DE FILAS, asi que Array.isArray(e.spr)
           es cierto tambien para un sprite suelto y se colaba una sola fila
           como si fuera el sprite entero. Una lista de fotogramas se
           reconoce porque su primer elemento es a su vez un array. */
        if(e.clase==='vampiro'){
          /* Mientras esta desvanecido no se dibuja: solo la marca del suelo,
             que late cada vez mas rapido segun se acerca la caida. */
          if(e.hab===1&&e.fase===0){
            const urg=(e.espera<10)?1:2;
            ctx.fillStyle=((G.tick>>urg)%2)?PAL.R:PAL.r;
            const mx=Math.round(e.marcaX), my=Math.round(e.marcaY);
            ctx.fillRect(mx-11,my-3,22,3);
            ctx.fillRect(mx-8,my-6,16,2);
            ctx.fillStyle=PAL.R;
            for(let i=0;i<4;i++)ctx.fillRect(mx-11+i*7,my-11,2,5);
            return;
          }
          if(e.hab===2){                       // en forma de murcielago
            draw(MURCI_MAYOR[(G.tick>>2)%2],e.x-3,e.y+2,e.face===1);
            return;
          }
          if(e.curado>0){                      // destello rojo al alimentarse
            e.curado--;
            ctx.globalAlpha=.45;ctx.fillStyle=PAL.R;
            ctx.fillRect(e.x-2,e.y-2,e.w+4,e.h+4);ctx.globalAlpha=1;
          }
        }
        const animado = Array.isArray(e.spr) && Array.isArray(e.spr[0]);
        const cuadro = animado
          ? e.spr[(Math.abs(e.vx||0)>.05 ? (e.paso|0) : (G.tick>>4)) % e.spr.length]
          : e.spr;
        // el vampiro se dibuja corrido: su caja es mas estrecha que su sprite
        draw(cuadro,e.x+(e.clase==='vampiro'?-5:0),e.y+bal+ap,e.face===1);
        if(e.preEmb>0||e.preArm>0){
          // reborde parpadeante bajo los pies: va a salir disparado por ahi
          ctx.fillStyle=((G.tick>>2)%2)?PAL.R:PAL.o;
          const d2=(e.embDir<0)?-1:1;
          for(let i=1;i<=3;i++)
            ctx.fillRect(e.x+(d2<0?-i*5:e.w+i*5-4),e.y+e.h-3,4,3);
        }
        if(e.clase==='volador'||e.clase==='cuervo'||e.clase==='gargola'){
          // par de plumas batiendo, para que el aleteo se lea
          ctx.fillStyle=PAL.d;
          const a=Math.sin(e.t*.14)>0?-2:2;
          ctx.fillRect(e.x-2,e.y+5+a,3,2);ctx.fillRect(e.x+e.w-1,e.y+5+a,3,2);
        }
        if(e.canto>0){e.canto--;ctx.fillStyle=(G.tick>>2)%2?PAL.C:PAL.a;
          ctx.fillRect(e.x+e.w/2-1,e.y-5,2,2);ctx.fillRect(e.x+e.w/2+3,e.y-8,2,2);}
        if(e.anim>0){ctx.fillStyle=PAL.q;
          ctx.fillRect(e.face?e.x-6:e.x+e.w,e.y+4,6,3);}
      }
      // barra de vida del minijefe
      ctx.fillStyle=PAL.k;ctx.fillRect(76,8,168,9);
      ctx.fillStyle=PAL.o;ctx.fillRect(78,10,Math.max(0,(e.hp/e.hpMax)*164),5);
      ctx.fillStyle=PAL.W;ctx.fillRect(76,8,168,1);
      text(e.nombre.slice(0,26),Math.round((VW-Math.min(26,e.nombre.length)*6)/2),20,PAL.t);
    }
    else if(e.type==='boss'){
      /* Aviso y descarga de la tormenta. El aviso va DEBAJO del brujo en el
         orden de dibujo pero cubre toda la sala: es lo que le da al jugador
         el segundo largo que necesita para colocarse entre dos rayos. */
      if(e.hab===1&&e.rayos){
        if(e.habT<=60){
          const parp=(e.habT>40)?((G.tick>>1)%2):((G.tick>>2)%2);
          e.rayos.forEach(rx=>{
            ctx.globalAlpha=parp?.55:.25;
            ctx.fillStyle=PAL.v;ctx.fillRect(rx,0,8,PH);
            ctx.fillStyle=parp?PAL.C:PAL.a;
            for(let y=2;y<PH;y+=8)ctx.fillRect(rx+3,y,2,4);
            ctx.globalAlpha=1;
          });
        } else if(e.habT<=110){
          const yy=e.rayoY||0;
          e.rayos.forEach(rx=>{
            ctx.fillStyle=PAL.v;ctx.fillRect(rx,0,8,yy);
            ctx.fillStyle=PAL.C;ctx.fillRect(rx+2,0,4,yy);
            ctx.fillStyle=PAL.W;
            for(let y=0;y<yy;y+=6)ctx.fillRect(rx+3+((y>>1)%2?1:-1),y,2,4);
            // cabeza brillante del frente que baja
            ctx.fillRect(rx-1,Math.max(0,yy-4),10,4);
          });
        }
      }
      /* El brujo tampoco puede ser una lamina: flota, la capa ondea y se
         encoge un instante antes de cada bola. */
      const bal=Math.round(Math.sin(e.t*.07)*2);
      const carga=(e.shootT<10&&e.hab===0)?1:0;
      const izq=P.x<e.x;
      /* Capa: jirones finos y cada vez mas cortos, en violeta oscuro y con
         alfa. En bloques gruesos y a todo color quedaba un pegote pegado
         al costado, no una tela ondeando. */
      const trasero = izq ? e.x+e.w-3 : e.x-1;
      for(let i=0;i<4;i++){
        const o=Math.round(Math.sin(e.t*.10+i*.9)*3);
        const largo=6-i;
        ctx.globalAlpha=.75-i*.14;
        ctx.fillStyle=i<2?'#3A1050':'#26082F';
        ctx.fillRect(izq?trasero:trasero-largo+1, e.y+bal+5+i*4+o, largo, 2);
      }
      ctx.globalAlpha=1;
      draw(BRUJO,e.x,e.y+bal+carga,izq);
      if(carga){ctx.fillStyle=(G.tick>>1)%2?PAL.C:PAL.a;
        ctx.fillRect(e.x+(izq?2:e.w-6),e.y+bal+10,4,4);}
      // baculo en alto mientras conjura, en los dos modos
      if(e.hab!==0){
        ctx.fillStyle=PAL.s;ctx.fillRect(e.x+(izq?-3:e.w),e.y+bal-8,2,18);
        ctx.fillStyle=(G.tick>>1)%2?PAL.C:PAL.W;
        ctx.fillRect(e.x+(izq?-5:e.w-2),e.y+bal-12,6,5);
      }
      /* Burbuja oscura: mientras esta, ni espada ni disparos le entran.
         Se dibuja ENCIMA para que se vea que es una coraza, no un aura. */
      if(e.invulnerable){
        const R=19+Math.sin(e.t*.18)*1.5, cxB=e.x+e.w/2, cyB=e.y+bal+e.h/2;
        ctx.globalAlpha=.42;
        ctx.fillStyle=PAL.n;
        for(let a2=0;a2<Math.PI*2;a2+=.16){
          ctx.fillRect(Math.round(cxB+Math.cos(a2)*R*.85)-2,
                       Math.round(cyB+Math.sin(a2)*R)-2,4,4);
        }
        ctx.globalAlpha=.22;ctx.fillStyle=PAL.m;
        ctx.fillRect(cxB-16,cyB-19,32,38);
        ctx.globalAlpha=.9;
        // chispas girando por el borde
        for(let i=0;i<6;i++){
          const a2=e.t*.09+i*1.05;
          ctx.fillStyle=(i%2)?PAL.v:PAL.C;
          ctx.fillRect(Math.round(cxB+Math.cos(a2)*R*.9)-1,
                       Math.round(cyB+Math.sin(a2)*R*1.05)-1,2,2);
        }
        ctx.globalAlpha=1;
      }
      ctx.fillStyle=PAL.k;ctx.fillRect(88,8,144,8);ctx.fillStyle=PAL.R;
      ctx.fillRect(90,10,Math.max(0,(e.hp/G.bossHp)*140),4);
      ctx.fillStyle=PAL.W;ctx.fillRect(88,8,144,1);}
    ctx.globalAlpha=1;
  });

  // flechas y hechizos del jugador
  pshots.forEach(s=>{
    const izq=s.vx<0;
    if(s.tipo==='flecha'){
      const AW=rampaArma();
      ctx.fillStyle=PAL.s;ctx.fillRect(s.x-(izq?0:4),s.y+1,10,1);
      ctx.fillStyle=AW[3];ctx.fillRect(izq?s.x-2:s.x+6,s.y,3,3);
      ctx.fillStyle=PAL.W;ctx.fillRect(izq?s.x+7:s.x-3,s.y,2,1);ctx.fillRect(izq?s.x+7:s.x-3,s.y+2,2,1);
    } else {
      const f=(G.tick>>1)%3;
      const col={fuego:[PAL.R,PAL.o,PAL.y],hielo:[PAL.b,PAL.C,PAL.W],
                 rayo:[PAL.y,PAL.W,PAL.a],viento:[PAL.c,PAL.G,PAL.e]}[s.tipo];
      ctx.fillStyle=col[0];ctx.fillRect(s.x-1,s.y-1,8,7);
      ctx.fillStyle=col[1];ctx.fillRect(s.x,s.y,6,5);
      ctx.fillStyle=col[2];ctx.fillRect(s.x+1+f,s.y+1,2,3);
      // estela
      ctx.globalAlpha=.5;ctx.fillStyle=col[1];
      ctx.fillRect(izq?s.x+7:s.x-4,s.y+1,4,3);ctx.globalAlpha=1;
      if(s.tipo==='rayo'&&f===0){ctx.fillStyle=PAL.W;
        ctx.fillRect(s.x+2,s.y-4,1,4);ctx.fillRect(s.x+4,s.y+5,1,4);}
    }
  });

  if(!(P.inv>0&&(G.tick>>1)%2)){
    let fr=0, balanceo=0, espejo=P.face;
    if(P.onLadder){
      /* Trepando: los fotogramas alternan con la altura y el heroe se
         voltea a cada peldano, como si cambiara de mano.
         Ojo: al salir por arriba P.y se vuelve negativo, asi que el resto
         hay que normalizarlo o el indice del fotograma se sale del array. */
      const peldano=Math.floor(P.y/5);
      const par=((peldano%2)+2)%2;
      fr=par;
      espejo=par===1;
      if(Math.abs(P.vy)<.05){fr=0;espejo=P.face;}   // parado en la escalera
      balanceo=par?-1:0;
    } else if(!P.onGround){
      fr=2;
      balanceo=P.vy<0?-1:0;                          // se estira al subir
    } else if(Math.abs(P.vx)>.3){
      fr=Math.floor(P.anim)%2;
      balanceo=fr?-1:0;                              // sube y baja al andar
    }
    // red de seguridad: un indice fuera del array congelaba el juego entero
    const idxFr=Math.max(0,Math.min(HERO.length-1, P.dead>0?1:fr));
    drawHeroe(HERO[idxFr],P.x-1,P.y+balanceo,espejo);
    if(P.atrapado>0){
      // hebras pegadas al cuerpo, mas tupidas al principio
      const k=P.atrapado/50;
      ctx.globalAlpha=.45+.45*k; ctx.fillStyle=PAL.w;
      for(let i=0;i<4;i++){
        const yy=P.y+balanceo+2+i*4;
        ctx.fillRect(P.x-2,yy,14,1);
      }
      ctx.fillRect(P.x+1,P.y+balanceo+1,1,14);
      ctx.fillRect(P.x+7,P.y+balanceo+1,1,14);
      ctx.globalAlpha=1;
      ctx.fillStyle=PAL.W;
      if((G.tick>>2)%2)ctx.fillRect(P.x+3,P.y+balanceo+6,2,2);
    }
    if(P.enredado>0){
      // vendas enrolladas: cuantas mas, mas apretado
      const H=RAMPA.hueso, n=(P.vendas||1);
      ctx.fillStyle=H[2];
      for(let i=0;i<n+1;i++){
        const yy=P.y+balanceo+3+i*4+((G.tick>>3)%2);
        ctx.fillRect(P.x-1,yy,12,1);
      }
      ctx.fillStyle=H[3];ctx.fillRect(P.x+(espejo?-3:9),P.y+balanceo+6,4,1);
      if((G.tick>>2)%2){ctx.fillStyle=H[1];ctx.fillRect(P.x+2,P.y+balanceo-3,6,1);}
    }
    if(P.onLadder&&Math.abs(P.vy)>.05){
      // manos agarradas al larguero
      ctx.fillStyle=PAL.k;
      ctx.fillRect(P.x+(espejo?-2:9),P.y+4+balanceo,3,2);
      ctx.fillRect(P.x+(espejo?9:-2),P.y+9+balanceo,3,2);
    }
    if(P.atk>0){
      const AW=rampaArma();
      if(G.rol==='caballero'){
        if(P.atkUp){
          // mandoble alto: la hoja sale recta de la coronilla, sin diagonal
          ctx.fillStyle=AW[2];ctx.fillRect(P.x+4,P.y-13,2,14);
          ctx.fillStyle=AW[3];ctx.fillRect(P.x+4,P.y-13,1,14);
          ctx.fillStyle=AW[1];ctx.fillRect(P.x+1,P.y,8,2);      // guarda
          ctx.fillStyle=AW[3];ctx.fillRect(P.x+4,P.y-14,2,1);   // punta
        } else {
          const sx2=P.face?P.x-13:P.x+P.w;
          ctx.fillStyle=AW[2];ctx.fillRect(sx2,P.y+7,13,2);
          ctx.fillStyle=AW[3];ctx.fillRect(sx2,P.y+7,13,1);
          ctx.fillStyle=AW[1];ctx.fillRect(P.face?sx2+11:sx2-2,P.y+5,2,6);
        }
      } else if(G.rol==='arquero'){
        const sx2=P.face?P.x-5:P.x+P.w-3;
        ctx.fillStyle=PAL.s;ctx.fillRect(sx2,P.y+3,2,11);       // la pala sigue siendo de madera
        ctx.fillStyle=AW[3];ctx.fillRect(sx2,P.y+3,1,11);       // el refuerzo, del material
        ctx.fillStyle=AW[2];ctx.fillRect(sx2+(P.face?2:-1),P.y+4,1,9);
      } else {
        const sx2=P.face?P.x-4:P.x+P.w-2;
        ctx.fillStyle=PAL.s;ctx.fillRect(sx2,P.y+2,2,12);
        ctx.fillStyle=AW[1];ctx.fillRect(sx2-1,P.y,4,3);        // engarce
        ctx.fillStyle=(G.tick>>1)%2?AW[3]:AW[2];ctx.fillRect(sx2,P.y+1,2,2);
      }
    }
  }
  /* --- destello de la habilidad pasiva ---
     Va fuera del parpadeo de invulnerabilidad: si se ocultara en los
     fotogramas pares no se leeria por que no has encajado el golpe. */
  if(P.pas>0){
    const cx=P.x+P.w/2, cy=P.y+P.h/2, k=P.pas/26;
    if(P.pasTipo==='escudo'){
      /* Rodela con forma: fila a fila, para que no lea como un tablon.
         Semianchura por fila; se estrecha arriba y remata en punta abajo. */
      const A=rampaArmadura(), d=P.face?-1:1, ejeX=cx+d*9, ejeY=P.y+1;
      const FORMA=[2,3,4,4,4,4,4,4,4,3,3,2,1];
      ctx.globalAlpha=Math.min(1,.45+k*.55);
      FORMA.forEach((sa,i)=>{
        ctx.fillStyle=A[1];ctx.fillRect(ejeX-sa,ejeY+i,sa*2,1);
        if(sa>2){ctx.fillStyle=A[2];ctx.fillRect(ejeX-sa+1,ejeY+i,sa*2-2,1);}
      });
      ctx.fillStyle=A[3];ctx.fillRect(ejeX-1,ejeY+5,2,3);        // umbo
      if(P.pas>18){                                              // chispas del impacto
        ctx.fillStyle=PAL.W;
        for(let i=0;i<3;i++)ctx.fillRect(ejeX+d*(4+i*3),ejeY+2+i*5,2,1);
      }
      ctx.globalAlpha=1;
    } else if(P.pasTipo==='orbe'){
      /* Dos anillos girando en sentidos opuestos. Sin relleno de fondo:
         una caja translucida no parece un orbe, parece una caja. */
      const g=G.tick*.28;
      for(let i=0;i<8;i++){
        const a=g+i*Math.PI/4, R=12+(1-k)*2;
        ctx.globalAlpha=Math.min(1,.35+k*.65);
        ctx.fillStyle=(i%2)?PAL.C:PAL.a;
        ctx.fillRect(Math.round(cx+Math.cos(a)*R)-1,Math.round(cy+Math.sin(a)*R*.9)-1,2,2);
      }
      for(let i=0;i<4;i++){
        const a=-g*1.4+i*Math.PI/2, R=6;
        ctx.globalAlpha=Math.min(1,.25+k*.45);
        ctx.fillStyle=PAL.W;
        ctx.fillRect(Math.round(cx+Math.cos(a)*R),Math.round(cy+Math.sin(a)*R*.9),1,1);
      }
      ctx.globalAlpha=1;
    } else if(P.pasTipo==='esquiva'){
      /* Estela: tres jirones finos detras del heroe, cada uno mas tenue.
         Una silueta maciza lee como muro, no como movimiento. */
      const d=P.face?1:-1;
      for(let i=1;i<=3;i++){
        ctx.globalAlpha=(.5*k)/i;
        ctx.fillStyle=i===1?PAL.C:PAL.b;
        ctx.fillRect(cx+d*(2+i*4),P.y+3+i,2,12-i*2);
      }
      ctx.globalAlpha=1;
    }
  }

  /* --- iluminacion: penumbra recortada por las luces y halos calidos --- */
  pintarLuz(r,L.theme);

  if(G.msgT>0){const w=G.msg.length*6+8;
    ctx.fillStyle='#000';ctx.fillRect((VW-w)/2,4,w,12);
    ctx.fillStyle=PAL.b;ctx.fillRect((VW-w)/2,4,w,1);ctx.fillRect((VW-w)/2,15,w,1);
    text(G.msg,(VW-w)/2+4,7,PAL.t);}
  ctx.restore();
  drawHud();
  if(G.mode==='shop')drawShop();
  if(G.mode==='pausa')drawPausa();
  if(G.fade>0){ctx.fillStyle='#000';ctx.globalAlpha=Math.min(1,G.fade<2?G.fade:3-G.fade);
    ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1;}
}

function drawHud(){
  /* El marcador va arriba: en movil los botones tapan la franja inferior.
     Dos lineas: vida y oro a la izquierda, estado y sala a la derecha. */
  ctx.fillStyle=PAL.n;ctx.fillRect(0,0,VW,HUD_H);
  ctx.fillStyle=PAL.b;ctx.fillRect(0,HUD_H-1,VW,1);

  // corazones
  /* Cada corazon vale 4 cuartos. Cinco estados de opacidad en vez de tres,
     para que se vea la diferencia que hace la armadura alta. */
  for(let i=0;i<G.maxhp/4;i++){
    const q=Math.max(0,Math.min(4,G.hp-i*4));
    ctx.globalAlpha=[.16,.32,.55,.8,1][q];
    draw(HEARTSPR,3+i*9,3);ctx.globalAlpha=1;
  }
  // vidas restantes, como siluetas del heroe
  const vx=3+Math.ceil(G.maxhp/4)*9+4;
  for(let i=0;i<Math.max(0,G.lives);i++){
    ctx.fillStyle=PAL.e;ctx.fillRect(vx+i*6,3,3,3);ctx.fillRect(vx+i*6,7,3,4);
  }
  // oro
  draw(COINSPR,3,13);text(String(G.gold),11,13,PAL.y);

  // llave de la planta, si esta cerrada
  let dx=54;
  if(G.cerrojos&&G.cerrojos[G.lv]){
    ctx.globalAlpha=(G.llaves&&G.llaves[G.lv])?1:.22;
    draw(KEYSPR,dx,12);ctx.globalAlpha=1;dx+=12;
  }
  // mejoras compradas: con la inicial del material, que es lo que se ve encima
  if(G.armor)  {text('ARM.'+siglaMat(G.armor),dx,13,PAL.a);dx+=42;}
  if(G.botas)  {text('BOT'+G.botas,dx,13,PAL.t);dx+=30;}
  if(G.mejoras){text('ARMA.'+siglaMat(G.mejoras),dx,13,PAL.o);}

  // oficio y dificultad
  text((ROLES[G.rol]?ROLES[G.rol].nombre:'').slice(0,9),150,3,PAL.o);
  text((DIFICULTADES[G.dif]?DIFICULTADES[G.dif].nombre:'').slice(0,9),150,13,PAL.w);

  // aviso de por que no se puede subir: es lo que mas despista
  if(G.mode==='play'&&G.idx===LEVELS[G.lv].rooms-1){
    const guardia=ents.some(e=>e.type==='mini'&&!e.dead);
    const cerrada=G.cerrojos&&G.cerrojos[G.lv]&&!(G.llaves&&G.llaves[G.lv]);
    if(guardia||cerrada){
      const t=guardia?'DERROTA AL GUARDIAN':'NECESITAS LA LLAVE';
      if((G.tick>>4)%2){
        ctx.fillStyle=PAL.r;ctx.fillRect(96,HUD_H-9,128,9);
        text(t,100,HUD_H-8,PAL.y);
      }
    }
  }
  // zona y sala
  const L=LEVELS[G.lv];
  text(L.name.slice(0,12),246,3,PAL.t);
  text('SALA '+(G.idx+1)+'-'+L.rooms,246,13,PAL.w);
}

  compra:['BUENA ELECCION','QUE TE SIRVA ARRIBA','VUELVE CUANDO QUIERAS','TRATO HECHO'],

  ambulante:['SUBO Y BAJO, COMO TU','AQUI ARRIBA COBRO MAS CARO',
             'EN MI CUEVA ESTA MEJOR PRECIO','NO CARGO CON TODO EL GENERO'],

};
function drawShop(){

/* ==========================================================
   TABLA DE MARCAS
   Se guarda en el navegador. Si el almacenamiento no esta disponible
   (modo privado, pagina incrustada, permisos), el juego sigue funcionando
   igual: las marcas duran lo que dure la pestana y no se avisa de nada,
   porque no es culpa del jugador ni puede hacer nada al respecto.
   ========================================================== */
const MARCAS_CLAVE='ravenmoor.marcas.v1';
const MARCAS_TOPE=6;
let marcasMem=null;                       // respaldo en memoria

function cargarMarcas(){
  if(marcasMem)return marcasMem;
  try{
    const cru=window.localStorage.getItem(MARCAS_CLAVE);
    marcasMem=cru?JSON.parse(cru):[];
  }catch(e){ marcasMem=[]; }
  if(!Array.isArray(marcasMem))marcasMem=[];
  return marcasMem;
}
function anotarMarca(){
  const m=cargarMarcas();
  /* Cuenta el oro RECOGIDO en toda la partida, no el que queda en el bolsillo:
     si no, gastar en la tienda penalizaba la marca y salia mas a cuenta no
     comprar nada. */
  m.push({oro:G.oroTotal|0,rol:G.rol,pj:G.pj,dif:G.dif,gano:G.gano?1:0});
  m.sort((a,b)=>b.oro-a.oro);
  m.length=Math.min(m.length,MARCAS_TOPE);
  marcasMem=m;
  try{ window.localStorage.setItem(MARCAS_CLAVE,JSON.stringify(m)); }catch(e){}
}
/* 3400 -> 3K4, 12000 -> 12K. La columna es estrecha y un numero largo se
   comia el nombre del oficio. */
/* 12400 -> 12.400, al modo de aqui. */
function miles(n){
  const s=String(Math.max(0,n|0));
  let r='';
  for(let i=0;i<s.length;i++){
    if(i>0&&(s.length-i)%3===0)r+='.';
    r+=s[i];
  }
  return r;
}
function abrevia(n){
  n=n|0;
  if(n<1000)return String(n);
  if(n>=1000000){
    // sin este tramo, un millon y pico salia como '1250K', peor que la cifra
    const mill=Math.floor(n/1000000), dec=Math.floor((n%1000000)/100000);
    return mill+'M'+(mill<10&&dec?String(dec):'');
  }
  const mil=Math.floor(n/1000), cen=Math.floor((n%1000)/100);
  return mil+'K'+(mil<10&&cen?String(cen):'');
}

/* Chispazo de impacto: nucleo brillante, ocho rayos que se abren y se
   apagan, y esquirlas saliendo despedidas. Sustituye al cuadrado plano que
   habia antes, que no parecia un golpe sino un error de dibujo. */
function chispazo(cx,cy,t,c1,c2){
  const av=Math.min(1,t/22);            // 0 al impactar, 1 ya disipado
  const r=4+av*17, sobra=1-av;
  if(sobra<=0)return;
  ctx.globalAlpha=Math.max(0,sobra);
  // rayos
  for(let i=0;i<8;i++){
    const ang=i*Math.PI/4+(t*.04);
    const lx=Math.cos(ang), ly=Math.sin(ang);
    const largo=r*((i%2)?.62:1);
    ctx.fillStyle=(i%2)?c2:c1;
    for(let d=3;d<largo;d+=2){
      const gr=Math.max(1,3-(d/largo)*2)|0;
      ctx.fillRect(Math.round(cx+lx*d)-(gr>>1),Math.round(cy+ly*d)-(gr>>1),gr,gr);
    }
  }
  // nucleo
  const nr=Math.max(0,5-av*5)|0;
  if(nr>0){
    ctx.fillStyle=PAL.W;ctx.fillRect(cx-nr,cy-nr,nr*2,nr*2);
    ctx.fillStyle=c1;ctx.fillRect(cx-nr-1,cy-1,nr*2+2,2);
    ctx.fillRect(cx-1,cy-nr-1,2,nr*2+2);
  }
  // esquirlas
  for(let i=0;i<7;i++){
    const ang=i*1.14+.4, d=r*1.25+i*2;
    ctx.fillStyle=(i%2)?c1:c2;
    ctx.fillRect(Math.round(cx+Math.cos(ang)*d),Math.round(cy+Math.sin(ang)*d),2,2);
  }
  ctx.globalAlpha=1;
}

function credMuerte(k){
  cielo('#100018','#000');

  ctx.fillStyle='#1a1030';ctx.fillRect(0,110,VW,VH-110);
  ctx.fillStyle=PAL.n;for(let i=0;i<7;i++)ctx.fillRect(20+i*44,60,22,50);
  const gp=G.pj, gr=G.rol;

  ctx.save();
  if(muerto){ctx.translate(206,150);ctx.rotate(Math.min(1.4,(k-150)*.02));ctx.translate(-206,-150);}
  draw(BRUJO,196,130);
  ctx.restore();
  // el heroe, y el golpe segun el oficio
  drawHeroe(HERO[(k>>3)%2],80,134,false,1.6);
  if(!muerto){
    if(G.rol==='caballero'){
      // mandoble: la espada cruza y llega al brujo
      /* La empunadura va en el extremo del HEROE y la punta hacia el brujo.
         Estaba al reves: le golpeaba con el mango. */
      const av=Math.min(1,k/110), ex=96+av*96;
      ctx.fillStyle=RAMPA.madera[1];ctx.fillRect(ex-6,145,6,4);   // puno
      ctx.fillStyle=PAL.W;ctx.fillRect(ex-1,142,3,11);            // guarda
      ctx.fillStyle=PAL.e;ctx.fillRect(ex+2,146,24,3);            // hoja
      ctx.fillStyle=PAL.W;ctx.fillRect(ex+26,147,4,1);            // punta
      if(k>100)chispazo(206,146,k-100,PAL.y,PAL.o);
    } else if(G.rol==='arquero'){
      const fx=100+Math.min(96,k*1.0);
      ctx.fillStyle=PAL.W;ctx.fillRect(fx-4,144,4,2);ctx.fillRect(fx-4,149,4,2);  // plumas
      ctx.fillStyle=RAMPA.madera[2];ctx.fillRect(fx,146,14,2);                    // asta
      ctx.fillStyle=PAL.e;ctx.fillRect(fx+14,145,5,4);                            // punta
      if(k>96)chispazo(206,147,k-96,PAL.W,PAL.C);
    } else {
      // rayo quebrado del mago
      if(k>30){
        /* Zigzag de verdad: se traza como una escalera de tramos cortos,
           horizontal y vertical alternados. Antes eran rectangulos de 8x3
           que se solapaban entre si y el quiebro se perdia: parecia una
           barra recta. La amplitud varia para que no sea un patron. */
        let x=104, y=146;
        for(let i=0;i<14&&x<204;i++){
          const alto=(i%2)?-6-((i*5)%5):6+((i*3)%5);
          ctx.fillStyle=((k+i)>>1)%2?PAL.C:PAL.W;
          ctx.fillRect(x,Math.min(y,y+alto),2,Math.abs(alto));   // tramo vertical
          y+=alto;
          const paso=5+((i*7)%3);
          ctx.fillRect(x,y-1,paso,2);                            // tramo horizontal
          x+=paso;
        }
        // resplandor tenue en el nacimiento, junto a la mano del mago
        ctx.globalAlpha=.35;ctx.fillStyle=PAL.C;
        ctx.fillRect(100,140,8,12);ctx.globalAlpha=1;
        chispazo(206,142,((k-30)%30),PAL.C,PAL.W);
      }
    }
  } else {
    ctext('EL BRUJO OSCURO HA CAÍDO',36,PAL.y);
  }
  G.pj=gp;G.rol=gr;
}

function credCarro(k){
  /* Todo se desplaza a la misma velocidad que el sequito, con los arboles
     de fondo mas lentos para dar profundidad. */
  cielo('#201038','#3a2a18');
  const v=1.15, d=k*v;
  /* El sequito camina hacia la izquierda, asi que el mundo se desplaza hacia
     la DERECHA. Al reves parecia que andaban de espaldas. */
  ctx.fillStyle=PAL.W;for(let i=0;i<22;i++){const px=((i*79+d*.25)%(VW+40)+VW+40)%(VW+40)-20;
    if(((G.tick>>4)+i)%5)ctx.fillRect(px,18+(i*31)%58,1,1);}
  // los arboles APOYAN en el camino: antes flotaban seis pixeles por encima
  for(let i=0;i<9;i++)arbol(((i*70+d*.45)%(VW+80)+VW+80)%(VW+80)-40,128,24);
  ctx.fillStyle='#2a1a0c';ctx.fillRect(0,152,VW,VH-152);
  ctx.fillStyle=RAMPA.madera[1];
  for(let i=0;i<24;i++){const px=((i*32+d)%(VW+40)+VW+40)%(VW+40)-20;ctx.fillRect(px,160,14,2);}
  const bote=Math.round(Math.sin(k*.28)*1);      // el traqueteo del camino
  drawEsc(CARRO,182,132+bote,false,1.25);
  /* El brujo va TUMBADO sobre el carro: de pie no parecia muerto. */
  ctx.save();ctx.translate(212,130+bote);ctx.rotate(Math.PI/2);
  draw(BRUJO,-11,-10,false,.8);ctx.restore();
  drawEsc(CABALLO,116,124+bote,false,1.4);
  const gp=G.pj,gr=G.rol;
  drawHeroe(HERO[(k>>3)%2],78,142+Math.round(Math.sin(k*.31)*1),true,1.6);
  G.pj=gp;G.rol=gr;
}

function credPueblo(k){
  cielo('#182848','#3a2a18');
  // casas
  for(let i=0;i<5;i++){const x=8+i*64;
    ctx.fillStyle='#4a3018';ctx.fillRect(x,96,52,54);
    ctx.fillStyle=PAL.r;ctx.fillRect(x-3,86,58,12);
    ctx.fillStyle=PAL.y;if(((G.tick>>4)+i)%4)ctx.fillRect(x+18,110,12,12);}
  ctx.fillStyle='#2a1a0c';ctx.fillRect(0,150,VW,VH-150);
  // campesinos que saltan y vitorean
  for(let i=0;i<7;i++){
    const x=14+i*44, salto=Math.abs(Math.sin((k+i*19)*.10))*5|0;
    draw(ALDEANO[((k>>3)+i)%2],x,140-salto);
  }
  const bote=Math.round(Math.sin(k*.28)*1);
  drawEsc(CARRO,198,132+bote,false,1.25);
  ctx.save();ctx.translate(228,130+bote);ctx.rotate(Math.PI/2);
  draw(BRUJO,-11,-10,false,.8);ctx.restore();
  drawEsc(CABALLO,132,124+bote,false,1.4);
  const gp=G.pj,gr=G.rol;
  drawHeroe(HERO[(k>>3)%2],96,142,true,1.6);
  G.pj=gp;G.rol=gr;
  if((k>>4)%2)ctext('HURRA',30,PAL.y);
}

function credTrono(k){
  ctx.fillStyle='#101838';ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#1a2450';ctx.fillRect(0,120,VW,VH-120);
  // columnas y estandartes
  for(let i=0;i<4;i++){const x=20+i*84;
    ctx.fillStyle=PAL.w;ctx.fillRect(x,40,10,84);
    ctx.fillStyle=PAL.m;ctx.fillRect(x+22,36,16,40);
    ctx.fillStyle=PAL.y;ctx.fillRect(x+27,44,6,6);}
  // alfombra
  /* Alfombra estrecha y en tono apagado: a todo ancho y en rojo puro se
     comia la escena y el trono no se distinguia. */
  ctx.fillStyle=PAL.r;ctx.fillRect(134,128,52,VH-128);
  ctx.fillStyle='#a01818';ctx.fillRect(140,128,40,VH-128);
  drawEsc(TRONO,126,58,false,2.8);   // el trono, grande y detras
  drawEsc(REY,148,88,false,1.5);     // el rey, sentado delante
  const gp=G.pj,gr=G.rol;
  // el heroe avanza por la alfombra y se detiene
  const av=Math.min(1,k/150);
  drawHeroe(HERO[av<1?((k>>3)%2):0],40+av*76,138,false,1.6);
  G.pj=gp;G.rol=gr;
  if(k>170&&(k>>4)%2)ctext('EL REY DE RAVENMOOR TE RECIBE',34,PAL.e);
}

function credNombramiento(k){
  ctx.fillStyle='#101838';ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#1a2450';ctx.fillRect(0,120,VW,VH-120);
  for(let i=0;i<4;i++){const x=20+i*84;
    ctx.fillStyle=PAL.w;ctx.fillRect(x,40,10,84);}
  ctx.fillStyle=PAL.r;ctx.fillRect(134,128,52,VH-128);
  ctx.fillStyle='#a01818';ctx.fillRect(140,128,40,VH-128);
  drawEsc(TRONO,126,58,false,2.8);
  drawEsc(REY,148,88,false,1.5);
  const gp=G.pj,gr=G.rol;
  // el heroe, arrodillado: se dibuja mas abajo y sin animar
  drawHeroe(HERO[0],126,146,false,1.6);
  G.pj=gp;G.rol=gr;
  // la espada del rey baja hasta el hombro
  const baja=Math.min(1,k/90);
  ctx.save();
  /* El heroe esta a la IZQUIERDA del rey, asi que la hoja tiene que salir
     hacia ese lado y bajar hasta su hombro. Se refleja el eje X para no
     rehacer el dibujo del arma. */
  ctx.translate(152,114);ctx.scale(-1,1);ctx.rotate(-0.35+baja*1.30);
  /* El puno queda en la mano del rey (origen) y la hoja sale hacia el heroe.
     Antes lo agarraba por la punta. */
  ctx.fillStyle=RAMPA.madera[1];ctx.fillRect(-7,-2,7,4);   // puno, en su mano
  ctx.fillStyle=PAL.y;ctx.fillRect(-1,-5,3,9);             // guarda dorada
  ctx.fillStyle=PAL.e;ctx.fillRect(2,-2,26,3);             // hoja
  ctx.fillStyle=PAL.W;ctx.fillRect(28,-1,4,1);             // punta
  ctx.restore();
  // serpentina cayendo del techo
  if(k>95){
    const cols=[PAL.y,PAL.C,PAL.P,PAL.G,PAL.o,PAL.W];
    for(let i=0;i<48;i++){
      const px=(i*37)%VW, py=((k-95)*2.2+i*17)%(VH+30)-20;
      ctx.fillStyle=cols[i%6];
      ctx.fillRect(px,py,2,(i%3)?4:2);
    }
  }
  if(k>120&&(k>>4)%2)ctext('ÁLZATE, NOBLE DE RAVENMOOR',34,PAL.y);
}

function drawCreditos(){
  let k=G.credT, tramo=CREDITOS[0];
  for(const c of CREDITOS){ if(k<c.t){tramo=c;break;} k-=c.t; }
  if(tramo.txt){ credTexto(tramo.txt,k,tramo.t); return; }
  ({muerte:credMuerte,carro:credCarro,pueblo:credPueblo,
    trono:credTrono,nombramiento:credNombramiento})[tramo.esc](k);
  // fundido de entrada y salida de cada animacion
  const bordes=Math.min(k,tramo.t-k);
  if(bordes<18){ctx.globalAlpha=1-bordes/18;ctx.fillStyle='#000';
    ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1;}
}

function drawEnd(win){
  ctx.fillStyle=win?'#000022':'#000';ctx.fillRect(0,0,VW,VH);
  if(win){
    [PAL.y,PAL.o,PAL.R,PAL.P,PAL.b,PAL.C,PAL.G].forEach((c,i)=>{ctx.fillStyle=c;
      ctx.fillRect(0,(G.tick*.6+i*9)%VH,VW,3);});
    ctx.fillStyle='#000';ctx.fillRect(18,58,284,84);
    ctext('EL BRUJO OSCURO HA CAÍDO',30,PAL.y);
    ctext('RAVENMOOR ES LIBRE',42,PAL.e);
    ctext('ORO REUNIDO '+G.oroTotal,54,PAL.t);
  } else {
    ctext('HAS PERECIDO',30,PAL.R);
    ctext('ORO REUNIDO '+G.oroTotal,42,PAL.t);
    ctext(LEVELS[G.lv].name,54,PAL.e);
  }
  /* La tabla se muestra siempre al terminar: es donde el jugador quiere ver
     si su botin ha entrado. La marca recien hecha se senala aparte. */
  drawMarcas(68);
  if((G.tick>>4)%2)
    ctext(win?'PULSA SALTO PARA VOLVER A EMPEZAR':'PULSA SALTO PARA REINTENTAR',186,PAL.W);
}

/* ==========================================================
   BUCLE 50 Hz
   ========================================================== */
let acc=0,last=performance.now(),fallos=0;
function loop(now){
  const dt=Math.min(100,now-last);last=now;acc+=dt;
  let guard=0;
  /* El bucle nunca debe morir: si una excepcion escapaba de aqui,
     requestAnimationFrame dejaba de encadenarse y la pantalla se
     quedaba congelada, antorchas incluidas. */
  try{
    while(acc>=20&&guard++<4){update();acc-=20;}
  }catch(err){
    fallos++;acc=0;
    if(fallos<4)console.error('Fallo en la logica del juego:',err);
  }
  try{ render(); }
  catch(err){
    fallos++;
    if(fallos<4)console.error('Fallo al dibujar:',err);
  }
  requestAnimationFrame(loop);
}
enterRoom('exterior',0,{x:30,y:(ROWS-3)*TS});
G.mode='title';
requestAnimationFrame(loop);
})();
